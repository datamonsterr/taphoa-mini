<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Match</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
.th-strip{scrollbar-width:none}
.th-strip::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); color: var(--camera-ink); font-family: var(--font-sans)">

  <div style="position: absolute; left: 0; top: 20px; width: 390px; display: flex; justify-content: center">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 9999px; background: rgba(255,255,255,.14)">
      <a href="Main.dc.html" aria-label="Một món" aria-current="page" style="display: grid; place-items: center; width: 56px; height: 48px; border-radius: 9999px; background: var(--camera-ink); color: var(--ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></a>
      <a href="Multi.dc.html" aria-label="Nhiều món" style="display: grid; place-items: center; width: 56px; height: 48px; border-radius: 9999px; color: var(--camera-ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 14v6M14 17h6"/></svg></a>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 136px; width: 358px; height: 358px; border-radius: 28px; overflow: hidden; background: #2a2a2e">
    <div style="position: absolute; left: 0; top: 250px; width: 358px; height: 108px; background: #38383e"></div>
    <svg viewBox="0 0 40 70" aria-hidden="true" style="position: absolute; left: 129px; top: 90px; width: 100px; height: 175px"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="#c62f2f"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg>
    <button type="button" onClick="{{toggle}}" aria-pressed="{{pressed}}" aria-label="{{boxAria}}" style="{{boxStyle}}"></button>
    <div style="position: absolute; left: 115px; top: 52px; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 9999px; background: var(--success-soft); color: var(--success); font: 700 14px/18px var(--font-sans)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="th-num">96</span></div>
    <div style="position: absolute; left: 115px; top: 254px; width: 128px; display: flex; justify-content: center; pointer-events: none">
      <button type="button" onClick="{{openAlts}}" aria-expanded="{{expanded}}" aria-label="{{priceAria}}" style="pointer-events: auto; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 16px; border: 0; border-radius: 9999px; cursor: pointer; background: #ffffff; color: #111114; font: 800 20px/24px var(--font-sans); box-shadow: 0 4px 14px rgba(0,0,0,.35)"><span class="th-num">{{price}}</span><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
    <div class="th-strip" role="radiogroup" aria-label="Chọn đúng món" style="position: absolute; left: 0; top: 502px; width: 390px; box-sizing: border-box; padding: 0 16px; display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{alts}}" as="o" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.choose}}" aria-label="{{o.aria}}" style="{{o.style}}">
          <span style="display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 9999px; background: var(--surface-soft)"><svg viewBox="0 0 40 70" aria-hidden="true" style="{{o.artSize}}"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="{{o.fill}}"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg></span>
          <b class="th-num" style="font-size: 17px; line-height: 22px">{{o.price}}</b>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; top: 590px; width: 390px; display: flex; align-items: center; justify-content: space-around">
    <a href="Enroll.dc.html" class="th-ib th-ib-lg" aria-label="Thêm vào kho với giá" style="background: rgba(255,255,255,.14); color: var(--camera-ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></a>
    <a href="Unknown.dc.html" class="th-shutter" aria-label="Chụp" style="display: block; box-sizing: border-box"><span></span></a>
    <a href="Cart.dc.html" class="th-ib th-ib-lg th-ib-accent" aria-label="Thêm vào giỏ" style="box-shadow: 0 0 0 6px rgba(90,67,232,.35)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  </div>

  <div style="position: absolute; left: 16px; top: 756px; width: 358px; display: flex; align-items: center; justify-content: space-between">
    <a href="Cart.dc.html" aria-label="Giỏ hàng: 2 món, 25.000đ" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px 0 12px; border-radius: 9999px; background: rgba(255,255,255,.14); color: var(--camera-ink)"><span style="position: relative; display: grid; place-items: center; width: 32px; height: 32px"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><b class="th-num" style="position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; text-align: center">2</b></span><b class="th-num" style="font-size: 18px">25.000đ</b></a>
    <a href="Inventory.dc.html" aria-label="Vuốt lên: cửa hàng" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; height: 56px; justify-content: center; color: var(--camera-muted)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span style="display: block; width: 36px; height: 5px; border-radius: 9999px; background: var(--camera-muted)"></span></a>
    <a href="Assistant.dc.html" class="th-ib th-ib-accent th-ib-float" aria-label="Mở trợ lý, giữ để nói bán hàng"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 1 1 18 0z"/><path d="M9 11h6M9 14h3"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const on = st.on === undefined ? true : st.on;
    const open = st.open === undefined ? true : st.open;
    const ci = st.ci || 0;
    const opts = [
      { name: 'Sting đỏ 330ml', price: '10.000', fill: '#c62f2f', big: false },
      { name: 'Sting vàng 330ml', price: '10.000', fill: '#e2a94b', big: false },
      { name: 'Sting đỏ 500ml', price: '15.000', fill: '#c62f2f', big: true },
      { name: 'Sting dâu 330ml', price: '10.000', fill: '#a33a6e', big: false }
    ];
    const cur = opts[ci];
    const look = on
      ? 'border: 3px solid #ffffff; background: rgba(90,67,232,.22); box-shadow: 0 0 0 4px rgba(90,67,232,.6);'
      : 'border: 2px dashed rgba(255,255,255,.55); background: transparent;';
    return {
      price: cur.price, pressed: on ? 'true' : 'false', expanded: open ? 'true' : 'false', isOpen: open,
      boxAria: cur.name + (on ? ', đã chọn' : ', bỏ chọn'),
      priceAria: cur.name + ' ' + cur.price + 'đ, xem món khác',
      boxStyle: 'position: absolute; left: 115px; top: 80px; width: 128px; height: 196px; box-sizing: border-box; padding: 0; border-radius: 20px; cursor: pointer; ' + look,
      toggle: () => this.setState({ on: !on }),
      openAlts: () => this.setState({ open: !open }),
      alts: opts.map((o, i) => ({
        price: o.price, fill: o.fill, aria: o.name + ' ' + o.price + 'đ', checked: i === ci ? 'true' : 'false',
        artSize: o.big ? 'width: 26px; height: 44px' : 'width: 22px; height: 38px',
        style: 'flex: none; display: flex; align-items: center; gap: 8px; height: 64px; padding: 6px 16px 6px 6px; box-sizing: border-box; border: 0; border-radius: 9999px; cursor: pointer; ' + (i === ci ? 'background: #ffffff; color: #111114; box-shadow: inset 0 0 0 3px #5a43e8;' : 'background: rgba(255,255,255,.14); color: #ffffff;'),
        choose: () => this.setState({ ci: i, on: true })
      }))
    };
  }
}
</script>
</body>
</html>
