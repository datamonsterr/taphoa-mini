<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thêm món · nói tên và giá</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
.sheet{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.mic{position:relative}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:9999px;border:2px solid var(--accent);opacity:0}
.listening .mic::before{animation:ring 1.6s ease-out infinite}
.listening .mic::after{animation:ring 1.6s .5s ease-out infinite}
.wv{display:block;width:5px;height:8px;border-radius:9999px;background:var(--surface-pressed)}
.listening .wv{background:var(--accent);animation:wv 1s ease-in-out infinite}
.fill{transition:background-color .4s,box-shadow .4s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes wv{0%,100%{height:8px}50%{height:var(--h)}}
@media (prefers-reduced-motion:reduce){.sheet,.mic::before,.mic::after,.wv{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); font-family: var(--font-sans); color: var(--ink)">
  <div style="position: absolute; left: 16px; top: 20px; width: 358px; height: 200px; border-radius: 28px; overflow: hidden; background: #efe9e0; display: grid; place-items: center">
    <img src="img/hao-hao.jpg" alt="Ảnh món vừa chụp" style="width: 170px; height: 156px; object-fit: contain; mix-blend-mode: multiply">
    <span class="th-num" style="position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 12px; border-radius: 9999px; background: rgba(12,12,14,.7); color: #ffffff; font: 600 14px/32px var(--font-sans)">24 khung · đang tải lên</span>
  </div>

  <section class="sheet {{cls}}" aria-label="Tên và giá" style="position: absolute; left: 0; right: 0; bottom: 0; height: 600px; box-sizing: border-box; padding: 28px 16px 16px; border-radius: 36px 36px 0 0; background: var(--surface); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font: var(--text-title)">Tên và giá?</h1>
    <div style="display: flex; align-items: center; gap: 16px">
      <button type="button" class="th-ib th-ib-accent th-ib-lg mic" onClick="{{listen}}" aria-label="Giữ để nói tên và giá"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
      <div aria-hidden="true" style="flex: 1; display: flex; align-items: center; gap: 5px; height: 48px">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="22"><span class="wv" style="--h: {{b.h}}; animation-delay: {{b.d}}"></span></sc-for>
      </div>
    </div>
    <p role="status" style="margin: 0; min-height: 52px; font: 500 20px/26px var(--font-sans); color: {{saidInk}}">{{said}}</p>

    <label style="display: flex; flex-direction: column; gap: 6px; font: var(--text-caption); color: var(--ink-muted)">Tên món
      <input class="fill" value="{{name}}" readonly="readonly" style="height: 56px; padding: 0 16px; border: 0; border-radius: 14px; background: {{fillBg}}; font: var(--text-label); color: var(--ink)">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font: var(--text-caption); color: var(--ink-muted)">Giá bán
      <input class="fill th-num" value="{{price}}" readonly="readonly" style="height: 64px; padding: 0 16px; border: 0; border-radius: 14px; background: {{fillBg}}; font: var(--text-price); color: var(--ink)">
    </label>

    <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
      <a href="CaptureIdentify.dc.html" class="th-btn th-btn-block" style="margin-top: auto; display: flex; justify-content: center; gap: 10px; background: var(--success); color: #ffffff"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Đã lưu · quay lại bán</a>
    </sc-if>
    <sc-if value="{{unsaved}}" hint-placeholder-val="{{true}}">
      <button type="button" class="th-btn th-btn-ink th-btn-block" onClick="{{save}}" style="margin-top: auto; opacity: {{saveOpacity}}">Lưu món</button>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 0 }; }
  componentDidMount() { this.go(); }
  componentWillUnmount() { clearTimeout(this.a); clearTimeout(this.b); }
  go() {
    clearTimeout(this.a); clearTimeout(this.b);
    this.setState({ p: 1 });
    this.a = setTimeout(() => this.setState({ p: 2 }), 2200);
    this.b = setTimeout(() => this.setState({ p: 3 }), 2900);
  }
  renderVals() {
    var p = this.state.p, filled = p >= 3;
    var bars = [];
    for (var i = 0; i < 22; i++) bars.push({ h: (12 + ((i * 29) % 34)) + 'px', d: (-(i * 0.11) % 1).toFixed(2) + 's' });
    return {
      cls: p === 1 ? 'listening' : '',
      bars: bars,
      said: p === 1 ? 'Đang nghe…' : (p >= 2 ? '“Mì Hảo Hảo tôm chua cay năm nghìn”' : 'Giữ nút và nói, ví dụ “Coca lon mười nghìn”'),
      saidInk: p >= 2 ? 'var(--ink)' : 'var(--ink-muted)',
      name: filled ? 'Mì Hảo Hảo tôm chua cay' : '',
      price: filled ? '5.000đ' : '',
      fillBg: filled ? 'var(--accent-soft)' : 'var(--surface-soft)',
      listen: () => this.go(),
      saved: p === 4,
      unsaved: p !== 4,
      saveOpacity: filled ? 1 : 0.4,
      save: () => { if (filled) this.setState({ p: 4 }); }
    };
  }
}
</script>
</body>
</html>
