<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Voice sale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<!-- 16 · /voice draft state: the voice sale sheet with matched, ambiguous and unknown lines. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); font-family: var(--font-sans); color: var(--ink)">
  <div style="position: absolute; left: 16px; top: 136px; width: 358px; height: 358px; border-radius: 28px; background: #2a2a2e"></div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: var(--scrim)"></div>

  <div style="position: absolute; left: 0; top: 120px; width: 390px; height: 724px; box-sizing: border-box; padding: 16px 16px 24px; border-radius: 36px 36px 0 0; background: var(--surface); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: center"><span style="display: block; width: 40px; height: 5px; border-radius: 9999px; background: var(--surface-pressed)"></span></div>
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <a href="Main.dc.html" class="th-ib" aria-label="Đóng"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
      <p style="flex: 1; margin: 6px 0 0; font-size: var(--text-caption); line-height: 20px; color: var(--ink-muted); font-style: italic">“một chai tương ớt hai mươi nghìn, hai gói hảo hảo với một gói bánh bi mười lăm nghìn”</p>
    </div>

    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px">
      <!-- matched -->
      <div class="th-line">
        <div class="th-photo" style="position: relative">
          <svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="#c62f2f"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg>
          <span class="th-badge th-badge-success" aria-label="Khớp" style="position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; padding: 0; justify-content: center; border-radius: 9999px; border: 2px solid var(--surface)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M20 6 9 17l-5-5"/></svg></span>
        </div>
        <div class="th-line-body">
          <div class="th-line-name">Tương ớt Chin-su 250g</div>
          <div class="th-line-price">20.000đ</div>
        </div>
        <div class="th-step">
          <button type="button" class="th-ib" aria-label="Xóa"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger)"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
          <output>1</output>
          <button type="button" class="th-ib" aria-label="Thêm một"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>

      <!-- ambiguous: amber "?" and a three-candidate strip -->
      <div class="th-line" style="border-radius: 22px; background: var(--warning-soft)">
        <div class="th-photo" style="position: relative">
          <svg viewBox="0 0 40 40" aria-hidden="true" style="width: 34px; height: 34px"><rect x="0" y="0" width="40" height="40" rx="6" fill="#e2a94b"/><circle cx="20" cy="22" r="10" fill="#c62f2f"/><rect x="5" y="4" width="30" height="5" rx="2" fill="#ffffff" opacity=".7"/></svg>
          <span class="th-badge th-badge-warning" aria-label="Chưa chắc, chọn đúng món" style="position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; padding: 0; justify-content: center; border-radius: 9999px; border: 2px solid var(--surface); font-weight: 800">?</span>
        </div>
        <div class="th-line-body">
          <div class="th-line-name">Hảo Hảo tôm chua cay</div>
          <div class="th-line-price">4.500đ</div>
        </div>
        <div class="th-step">
          <button type="button" class="th-ib" aria-label="Bớt một"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <output>2</output>
          <button type="button" class="th-ib" aria-label="Thêm một"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div role="radiogroup" aria-label="Chọn đúng món" style="display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 6px">
        <button type="button" class="th-chip" aria-pressed="true">Hảo Hảo tôm chua cay</button>
        <button type="button" class="th-chip" aria-pressed="false">Hảo Hảo sa tế hành</button>
        <button type="button" class="th-chip" aria-pressed="false">Hảo Hảo gà</button>
      </div>

      <!-- unknown: manual line at the spoken price -->
      <div class="th-line">
        <div class="th-photo" style="position: relative; background: var(--surface-soft)">
          <svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ink-muted)"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
        </div>
        <div class="th-line-body">
          <div class="th-line-name" style="color: var(--ink-muted)">bánh bi</div>
          <div style="font-size: var(--text-caption); color: var(--ink-muted)">Chưa có trong kho · chạm để tìm</div>
          <div class="th-line-price">15.000đ</div>
        </div>
        <div class="th-step">
          <button type="button" class="th-ib" aria-label="Xóa"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger)"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
          <output>1</output>
          <button type="button" class="th-ib" aria-label="Thêm một"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </div>

    <div role="radiogroup" aria-label="Cách trả" style="display: flex; gap: 8px; justify-content: center">
      <button type="button" class="th-chip" aria-pressed="{{cashOn}}" onClick="{{pickCash}}">Tiền mặt</button>
      <button type="button" class="th-chip" aria-pressed="{{qrOn}}" onClick="{{pickQr}}">Chuyển khoản</button>
      <button type="button" class="th-chip" aria-pressed="{{creditOn}}" onClick="{{pickCredit}}">Ghi nợ</button>
    </div>

    <!-- 07b customer row; Đổi clears the matched customer in this canvas preview. -->
    <sc-if value="{{isCredit}}" hint-placeholder-val="{{false}}">
      <div style="padding: 12px; border-radius: 28px; background: var(--surface-soft)">
        <sc-if value="{{hasCustomer}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{changeCustomer}}" aria-label="Khách: Chị Lan, đang nợ 1.250.000đ. Đổi khách hàng" style="width: 100%; border: 0; text-align: left; cursor: pointer; font-family: var(--font-sans); color: var(--ink); display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 6px; border-radius: 9999px; background: var(--surface)"><span style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 9999px; background: var(--accent-soft); color: var(--accent); font: 800 20px/1 var(--font-sans)">L</span><span style="flex: 1; min-width: 0"><span class="label" style="display: block">Chị Lan</span><span class="caption th-num" style="display: block; color: var(--ink-muted)">Đang nợ 1.250.000đ · 0912 345 678</span></span><span class="caption" style="color: var(--accent); font-weight: 600">Đổi</span><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent); width: 20px; height: 20px"><path d="M9 6l6 6-6 6"/></svg></button>
        </sc-if>
        <sc-if value="{{needsCustomer}}" hint-placeholder-val="{{false}}">
          <a href="CustomerPick.dc.html" aria-label="Chọn khách để ghi nợ" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 6px; border-radius: 9999px; background: var(--surface)"><span style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 9999px; background: var(--accent-soft); color: var(--accent)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span><span class="label" style="flex: 1">Chọn khách</span><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent); width: 20px; height: 20px"><path d="M9 6l6 6-6 6"/></svg></a>
        </sc-if>
      </div>
    </sc-if>

    <div class="th-total">
      <a href="VoiceListen.dc.html" class="th-ib th-ib-lg th-ib-accent" aria-label="Nói thêm"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg></a>
      <div class="th-total-sum" style="flex: 1; text-align: center"><b aria-live="polite">44.000đ</b></div>
      <a href="{{confirmHref}}" class="th-btn th-btn-xl" aria-label="Đã bán, ghi vào sổ" aria-disabled="{{confirmDisabled}}" tabindex="{{confirmTabIndex}}" style="{{confirmStyle}}"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (this.state && this.state.m) || 'cash';
    const hasCustomer = !(this.state && this.state.customerCleared);
    const blocked = m === 'credit' && !hasCustomer;
    return {
      isCredit: m === 'credit', hasCustomer, needsCustomer: !hasCustomer,
      cashOn: m === 'cash' ? 'true' : 'false', qrOn: m === 'qr' ? 'true' : 'false', creditOn: m === 'credit' ? 'true' : 'false',
      pickCash: () => this.setState({ m: 'cash' }), pickQr: () => this.setState({ m: 'qr' }), pickCredit: () => this.setState({ m: 'credit' }),
      changeCustomer: () => this.setState({ customerCleared: true }),
      confirmHref: blocked ? 'CustomerPick.dc.html' : m === 'qr' ? 'Pay.dc.html' : 'Main.dc.html',
      confirmDisabled: blocked ? 'true' : 'false', confirmTabIndex: blocked ? '-1' : '0',
      confirmStyle: 'padding: 0 26px; background: var(--success); color: var(--on-ink);' + (blocked ? ' opacity: .4; pointer-events: none;' : '')
    };
  }
}
</script>
</body>
</html>
