<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Assistant voice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<!-- 17 · /assistant with the composer microphone held (server transcription). -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); font-family: var(--font-sans); color: var(--ink)">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: var(--scrim)"></div>

  <div style="position: absolute; left: 0; top: 56px; width: 390px; height: 788px; box-sizing: border-box; padding: 12px 16px 20px; border-radius: 36px 36px 0 0; background: var(--surface); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: center"><span style="display: block; width: 40px; height: 5px; border-radius: 9999px; background: var(--surface-pressed)"></span></div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" class="th-ib" aria-label="Cuộc trò chuyện"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <span style="flex: 1; font-size: var(--text-heading); font-weight: 700">Trợ lý</span>
      <button type="button" class="th-ib" aria-label="Cuộc trò chuyện mới"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <a href="Main.dc.html" class="th-ib" aria-label="Đóng"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
    </div>

    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 8px">
      <div style="align-self: flex-end; max-width: 300px; padding: 12px 16px; border-radius: 22px 22px 6px 22px; background: var(--accent-soft); font-size: var(--text-body); line-height: 26px">Hôm nay bán được bao nhiêu?</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: var(--text-caption); color: var(--ink-muted)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M20 6 9 17l-5-5"/></svg>Đã xem doanh thu hôm nay</div>
      <div style="align-self: flex-start; max-width: 320px; font-size: var(--text-body); line-height: 26px">Hôm nay bán <b>48 đơn</b>, doanh thu <b>1.250.000đ</b>: tiền mặt 820.000đ, chuyển khoản 430.000đ. Bán chạy nhất là Sting đỏ (14 chai).</div>
      <div style="align-self: flex-start; width: 320px; padding: 14px 16px; border-radius: 22px; background: var(--surface-soft)">
        <div style="font-size: var(--text-label); font-weight: 600; margin-bottom: 10px">Biểu đồ 7 ngày</div>
        <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 10px; height: 72px"><span style="flex: 1; height: 40%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 55%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 35%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 70%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 62%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 80%; border-radius: 6px 6px 0 0; background: var(--accent-soft)"></span><span style="flex: 1; height: 100%; border-radius: 6px 6px 0 0; background: var(--accent)"></span></div>
      </div>
      <div style="display: flex; gap: 8px; align-self: flex-start">
        <button type="button" class="th-ib" aria-label="Câu trả lời hữu ích"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
        <button type="button" class="th-ib" aria-label="Câu trả lời chưa tốt"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 14V2M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>
      </div>
    </div>

    <div style="text-align: center; font-size: var(--text-caption); color: var(--ink-muted)">Đang nghe, thả tay để dừng</div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div aria-label="Ô nhập, đang nghe" style="flex: 1; height: 56px; border-radius: 9999px; background: var(--surface-soft); display: flex; align-items: center; gap: 5px; padding: 0 20px; box-sizing: border-box">
        <span style="width: 5px; height: 10px; border-radius: 3px; background: var(--accent-soft)"></span><span style="width: 5px; height: 20px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 30px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 18px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 26px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 14px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 22px; border-radius: 3px; background: var(--accent)"></span><span style="width: 5px; height: 8px; border-radius: 3px; background: var(--accent-soft)"></span>
        <span style="margin-left: 10px; font-size: var(--text-caption); color: var(--ink-muted); font-variant-numeric: tabular-nums">0:04</span>
      </div>
      <div style="position: relative; width: 56px; height: 56px; display: grid; place-items: center">
        <span aria-hidden="true" style="position: absolute; inset: -10px; border-radius: 9999px; background: var(--accent); opacity: .18"></span>
        <button type="button" class="th-ib th-ib-accent" aria-label="Đang nghe, thả tay để dừng" aria-pressed="true"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg></button>
      </div>
      <button type="button" class="th-ib th-ib-ink" aria-label="Gửi" disabled style="opacity: .4"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
