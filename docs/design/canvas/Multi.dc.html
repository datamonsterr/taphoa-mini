<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Multi select</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
.th-strip{scrollbar-width:none}
.th-strip::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); color: var(--camera-ink); font-family: var(--font-sans)">

  <div style="position: absolute; left: 0; top: 20px; width: 390px; display: flex; justify-content: center">
    <div style="display: flex; gap: 4px; padding: 4px; border-radius: 9999px; background: rgba(255,255,255,.14)">
      <a href="Main.dc.html" aria-label="Một món" style="display: grid; place-items: center; width: 56px; height: 48px; border-radius: 9999px; color: var(--camera-ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></a>
      <a href="Multi.dc.html" aria-label="Nhiều món" aria-current="page" style="display: grid; place-items: center; width: 56px; height: 48px; border-radius: 9999px; background: var(--camera-ink); color: var(--ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M17 14v6M14 17h6"/></svg></a>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 136px; width: 358px; height: 358px; border-radius: 28px; overflow: hidden; background: #2a2a2e">
    <div style="position: absolute; left: 0; top: 230px; width: 358px; height: 128px; background: #38383e"></div>
    <svg viewBox="0 0 40 70" aria-hidden="true" style="position: absolute; left: 30px; top: 62px; width: 60px; height: 105px"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="#c62f2f"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg>
    <svg viewBox="0 0 40 70" aria-hidden="true" style="position: absolute; left: 114px; top: 30px; width: 56px; height: 100px"><rect x="15" y="2" width="10" height="7" rx="2" fill="#2f6fc6"/><path d="M13 9h14l3 9v46a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V18z" fill="#cfe0f5"/><rect x="10" y="30" width="20" height="14" fill="#2f6fc6"/></svg>
    <svg viewBox="0 0 40 70" aria-hidden="true" style="position: absolute; left: 270px; top: 72px; width: 60px; height: 116px"><rect x="8" y="10" width="24" height="52" rx="6" fill="#c62f2f"/><rect x="10" y="6" width="20" height="6" rx="3" fill="#a1a1a8"/><path d="M8 34c8-6 16 6 24 0" stroke="#ffffff" stroke-width="3" fill="none"/></svg>
    <svg viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; left: 124px; top: 194px; width: 122px; height: 122px"><rect x="0" y="0" width="40" height="40" rx="6" fill="#e2a94b"/><circle cx="20" cy="22" r="10" fill="#c62f2f"/><rect x="5" y="4" width="30" height="5" rx="2" fill="#ffffff" opacity=".7"/></svg>

    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <button type="button" onClick="{{item.toggle}}" aria-pressed="{{item.pressed}}" aria-label="{{item.aria}}" style="{{item.boxStyle}}">
        <sc-if value="{{item.on}}" hint-placeholder-val="{{true}}"><b class="th-num" style="position: absolute; left: -12px; top: -12px; width: 28px; height: 28px; border-radius: 9999px; background: var(--accent); color: var(--on-accent); font: 700 15px/28px var(--font-sans); text-align: center; box-shadow: 0 0 0 2px #ffffff">{{item.num}}</b></sc-if>
        <sc-if value="{{item.off}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 9999px; border: 2px solid rgba(255,255,255,.7); background: rgba(12,12,14,.5)"></span></sc-if>
      </button>
    </sc-for>

    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <div style="{{item.labelWrap}}">
        <button type="button" onClick="{{item.openAlts}}" aria-expanded="{{item.expanded}}" aria-label="{{item.priceAria}}" style="{{item.labelStyle}}"><span class="th-num">{{item.price}}</span><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </sc-for>

    <sc-if value="{{hasOpen}}" hint-placeholder-val="{{false}}">
      <div class="th-strip" role="radiogroup" aria-label="Chọn đúng món" style="{{stripStyle}}">
        <sc-for list="{{alts}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.choose}}" aria-label="{{o.aria}}" style="{{o.style}}">
            <span style="display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 9999px; background: var(--surface-soft)">
              <sc-if value="{{o.kSting}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="#c62f2f"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg></sc-if>
              <sc-if value="{{o.kStingY}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="15" y="2" width="10" height="8" rx="2" fill="#111114"/><path d="M14 10h12l4 10v44a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z" fill="#e2a94b"/><rect x="10" y="32" width="20" height="14" fill="#ffffff" opacity=".85"/></svg></sc-if>
              <sc-if value="{{o.kWater}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="15" y="2" width="10" height="7" rx="2" fill="#2f6fc6"/><path d="M13 9h14l3 9v46a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V18z" fill="#cfe0f5"/><rect x="10" y="30" width="20" height="14" fill="#2f6fc6"/></svg></sc-if>
              <sc-if value="{{o.kCoca}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="8" y="10" width="24" height="52" rx="6" fill="#c62f2f"/><rect x="10" y="6" width="20" height="6" rx="3" fill="#a1a1a8"/><path d="M8 34c8-6 16 6 24 0" stroke="#ffffff" stroke-width="3" fill="none"/></svg></sc-if>
              <sc-if value="{{o.kCocaZ}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 70" aria-hidden="true" style="width: 22px; height: 38px"><rect x="8" y="10" width="24" height="52" rx="6" fill="#111114"/><rect x="10" y="6" width="20" height="6" rx="3" fill="#a1a1a8"/><path d="M8 34c8-6 16 6 24 0" stroke="#c62f2f" stroke-width="3" fill="none"/></svg></sc-if>
              <sc-if value="{{o.kNoodle}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 40" aria-hidden="true" style="width: 32px; height: 32px"><rect x="0" y="0" width="40" height="40" rx="6" fill="#e2a94b"/><circle cx="20" cy="22" r="10" fill="#c62f2f"/><rect x="5" y="4" width="30" height="5" rx="2" fill="#ffffff" opacity=".7"/></svg></sc-if>
              <sc-if value="{{o.kNoodleG}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 40 40" aria-hidden="true" style="width: 32px; height: 32px"><rect x="0" y="0" width="40" height="40" rx="6" fill="#18703c"/><circle cx="20" cy="22" r="10" fill="#e2a94b"/><rect x="5" y="4" width="30" height="5" rx="2" fill="#ffffff" opacity=".7"/></svg></sc-if>
            </span>
            <b class="th-num" style="font-size: 17px; line-height: 22px">{{o.price}}</b>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; top: 590px; width: 390px; display: flex; align-items: center; justify-content: space-around">
    <a href="Enroll.dc.html" class="th-ib th-ib-lg" aria-label="Thêm vào kho với giá" style="background: rgba(255,255,255,.14); color: var(--camera-ink)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></a>
    <a href="Multi.dc.html" class="th-shutter" aria-label="Chụp lại" style="display: block; box-sizing: border-box"><span></span></a>
    <a href="Cart.dc.html" class="th-ib th-ib-lg th-ib-accent" aria-label="Thêm tất cả vào giỏ" style="position: relative; box-shadow: 0 0 0 6px rgba(90,67,232,.35)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b class="th-num" style="position: absolute; right: -6px; top: -6px; min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: var(--surface); color: var(--accent); font: 800 16px/28px var(--font-sans); text-align: center">{{count}}</b></a>
  </div>

  <div style="position: absolute; left: 16px; top: 756px; width: 358px; display: flex; align-items: center; justify-content: space-between">
    <a href="Cart.dc.html" aria-label="Giỏ hàng: 2 món, 25.000đ" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px 0 12px; border-radius: 9999px; background: rgba(255,255,255,.14); color: var(--camera-ink)"><span style="position: relative; display: grid; place-items: center; width: 32px; height: 32px"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg><b class="th-num" style="position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; text-align: center">2</b></span><b class="th-num" style="font-size: 18px">25.000đ</b></a>
    <a href="Inventory.dc.html" aria-label="Vuốt lên: cửa hàng" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; height: 56px; justify-content: center; color: var(--camera-muted)"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span style="display: block; width: 36px; height: 5px; border-radius: 9999px; background: var(--camera-muted)"></span></a>
    <span style="width: 130px"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || { sting: true, water: false, coca: true, noodle: true };
    const pick = st.pick || {};
    const open = st.open === undefined ? 'noodle' : st.open;
    const defs = [
      { id: 'sting', x: 20, y: 52, w: 80, h: 126, opts: [{ k: 'Sting', name: 'Sting đỏ', price: '10.000' }, { k: 'StingY', name: 'Sting vàng', price: '10.000' }] },
      { id: 'water', x: 104, y: 20, w: 76, h: 120, opts: [{ k: 'Water', name: 'Aquafina 500ml', price: '5.000' }] },
      { id: 'coca', x: 260, y: 66, w: 80, h: 128, opts: [{ k: 'Coca', name: 'Coca 330ml', price: '10.000' }, { k: 'CocaZ', name: 'Coca Zero', price: '11.000' }] },
      { id: 'noodle', x: 114, y: 184, w: 142, h: 142, opts: [{ k: 'Noodle', name: 'Hảo Hảo tôm chua cay', price: '4.500' }, { k: 'NoodleG', name: 'Hảo Hảo gà', price: '4.500' }, { k: 'Noodle', name: 'Hảo Hảo ly', price: '8.000' }] }
    ];
    let n = 0;
    const items = defs.map((d) => {
      const on = !!sel[d.id];
      const num = on ? ++n : 0;
      const cur = d.opts[pick[d.id] || 0];
      const look = on
        ? 'border: 3px solid #ffffff; background: rgba(90,67,232,.22); box-shadow: 0 0 0 4px rgba(90,67,232,.6);'
        : 'border: 2px dashed rgba(255,255,255,.55); background: transparent;';
      const labelLook = on ? 'background: #ffffff; color: #111114;' : 'background: rgba(12,12,14,.7); color: #ffffff;';
      return {
        on, off: !on, num, pressed: on ? 'true' : 'false', price: cur.price,
        expanded: open === d.id ? 'true' : 'false',
        aria: cur.name + (on ? ', đã chọn' : ', bỏ chọn'),
        priceAria: cur.name + ' ' + cur.price + 'đ, xem món khác',
        boxStyle: 'position: absolute; box-sizing: border-box; padding: 0; border-radius: 18px; cursor: pointer; left: ' + d.x + 'px; top: ' + d.y + 'px; width: ' + d.w + 'px; height: ' + d.h + 'px; ' + look,
        labelWrap: 'position: absolute; left: ' + d.x + 'px; top: ' + (d.y + d.h - 22) + 'px; width: ' + d.w + 'px; display: flex; justify-content: center; pointer-events: none',
        labelStyle: 'pointer-events: auto; display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 0 14px; border: 0; border-radius: 9999px; cursor: pointer; font: 800 18px/22px var(--font-sans); box-shadow: 0 4px 14px rgba(0,0,0,.35); ' + labelLook,
        toggle: () => this.setState({ sel: { ...sel, [d.id]: !on } }),
        openAlts: () => this.setState({ open: open === d.id ? null : d.id })
      };
    });
    const od = defs.find((d) => d.id === open);
    let alts = [], stripStyle = '';
    if (od) {
      const ci = pick[od.id] || 0;
      alts = od.opts.map((o, i) => ({
        price: o.price, aria: o.name + ' ' + o.price + 'đ', checked: i === ci ? 'true' : 'false',
        kSting: o.k === 'Sting', kStingY: o.k === 'StingY', kWater: o.k === 'Water', kCoca: o.k === 'Coca', kCocaZ: o.k === 'CocaZ', kNoodle: o.k === 'Noodle', kNoodleG: o.k === 'NoodleG',
        style: 'flex: none; display: flex; align-items: center; gap: 8px; height: 64px; padding: 6px 16px 6px 6px; box-sizing: border-box; border: 0; border-radius: 9999px; cursor: pointer; ' + (i === ci ? 'background: #ffffff; color: #111114; box-shadow: 0 0 0 3px #5a43e8;' : 'background: rgba(12,12,14,.82); color: #ffffff;'),
        choose: () => this.setState({ pick: { ...pick, [od.id]: i }, open: null, sel: { ...sel, [od.id]: true } })
      }));
      const below = od.y + od.h + 26;
      const top = below + 64 <= 350 ? below : Math.max(8, od.y - 76);
      stripStyle = 'position: absolute; left: 0; top: ' + top + 'px; width: 358px; box-sizing: border-box; padding: 4px 12px; display: flex; gap: 8px; overflow-x: auto';
    }
    return { items, count: n, hasOpen: !!od, alts, stripStyle };
  }
}
</script>
</body>
</html>
