<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Enroll with price</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/taphoa/tokens.css">
<link rel="stylesheet" href="ds/taphoa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;padding:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--camera-bg); font-family: var(--font-sans); color: var(--ink)">
  <div style="position: absolute; left: 16px; top: 20px; width: 358px; height: 120px; border-radius: 28px; background: #2a2a2e"></div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: var(--scrim)"></div>

  <div style="position: absolute; left: 0; top: 104px; width: 390px; height: 740px; box-sizing: border-box; padding: 16px; border-radius: 36px 36px 0 0; background: var(--surface); box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: center"><span style="display: block; width: 40px; height: 5px; border-radius: 9999px; background: var(--surface-pressed)"></span></div>

    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Unknown.dc.html" class="th-ib" aria-label="Đóng"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></a>
      <div style="flex: 1; display: flex; justify-content: flex-end; gap: 8px">
        <div style="display: grid; place-items: center; width: 72px; height: 72px; border-radius: 22px; background: var(--surface-soft); box-shadow: inset 0 0 0 3px var(--accent)"><svg viewBox="0 0 60 60" aria-hidden="true" style="width: 52px; height: 52px"><path d="M12 14c6-4 30-4 36 0l4 38a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="#f2e6cf"/><path d="M14 8h32l2 8H12z" fill="#d9c8a6"/><circle cx="22" cy="32" r="5" fill="#a34f00"/><circle cx="36" cy="28" r="5" fill="#a34f00"/><circle cx="30" cy="42" r="5" fill="#a34f00"/></svg></div>
        <button type="button" aria-label="Thêm ảnh góc khác" style="display: grid; place-items: center; width: 72px; height: 72px; box-sizing: border-box; border: 2px dashed var(--line-strong); border-radius: 22px; background: var(--surface); color: var(--ink-muted); cursor: pointer"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
        <span class="th-num" aria-label="1 trên 5 ảnh" style="align-self: flex-end; font: 500 15px/20px var(--font-sans); color: var(--ink-muted)">1/5</span>
      </div>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; border-radius: 9999px; background: var(--surface-soft); color: var(--ink-muted)">
      <svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      <input type="text" placeholder="Tên" aria-label="Tên (không bắt buộc)" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 18px/26px var(--font-sans); color: var(--ink); outline: none">
    </label>

    <output aria-live="polite" aria-label="Giá bán" class="th-big-total" style="display: block; text-align: center; padding: 4px 0">{{priceText}}</output>

    <div class="th-keypad">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" class="th-key" onClick="{{k.press}}" aria-label="{{k.aria}}" style="{{k.style}}">
          <sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M18 9l-6 6M12 9l6 6"/></svg></sc-if>
          <sc-if value="{{k.isDigit}}" hint-placeholder-val="{{true}}">{{k.label}}</sc-if>
        </button>
      </sc-for>
    </div>

    <a href="Cart.dc.html" class="th-btn th-btn-ink th-btn-block" aria-label="Lưu vào kho và thêm vào giỏ" style="margin-top: auto"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const digits = (this.state && this.state.digits != null) ? this.state.digits : '15000';
    const set = (d) => this.setState({ digits: d });
    const fmt = (s) => (s === '' ? '0' : String(Number(s)).replace(/\B(?=(\d{3})+(?!\d))/g, '.')) + 'đ';
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'back'];
    const keys = labels.map((l) => {
      const isBack = l === 'back';
      return {
        label: l, isBack, isDigit: !isBack,
        aria: isBack ? 'Xóa' : l,
        style: l === '000' ? 'font-size: 22px' : '',
        press: () => {
          if (isBack) return set(digits.slice(0, -1));
          const next = (digits === '0' ? '' : digits) + l;
          if (next.length <= 9) set(String(Number(next)));
        }
      };
    });
    return { keys, priceText: fmt(digits) };
  }
}
</script>
</body>
</html>
