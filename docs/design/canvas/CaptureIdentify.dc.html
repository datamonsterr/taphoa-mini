<style>
body{margin:0;background:#0c0c0e}
a{color:inherit;text-decoration:none}
.trk{position:absolute;animation:drift 3.2s ease-in-out infinite}
.trk.t2{animation-duration:3.8s;animation-delay:-1.2s}
.trk.t3{animation-duration:4.4s;animation-delay:-2.1s}
.box{position:absolute;inset:0;border-radius:18px;border:2.5px solid #ffffff;box-shadow:0 0 0 1px rgba(17,17,20,.2),0 6px 18px -6px rgba(17,17,20,.35)}
.box.amb{box-shadow:none}
.box.amb{border-style:dashed;border-color:var(--camera-ring)}
.pill{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;padding:6px 12px 7px;border-radius:16px;background:#ffffff;color:var(--ink);font:600 13px/16px var(--font-sans);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.pill b{font:800 22px/26px var(--font-sans);font-variant-numeric:tabular-nums}
.qpill{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:9999px;background:var(--camera-ring);color:#1a1205;font:700 13px/16px var(--font-sans)}
.qpill i{display:grid;place-items:center;width:24px;height:24px;border-radius:9999px;background:#1a1205;color:var(--camera-ring);font-style:normal}
.tid{position:absolute;right:6px;top:6px;height:22px;padding:0 8px;border-radius:9999px;background:rgba(12,12,14,.6);color:var(--camera-muted);font:600 11px/22px var(--font-sans);font-variant-numeric:tabular-nums}
.stab{position:absolute;inset:-8px;transform:rotate(-90deg)}
.stab circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:301;stroke-dashoffset:301;animation:hold 2.4s var(--e,ease-out) infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}
@keyframes hold{0%{stroke-dashoffset:301}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@media (prefers-reduced-motion:reduce){.trk,.stab circle{animation:none}}
</style>
</helmet>
