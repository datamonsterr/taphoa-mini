<style>
body{margin:0;padding:0;background:#ffffff}
a{color:inherit;text-decoration:none}
.th-stat b{font-size:22px;line-height:28px;white-space:nowrap}
</style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 16px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Dashboard.dc.html" class="th-ib" aria-label="Quay lại"><svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 class="title" style="margin: 0; flex: 1">Sổ nợ</h1>
  </div>

  <div class="th-stats">
    <div class="th-stat th-stat-wide" aria-label="Tổng nợ"><span class="caption" style="color: var(--ink-muted)">Tổng nợ · 4 khách</span><b class="th-num" style="font-size: 32px; line-height: 38px">3.450.000đ</b></div>
    <div class="th-stat" aria-label="Quá hạn" style="background: var(--danger-soft)"><span class="caption" style="color: var(--danger)">Quá hạn 7 ngày</span><b class="th-num" style="color: var(--danger)">2.070.000đ</b></div>
    <div class="th-stat" aria-label="Thu tuần này" style="background: var(--success-soft)"><span class="caption" style="color: var(--success)">Thu tuần này</span><b class="th-num" style="color: var(--success)">500.000đ</b></div>
  </div>

  <label style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; border-radius: 9999px; background: var(--surface-soft); color: var(--ink-muted)">
    <svg class="th-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" placeholder="Tìm khách hàng" aria-label="Tìm khách hàng" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 18px/26px var(--font-sans); color: var(--ink); outline: none">
  </label>

  <div role="radiogroup" aria-label="Lọc" style="display: flex; gap: 8px">
    <button type="button" class="th-chip" role="radio" aria-checked="false" aria-pressed="false">Tất cả</button>
    <button type="button" class="th-chip" role="radio" aria-checked="true" aria-pressed="true">Quá hạn</button>
  </div>

  <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px">
    <a href="Customer.dc.html" class="th-line" aria-label="Chị Lan nợ 1.250.000đ, quá hạn 12 ngày"><span style="display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 9999px; background: var(--accent-soft); color: var(--accent); font: 800 22px/1 var(--font-sans)">L</span><span class="th-line-body"><span class="th-line-name">Chị Lan</span><span class="caption th-num" style="color: var(--ink-muted)">0912 345 678 · 12 ngày</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b class="th-num" style="font-size: 20px">1.250.000đ</b><span class="th-badge th-badge-danger" style="height: 26px; font-size: 13px">Quá hạn</span></span></a>
    <a href="Customer.dc.html" class="th-line" aria-label="Anh Nam nợ 820.000đ, quá hạn 9 ngày"><span style="display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 9999px; background: var(--success-soft); color: var(--success); font: 800 22px/1 var(--font-sans)">N</span><span class="th-line-body"><span class="th-line-name">Anh Nam</span><span class="caption th-num" style="color: var(--ink-muted)">0987 654 321 · 9 ngày</span></span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><b class="th-num" style="font-size: 20px">820.000đ</b><span class="th-badge th-badge-danger" style="height: 26px; font-size: 13px">Quá hạn</span></span></a>
    <a href="Customer.dc.html" class="th-line" aria-label="Cô Ba nợ 380.000đ, 3 ngày" style="opacity: .55"><span style="display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 9999px; background: var(--warning-soft); color: var(--warning); font: 800 22px/1 var(--font-sans)">B</span><span class="th-line-body"><span class="th-line-name">Cô Ba</span><span class="caption th-num" style="color: var(--ink-muted)">Không có số · 3 ngày</span></span><b class="th-num" style="font-size: 20px">380.000đ</b></a>
    <a href="Customer.dc.html" class="th-line" aria-label="Bác Tư nợ 1.000.000đ, 1 ngày" style="opacity: .55"><span style="display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 9999px; background: var(--surface-soft); color: var(--ink); font: 800 22px/1 var(--font-sans)">T</span><span class="th-line-body"><span class="th-line-name">Bác Tư</span><span class="caption th-num" style="color: var(--ink-muted)">0903 111 222 · hôm qua</span></span><b class="th-num" style="font-size: 20px">1.000.000đ</b></a>
  </div>
</div>
