asyncapi: 3.0.0
info:
  title: Tạp Hóa Mini events
  version: 0.1.0-draft
  description: |
    Status: **Proposed** (2026-10-23). Describes the backend (`taphoa-api`) as the
    application. Events are written to the `outbox_events` table in the same transaction as
    the change, relayed to Redis pub/sub, and fanned out to phones over Server-Sent Events.
    Delivery is at least once; consumers dedupe by `id`. Events are hints: phones refresh
    catalog data from `GET /v1/sync/changes`, never from event payloads.
    See [data-model.md §5](../data-model.md#5-events).

servers:
  api:
    host: localhost:8080
    protocol: http
    description: SSE endpoint `GET /v1/events` (Bearer JWT). Production uses the Railway domain over HTTPS.
    security:
      - $ref: '#/components/securitySchemes/bearerAuth'
  redis:
    host: redis:6379
    protocol: redis
    description: Railway private network. Pub/sub between backend instances only; phones never connect.

channels:
  storeEventStream:
    address: /v1/events
    title: Store event stream (SSE)
    description: |
      `text/event-stream`. One connection per foreground app. Each frame:
      `id: <envelope.id>`, `event: <envelope.type>`, `data: <envelope JSON>`.
      Heartbeat comment `: ping` every 25 s. Reconnect with `Last-Event-ID`.
      Only events of the token's store are sent.
    servers:
      - $ref: '#/servers/api'
    messages:
      storeCreated: { $ref: '#/components/messages/storeCreated' }
      productEnrolled: { $ref: '#/components/messages/productEnrolled' }
      receiptScanned: { $ref: '#/components/messages/receiptScanned' }
      scanCompleted: { $ref: '#/components/messages/scanCompleted' }
      catalogChanged: { $ref: '#/components/messages/catalogChanged' }
      priceChanged: { $ref: '#/components/messages/priceChanged' }
      storeChanged: { $ref: '#/components/messages/storeChanged' }
      memberChanged: { $ref: '#/components/messages/memberChanged' }
      sessionRevoked: { $ref: '#/components/messages/sessionRevoked' }
      customerCreated: { $ref: '#/components/messages/customerCreated' }
      customerUpdated: { $ref: '#/components/messages/customerUpdated' }
      debtRecorded: { $ref: '#/components/messages/debtRecorded' }
      debtRepaid: { $ref: '#/components/messages/debtRepaid' }
      debtAdjusted: { $ref: '#/components/messages/debtAdjusted' }
      saleCreated: { $ref: '#/components/messages/saleCreated' }
      saleVoided: { $ref: '#/components/messages/saleVoided' }
      reviewLineFlagged: { $ref: '#/components/messages/reviewLineFlagged' }
      reviewLineResolved: { $ref: '#/components/messages/reviewLineResolved' }
      expenseCreated: { $ref: '#/components/messages/expenseCreated' }
      alertCreated: { $ref: '#/components/messages/alertCreated' }
      alertResolved: { $ref: '#/components/messages/alertResolved' }
      dayClosed: { $ref: '#/components/messages/dayClosed' }
      salePaymentConfirmed:
        { $ref: '#/components/messages/salePaymentConfirmed' }
      productIndexed: { $ref: '#/components/messages/productIndexed' }
      stockChanged: { $ref: '#/components/messages/stockChanged' }
      stockLow: { $ref: '#/components/messages/stockLow' }
      receiptConfirmed: { $ref: '#/components/messages/receiptConfirmed' }
      assistantActionConfirmed:
        { $ref: '#/components/messages/assistantActionConfirmed' }
      assistantActionRejected:
        { $ref: '#/components/messages/assistantActionRejected' }
  storeEventBus:
    address: 'store:{storeId}:events'
    title: Store event bus (Redis pub/sub)
    description: Outbox relay publishes; every backend instance's SSE hub subscribes with `PSUBSCRIBE store:*:events`.
    servers:
      - $ref: '#/servers/redis'
    parameters:
      storeId:
        description: Store UUID.
    messages:
      storeCreated: { $ref: '#/components/messages/storeCreated' }
      productEnrolled: { $ref: '#/components/messages/productEnrolled' }
      receiptScanned: { $ref: '#/components/messages/receiptScanned' }
      scanCompleted: { $ref: '#/components/messages/scanCompleted' }
      catalogChanged: { $ref: '#/components/messages/catalogChanged' }
      priceChanged: { $ref: '#/components/messages/priceChanged' }
      storeChanged: { $ref: '#/components/messages/storeChanged' }
      memberChanged: { $ref: '#/components/messages/memberChanged' }
      sessionRevoked: { $ref: '#/components/messages/sessionRevoked' }
      customerCreated: { $ref: '#/components/messages/customerCreated' }
      customerUpdated: { $ref: '#/components/messages/customerUpdated' }
      debtRecorded: { $ref: '#/components/messages/debtRecorded' }
      debtRepaid: { $ref: '#/components/messages/debtRepaid' }
      debtAdjusted: { $ref: '#/components/messages/debtAdjusted' }
      saleCreated: { $ref: '#/components/messages/saleCreated' }
      saleVoided: { $ref: '#/components/messages/saleVoided' }
      reviewLineFlagged: { $ref: '#/components/messages/reviewLineFlagged' }
      reviewLineResolved: { $ref: '#/components/messages/reviewLineResolved' }
      expenseCreated: { $ref: '#/components/messages/expenseCreated' }
      alertCreated: { $ref: '#/components/messages/alertCreated' }
      alertResolved: { $ref: '#/components/messages/alertResolved' }
      dayClosed: { $ref: '#/components/messages/dayClosed' }
      salePaymentConfirmed:
        { $ref: '#/components/messages/salePaymentConfirmed' }
      productIndexed: { $ref: '#/components/messages/productIndexed' }
      stockChanged: { $ref: '#/components/messages/stockChanged' }
      stockLow: { $ref: '#/components/messages/stockLow' }
      receiptConfirmed: { $ref: '#/components/messages/receiptConfirmed' }
      assistantActionConfirmed:
        { $ref: '#/components/messages/assistantActionConfirmed' }
      assistantActionRejected:
        { $ref: '#/components/messages/assistantActionRejected' }
  internalEvents:
    address: internal:events
    title: Internal events (Redis pub/sub)
    description: Backend-only events. Never forwarded to phones.
    servers:
      - $ref: '#/servers/redis'
    messages:
      scanCompleted: { $ref: '#/components/messages/scanCompleted' }
      embeddingBackfill: { $ref: '#/components/messages/embeddingBackfill' }

operations:
  streamStoreEvents:
    action: send
    channel: { $ref: '#/channels/storeEventStream' }
    summary: Push store events to connected phones.
  publishStoreEvents:
    action: send
    channel: { $ref: '#/channels/storeEventBus' }
    summary: Outbox relay publishes committed outbox rows.
  consumeStoreEvents:
    action: receive
    channel: { $ref: '#/channels/storeEventBus' }
    summary: SSE hub on each instance receives events for fan-out.
  publishInternalEvents:
    action: send
    channel: { $ref: '#/channels/internalEvents' }
    summary: Recognition and admin jobs publish internal events.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Uuid: { type: string, format: uuid }
    Money: { type: integer, format: int64, minimum: 0, description: VND }
    Envelope:
      type: object
      required: [id, type, version, store_id, occurred_at]
      properties:
        id:
          {
            type: string,
            pattern: '^evt_[0-9]{15}$',
            description: 'evt_ + zero-padded outbox id; SSE id.',
          }
        type: { type: string }
        version: { type: integer, minimum: 1 }
        store_id: { $ref: '#/components/schemas/Uuid' }
        occurred_at: { type: string, format: date-time }
        actor:
          type: [object, 'null']
          properties:
            member_id: { $ref: '#/components/schemas/Uuid' }
            session_id: { $ref: '#/components/schemas/Uuid' }
        cursor:
          {
            type: string,
            description: Change-feed cursor after this change,
            when the event has one.,
          }
        data: { type: object }

  messages:
    storeCreated:
      name: store.created
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: store.created }
              data:
                type: object
                required: []
    productEnrolled:
      name: product.enrolled
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: product.enrolled }
              data:
                type: object
                required: [product_id, reference_count, source]
                properties:
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  reference_count: { type: integer, minimum: 0 }
                  source:
                    {
                      type: string,
                      enum: [enroll, quick_enroll, review_queue, receipt],
                    }
    receiptScanned:
      name: receipt.scanned
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: receipt.scanned }
              data:
                type: object
                required: [receipt_id, line_count, matched_lines, latency_ms]
                properties:
                  receipt_id: { $ref: '#/components/schemas/Uuid' }
                  line_count: { type: integer, minimum: 0 }
                  matched_lines: { type: integer, minimum: 0 }
                  latency_ms: { type: integer, minimum: 0 }
    catalogChanged:
      name: catalog.changed
      summary: Product, category, unit or reference image created, updated or archived.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: catalog.changed }
              data:
                type: object
                required: [entity, ids]
                properties:
                  entity: { type: string, enum: [product, category] }
                  ids:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/Uuid' },
                    }
    priceChanged:
      name: price.changed
      summary: Selling price or unit price changed (C3, G4).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: price.changed }
              data:
                type: object
                required: [product_id, field, new_value, source]
                properties:
                  via: { type: string, enum: [manual, assistant] }
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  unit_id: { type: [string, 'null'], format: uuid }
                  field: { type: string, enum: [price, unit_price] }
                  old_value: { type: [integer, 'null'] }
                  new_value: { $ref: '#/components/schemas/Money' }
                  source: { type: string, enum: [manual, margin_alert] }
    storeChanged:
      name: store.changed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: store.changed }
              data:
                type: object
                required: [fields]
                properties:
                  fields: { type: array, items: { type: string } }
    memberChanged:
      name: member.changed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: member.changed }
              data:
                type: object
                required: [member_id, change]
                properties:
                  member_id: { $ref: '#/components/schemas/Uuid' }
                  change: { type: string, enum: [joined, updated, deactivated] }
    sessionRevoked:
      name: session.revoked
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: session.revoked }
              data:
                type: object
                required: [session_id, reason]
                properties:
                  session_id: { $ref: '#/components/schemas/Uuid' }
                  reason:
                    {
                      type: string,
                      enum: [logout, member_removed, token_reuse, recovery],
                    }
    customerCreated:
      name: customer.created
      summary: Debt book change; no customer names, phones or notes.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: customer.created }
              data:
                type: object
                additionalProperties: false
                required: [customer_id, balance, archived]
                properties:
                  customer_id: { $ref: '#/components/schemas/Uuid' }
                  balance: { type: integer, format: int64 }
                  archived: { type: boolean }
    customerUpdated:
      name: customer.updated
      summary: Customer upsert; emitted for every ledger entry too.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: customer.updated }
              data:
                type: object
                additionalProperties: false
                required: [customer_id, balance, archived]
                properties:
                  customer_id: { $ref: '#/components/schemas/Uuid' }
                  balance: { type: integer, format: int64 }
                  archived: { type: boolean }
    debtRecorded:
      name: debt.recorded
      summary: Debt book change; no customer names, phones or notes.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: debt.recorded }
              data:
                type: object
                additionalProperties: false
                required:
                  [
                    entry_id,
                    customer_id,
                    kind,
                    amount,
                    sale_id,
                    balance,
                    business_date,
                  ]
                properties:
                  entry_id: { $ref: '#/components/schemas/Uuid' }
                  customer_id: { $ref: '#/components/schemas/Uuid' }
                  kind: { type: string, enum: [credit_sale, void] }
                  amount: { type: integer, format: int64, not: { const: 0 } }
                  sale_id: { $ref: '#/components/schemas/Uuid' }
                  balance: { type: integer, format: int64 }
                  business_date: { type: string, format: date }
    debtRepaid:
      name: debt.repaid
      summary: Debt book change; no customer names, phones or notes.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: debt.repaid }
              data:
                type: object
                additionalProperties: false
                required:
                  [
                    entry_id,
                    customer_id,
                    amount,
                    method,
                    balance,
                    business_date,
                  ]
                properties:
                  entry_id: { $ref: '#/components/schemas/Uuid' }
                  customer_id: { $ref: '#/components/schemas/Uuid' }
                  amount:
                    {
                      type: integer,
                      format: int64,
                      minimum: 1,
                      description: Positive repayment amount.,
                    }
                  method: { type: string, enum: [cash, transfer] }
                  balance: { type: integer, format: int64 }
                  business_date: { type: string, format: date }
    debtAdjusted:
      name: debt.adjusted
      summary: Debt book change; no customer names, phones or notes.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: debt.adjusted }
              data:
                type: object
                additionalProperties: false
                required:
                  [entry_id, customer_id, amount, balance, business_date]
                properties:
                  entry_id: { $ref: '#/components/schemas/Uuid' }
                  customer_id: { $ref: '#/components/schemas/Uuid' }
                  amount: { type: integer, format: int64, not: { const: 0 } }
                  balance: { type: integer, format: int64 }
                  business_date: { type: string, format: date }
    saleCreated:
      name: sale.created
      summary: New sale stored. Not emitted on idempotent replay.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: sale.created }
              data:
                type: object
                required:
                  [
                    sale_id,
                    code,
                    total,
                    payment_method,
                    member_id,
                    business_date,
                    line_count,
                  ]
                properties:
                  manual_lines: { type: integer, minimum: 0 }
                  sale_id: { $ref: '#/components/schemas/Uuid' }
                  code: { type: string }
                  total: { $ref: '#/components/schemas/Money' }
                  payment_method:
                    { type: string, enum: [cash, transfer, credit] }
                  member_id: { $ref: '#/components/schemas/Uuid' }
                  business_date: { type: string, format: date }
                  credit_amount: { $ref: '#/components/schemas/Money' }
                  customer_id: { type: [string, 'null'], format: uuid }
                  line_count: { type: integer }
    saleVoided:
      name: sale.voided
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: sale.voided }
              data:
                type: object
                required: [sale_id, reason, voided_by, total]
                properties:
                  same_day: { type: boolean }
                  sale_id: { $ref: '#/components/schemas/Uuid' }
                  reason: { type: string }
                  voided_by: { $ref: '#/components/schemas/Uuid' }
                  total: { $ref: '#/components/schemas/Money' }
    reviewLineFlagged:
      name: review.line_flagged
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: review.line_flagged }
              data:
                type: object
                required: [line_id, sale_id, reason, unit_price]
                properties:
                  line_id: { $ref: '#/components/schemas/Uuid' }
                  sale_id: { $ref: '#/components/schemas/Uuid' }
                  reason: { type: string, enum: [manual_price, price_mismatch] }
                  unit_price: { $ref: '#/components/schemas/Money' }
    reviewLineResolved:
      name: review.line_resolved
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: review.line_resolved }
              data:
                type: object
                required: [line_id, action]
                properties:
                  line_id: { $ref: '#/components/schemas/Uuid' }
                  action: { type: string, enum: [link, enrolled, dismiss] }
                  product_id: { type: [string, 'null'], format: uuid }
    expenseCreated:
      name: expense.created
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: expense.created }
              data:
                type: object
                required: [expense_id, amount, category, business_date]
                properties:
                  via: { type: string, enum: [manual, assistant] }
                  expense_id: { $ref: '#/components/schemas/Uuid' }
                  amount: { $ref: '#/components/schemas/Money' }
                  category:
                    { type: string, enum: [nhap_hang, dien, nuoc, khac] }
                  business_date: { type: string, format: date }
    alertCreated:
      name: alert.created
      summary: Margin alert opened, or an open alert updated by a newer purchase (E3).
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: alert.created }
              data:
                type: object
                required:
                  [
                    alert_id,
                    product_id,
                    cost_price,
                    selling_price,
                    margin_pct,
                    suggested_price,
                  ]
                properties:
                  alert_id: { $ref: '#/components/schemas/Uuid' }
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  cost_price: { $ref: '#/components/schemas/Money' }
                  selling_price: { $ref: '#/components/schemas/Money' }
                  margin_pct: { type: number }
                  suggested_price: { $ref: '#/components/schemas/Money' }
    alertResolved:
      name: alert.resolved
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: alert.resolved }
              data:
                type: object
                required: [alert_id, status]
                properties:
                  alert_id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [accepted, dismissed] }
                  new_price: { type: [integer, 'null'] }
    dayClosed:
      name: day.closed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: day.closed }
              data:
                type: object
                required:
                  [business_date, expected_cash, counted_cash, difference]
                properties:
                  business_date: { type: string, format: date }
                  expected_cash: { $ref: '#/components/schemas/Money' }
                  counted_cash: { $ref: '#/components/schemas/Money' }
                  difference: { type: integer, format: int64 }
    salePaymentConfirmed:
      name: sale.payment_confirmed
      summary: Phase 2 (S9). Bank notification matched a transfer sale by memo and amount.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: sale.payment_confirmed }
              data:
                type: object
                required: [sale_id, amount]
                properties:
                  sale_id: { $ref: '#/components/schemas/Uuid' }
                  amount: { $ref: '#/components/schemas/Money' }
                  bank_ref: { type: string }
    scanCompleted:
      name: scan.completed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: scan.completed }
              data:
                type: object
                required: [scan_id, mode, detections, timings, model]
                properties:
                  purpose: { type: string, enum: [checkout, enrollment] }
                  match_class:
                    { type: string, enum: [matched, ambiguous, unknown] }
                  latency_ms: { type: integer, minimum: 0 }
                  scan_id: { $ref: '#/components/schemas/Uuid' }
                  mode: { type: string, enum: [single, multi] }
                  detections: { type: integer }
                  timings:
                    type: object
                    properties:
                      segment: { type: integer }
                      embed: { type: integer }
                      search: { type: integer }
                      total: { type: integer }
                  model: { type: string }
    embeddingBackfill:
      name: embedding.backfill
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: embedding.backfill }
              data:
                type: object
                required: [from_model, to_model]
                properties:
                  from_model: { type: string }
                  to_model: { type: string }
    productIndexed:
      name: product.indexed
      summary: Multi-angle reference images embedded and prototype updated.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: product.indexed }
              data:
                type: object
                required: [product_id, index_status, reference_count]
                properties:
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  index_status:
                    type: string
                    enum: [pending, ready, failed]
                  reference_count:
                    type: integer
                    minimum: 0
    stockChanged:
      name: stock.changed
      summary: Tracked quantity changed; ledger and event committed in the same transaction.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: stock.changed }
              data:
                type: object
                required: [product_id, stock_quantity, reason]
                properties:
                  member_id: { $ref: '#/components/schemas/Uuid' }
                  via: { type: string, enum: [manual, assistant] }
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  stock_quantity:
                    {
                      type: integer,
                      description: Base-unit quantity; may be negative.,
                    }
                  reason:
                    {
                      type: string,
                      enum: [receipt, sale, sale_void, adjustment],
                    }
    stockLow:
      name: stock.low
      summary: Quantity crossed from above to at or below the effective threshold; restocking above re-arms it.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: stock.low }
              data:
                type: object
                required: [product_id, name, stock_quantity, threshold]
                properties:
                  product_id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: [string, 'null'] }
                  stock_quantity: { type: integer }
                  threshold: { type: integer, minimum: 0, maximum: 100000 }
    receiptConfirmed:
      name: receipt.confirmed
      summary: Receipt confirmed with one expense and stock movements in the same transaction; no event on replay.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              type: { const: receipt.confirmed }
              data:
                type: object
