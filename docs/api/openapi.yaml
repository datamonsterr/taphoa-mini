openapi: 3.1.0
info:
  title: Tạp Hóa Mini API
  version: 0.1.0-draft
  summary: Backend API for the Tạp Hóa Mini family-store POS.
  description: |
    Status: **Draft / Proposed** (2026-10-23). Source: [PRD](../PRD.md), [architecture](../architecture.md).

    Implemented today: `GET /healthz`, `GET /readyz`, `POST /v1/segment`.
    Specified and accepted, not yet merged: `POST /v1/images`, `GET /v1/images/{imageId}`
    ([object storage spec](../specs/object-storage.md)). Everything else is a proposal.

    ## Conventions

    - **Money** is an integer number of Vietnamese đồng (VND). No decimals, no floats.
    - **Ids** are UUIDs. Records the phone creates offline (sales, expenses, products,
      day closes) carry a **client-generated UUIDv7** `id`. Replaying the same create with
      the same `id` and same body returns `200` with the stored record instead of `201`.
      The same `id` with a different body returns `409 conflict`. This makes the offline
      outbox safe to retry.
    - **Timestamps** are RFC 3339 with offset. **Business dates** (`YYYY-MM-DD`) use the
      store time zone `Asia/Ho_Chi_Minh`.
    - **Store scope**: store routes act on the store selected by `X-Store-Id`
      (or the only active membership). Store creation, join and `GET /v1/me` use Clerk
      identity only. There is no `store_id` in paths.
    - **Pagination**: cursor based. `?limit=` (default 50, max 200) and `?cursor=`;
      responses carry `next_cursor` (null on the last page).
    - **Errors**: JSON `{ "error": "<human message>", "code": "<machine code>" }`.
      The skeleton endpoints return only `error`.
    - **Images** are never returned as bytes by the API. Responses carry short-lived
      presigned GET URLs (`url`, `url_expires_at`, default 15 min).
  contact:
    name: datamonsterr
  license:
    name: UNLICENSED
    identifier: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Local Docker Compose
  - url: https://{railwayDomain}
    description: Railway production backend
    variables:
      railwayDomain:
        default: backend-production.up.railway.app

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Process liveness and dependency readiness. Implemented.
  - name: Auth
    description: Clerk identity, store creation, family join by QR invite and PIN lock.
  - name: Store
    description: Store profile and settings, including the VietQR bank account (T1).
  - name: Members
    description: Family members, roles (Lead / Seller) and invites (U1–U4).
  - name: Images
    description: Photo upload to object storage; presigned read URLs.
  - name: Recognition
    description: Counter-photo scans (SAM + embedding match) and raw segmentation.
  - name: Catalog
    description: Products, reference photos, units, prices and price history (C1–C7).
  - name: Stock
    description: Stock quantities, counts, movements and low-stock thresholds (E4).
  - name: Receipts
    description: Supplier receipt OCR, product mapping, confirmation and history (E5).
  - name: Sales
    description: Checkout sales, payment method, voids (S1–S10).
  - name: Debts
    description: 'Debt book / sổ nợ: customers, credit sales, repayments, adjustments.'
  - name: Review
    description: Lead review queue for manual-price lines sold without a catalog match (S4, F3).
  - name: Expenses
    description: Expenses and stock purchases (E1–E3).
  - name: Alerts
    description: Margin alerts raised when cost rises above selling price (E3, F4).
  - name: Reports
    description: Today, period summaries, top products, recognition accuracy, exports (R1–R5).
  - name: Day close
    description: End-of-day cash reconciliation, chốt sổ (R2, F5).
  - name: Sync
    description: Offline-first change feed and live event stream (G4).

  - name: Assistant
    description: Private chat threads, proposed actions, next steps and daily digest.
  - name: Voice
    description: Voice sale drafts from a spoken utterance, and outcome feedback (V0-V6).
  - name: Devices
    description: Expo push token registrations.

paths:
  # ---------------------------------------------------------------- Health
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness
      description: Returns 200 when the process answers. Checks no dependencies. Railway healthcheck target.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness
      description: |
        Checks Postgres (`SELECT 1`), Redis (`PING`) and, once object storage lands,
        the bucket (`HeadBucket`). Each check has a 2 s timeout.
      security: []
      responses:
        '200':
          description: All dependencies answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: At least one dependency failed. `dependencies` names each failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example: { status: unavailable, dependencies: [redis] }

  # ---------------------------------------------------------------- Auth
  /v1/stores:
    post:
      tags: [Auth]
      operationId: createStore
      summary: Create a store and its first Lead (F1)
      description: |
        Requires a Clerk session JWT; no existing membership is needed.
        Creates the store and its first Lead membership. Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStoreRequest' }
      responses:
        '201':
          description: Store created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/auth/join:
    post:
      tags: [Auth]
      operationId: joinStore
      summary: Join a store by scanning the Lead's invite QR (U1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, display_name]
              properties:
                invite_token:
                  {
                    type: string,
                    description: Value from the invite QR. Single use.,
                  }
                display_name:
                  { type: string, minLength: 1, maxLength: 40, example: Bà nội }
      responses:
        '201':
          description: Membership created or reactivated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreMembership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '`already_member`: the Clerk user already has an active membership in this store.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: '`invite_unavailable`: invite expired or already used.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Clerk identity, profile and active store memberships
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/me/pin:
    put:
      tags: [Auth]
      operationId: setPin
      summary: Set or clear the caller's PIN (U4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: [string, 'null']
                  pattern: '^[0-9]{4,6}$'
                  description: null clears the PIN.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: PIN updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/me/pin/verify:
    post:
      tags: [Auth]
      operationId: verifyPin
      summary: Verify the caller's PIN lock
      description: |
        A right PIN unlocks the calling Clerk session on the server. Until then, every store
        route answers 403 `pin_required` for a person who has a PIN on any membership (see
        `POST /v1/me/pin/lock`). A member without a PIN answers 204 and unlocks nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{4,6}$' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204':
          {
            description: 'PIN matches (session unlocked), or the member has no PIN.',
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid_pin` when the PIN does not match; `unauthorized` for missing or invalid Clerk credentials.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/me/pin/lock:
    post:
      tags: [Auth]
      operationId: lockSession
      summary: Lock the calling session until its PIN is verified again
      description: |
        On a shared phone every signed-in person keeps a live Clerk session, so a session token
        proves nothing about who holds the phone. A person who has a PIN is served only while
        their session is unlocked. A session first seen by the API starts unlocked, and so does
        one that just set a PIN or verified it (`POST /v1/me/pin/verify`). The app calls this
        route for the person who stops being the active one. A locked session gets 403
        `pin_required` on every store route; `GET /v1/me`, this route and the verify route stay
        open. An unlocked session that is idle for 12 hours locks again. Needs no store.
      responses:
        '204': { description: Session locked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Store
  /v1/store:
    get:
      tags: [Store]
      operationId: getStore
      summary: Store profile and settings
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Store]
      operationId: updateStore
      summary: Update store name, VietQR bank account, margin and low-stock thresholds (Lead)
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/StorePatch' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Updated store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Store' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Members
  /v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List family members
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Members, active first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Change role, enroll permission or name (Lead)
      description: A store keeps at least one active Lead; demoting the last one returns 409.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 40 }
                role: { $ref: '#/components/schemas/Role' }
                can_enroll: { type: boolean }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Deactivate a member (Lead)
      description: Past sales keep the member reference. The member row is kept with `active=false`; subsequent store requests return 403 and the event stream closes on their deactivation event.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: Member deactivated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/invites:
    post:
      tags: [Members]
      operationId: createInvite
      summary: Create a single-use join invite shown as a QR (Lead)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                can_enroll: { type: boolean, default: false }
                ttl_seconds:
                  { type: integer, minimum: 60, maximum: 86400, default: 600 }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '201':
          description: Invite. Encode `join_url` into the QR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Images
  /v1/images:
    post:
      tags: [Images]
      operationId: uploadImage
      summary: Upload a photo (accepted spec, not yet merged)
      description: |
        Accepts JPEG, PNG or WebP detected from magic bytes; max 10 MiB. The object is stored
        under `images/{yyyy}/{mm}/{uuid}.{ext}`, then a row is inserted. If the insert fails
        the object is deleted. The skeleton spec allows a missing `store_id`; once auth lands
        the store comes from the token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                store_id:
                  type: string
                  format: uuid
                  description: Optional owning store. Unknown store returns 400. Replaced by the token's store once auth lands.
                purpose: { $ref: '#/components/schemas/ImagePurpose' }
            encoding:
              image:
                contentType: image/jpeg, image/png, image/webp
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    get:
      tags: [Images]
      operationId: getImage
      summary: Image metadata with a fresh presigned URL
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Recognition
  /v1/recognition/document-probes:
    post:
      tags: [Recognition]
      operationId: probeDocument
      summary: Detect receipt text lines in a live camera preview still
      description: |
        Authenticated members with checkout scan permissions may send a small JPEG/PNG
        still every 2–3 seconds. Expo Go has no frame processors. Runs only the text
        detector, without SAM, embeddings, scan/image rows or object storage uploads.
        Maximum image size is 512 KB (524288 bytes). Limited to 40 requests per minute
        per member; 429 includes Retry-After. Probes use a separate admission pool
        (DOCUMENT_PROBE_CONCURRENCY, default 1) and never consume scan/enrollment slots.
        When the probe pool is full, returns 200 with the empty signal
        `{detected:false, score:0, text_lines:0, line_boxes:[]}` as a best-effort result.
        Returns 503 `ocr_unavailable` when no text detector is configured.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG, at most 524288 bytes.
            encoding:
              image:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Document detection signal; nothing is persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSignal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/recognition/scans:
    post:
      tags: [Recognition]
      operationId: createScan
      summary: Recognize items in a photo (S1, S8, C2)
      description: |
        Stores the photo, segments it (SAM in phase 1, YOLO in phase 2), embeds each crop
        and searches the store's product embeddings. Every detection returns up to
        `top_k` candidates. **Nothing is added to a cart or sale by this call**; the phone
        shows editable lines and the seller confirms.

        - `mode=multi`: whole counter, many detections (S8).
        - `mode=single`: one item; the largest central segment (or the whole image) is used (S1).
        - `purpose=enrollment`: duplicate check before creating a product (C2). Candidates
          above the duplicate threshold come back with `match=matched`.

        Send either a new `image` file or an `image_id` from `POST /v1/images`.
        Inference is serialized per backend instance; when busy the API returns 503 with
        `Retry-After`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  {
                    type: string,
                    format: binary,
                    description: Required unless `image_id` is given.,
                  }
                image_id: { type: string, format: uuid }
                mode: { type: string, enum: [single, multi], default: multi }
                purpose:
                  {
                    type: string,
                    enum: [checkout, enrollment],
                    default: checkout,
                  }
                top_k: { type: integer, minimum: 1, maximum: 5, default: 4 }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '201':
          description: Scan stored with detections and candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/recognition/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Recognition]
      operationId: getScan
      summary: Read a stored scan (debug and review)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Scan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/segment:
    post:
      tags: [Recognition]
      operationId: segmentImage
      summary: Raw class-agnostic segmentation (implemented skeleton)
      description: |
        Runs the configured `Segmenter` and returns boxes only, without catalog matching.
        Kept for diagnostics and the e2e smoke test. Needs a signed-in member of a store
        with the product-enrollment permission, and shares the per-member segmentation
        rate limit with `/v1/segment/points`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  {
                    type: string,
                    format: binary,
                    description: 'PNG or JPEG, max 10 MiB.',
                  }
      responses:
        '200':
          description: Segments after score/area filtering and NMS.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Segment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/segment/points:
    post:
      tags: [Recognition]
      operationId: segmentPoints
      summary: Point-prompted segmentation (MobileSAM)
      description: |
        Requires Lead or `can_enroll`. Runs MobileSAM with 1-2 point prompts on a cached or newly
        computed image embedding. Returns mask, bounding box, cutout image, and timings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentPointsRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Segmentation mask, cutout image, and bounding box.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentPointsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Catalog
  /v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Price list / grid (C6, S3)
      description: Phones normally read the catalog from their persisted query cache (ADR 0009), refreshed from `/v1/sync/changes`; this route serves search and first load.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: q
          in: query
          description: Case- and accent-insensitive name search (`unaccent`), e.g. `hao hao` matches `Hảo Hảo`.
          schema: { type: string }
        - name: barcode
          in: query
          description: Exact barcode lookup (S2).
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Products page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Enroll a product from 1–8 photos and a price (C1, C4, C5)
      description: |
        Requires Lead or `can_enroll`. Accepts either quick-enroll multi-angle `references`
        (3..8 photos with cutouts and bounding boxes) or legacy `image_ids` (1..5 photos).
        Exactly one of `references` or `image_ids` is required (422 `validation_failed`
        for both or neither). Minimum 3 applies only to `references` (422 below 3).
        Reference image IDs must be distinct; bounding boxes must be finite with positive
        width and height (422 `validation_failed`). Returns 409 `image_limit` above 8.
        The synchronous duplicate check embeds only the first cutout (first image for legacy).
        Cutout storage reads retry for up to 1 second, then fall back to a padded bbox crop.
        An async index job embeds reference cutouts into the database;
        the product is returned immediately with `index_status: "pending"`.
        Call `POST /v1/recognition/scans` with `purpose=enrollment` first to show
        "Same as X?" (C2). Set `force_new=true` to create anyway when the duplicate check
        would match. Idempotent on `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Replay of an identical earlier create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '201':
          description: Product created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `duplicate_suspected` (with `details.candidates`) when `force_new` is false and a
            reference image matches an existing product, `image_limit` when total images would
            exceed 8, or `id_conflict` on an id reused with a different body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Product detail
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Catalog]
      operationId: updateProduct
      summary: Edit product; price changes are Lead only and logged (C3, G4)
      description: |
        Price and cost changes write a `price_history` row (old, new, who, when) and publish a
        `catalog.changed` event. Conflict rule: the Lead's edits win; concurrent edits resolve
        last-writer-wins by server receive time, and both appear in history.
        The low-stock threshold override is Lead only; null restores the store default.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProductPatch' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Catalog]
      operationId: archiveProduct
      summary: Archive a product (Lead)
      description: Soft delete. Hidden from grid and recognition; past sales keep the reference.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: Archived. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/products/{productId}/images:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Catalog]
      operationId: addProductImage
      summary: Add a reference photo, e.g. "merge" answer to "Same as X?" (C2)
      description: |
        Max 8 reference images per product (positions 0..7, 409 above). Accepts optional
        `cutout_image_id` and `bbox` together; enqueues a background index job without
        synchronous embedding writes. Invalid pairs and non-finite or non-positive-size
        bounding boxes return 422 `validation_failed`. `detection_id` selects a detection
        belonging to this image and store; its bbox is retained for background cropping.
        Combining `detection_id` with `bbox` returns 422 `validation_failed`.
        `product_embeddings.detection_id` is no longer populated by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id]
              properties:
                image_id: { type: string, format: uuid }
                detection_id:
                  type: string
                  format: uuid
                  description: Optional. Embed this detection's crop instead of the whole image.
                cutout_image_id:
                  type: string
                  format: uuid
                  description: Optional. Masked cutout image ID for quick enroll indexing.
                bbox:
                  type: array
                  description: '[x, y, width, height] in original image pixels.'
                  items: { type: number }
                  minItems: 4
                  maxItems: 4
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Image already attached; returns the stored reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        '201':
          description: Reference image added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`image_limit` when the product already has 8 reference images.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/products/{productId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ImageId'
    delete:
      tags: [Catalog]
      operationId: removeProductImage
      summary: Remove a reference photo and enqueue prototype recomputation
      description: A product keeps at least one reference image (409). Enqueues background indexing.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/products/{productId}/price-history:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Catalog]
      operationId: getPriceHistory
      summary: Price and cost history (C3)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PriceChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Product categories
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Create a category (Lead)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 40 }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/exports/price-list:
    get:
      tags: [Catalog]
      operationId: exportPriceList
      summary: Printable price list (C7, P2)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: format
          in: query
          schema: { type: string, enum: [pdf, png], default: pdf }
      responses:
        '200':
          description: File download.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Sales
  /v1/sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: Sales log
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: member_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_method
          in: query
          schema: { $ref: '#/components/schemas/PaymentMethod' }
        - name: status
          in: query
          schema: { type: string, enum: [completed, voided] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sales]
      operationId: createSale
      summary: Record a completed sale (S5, S6, U3)
      description: |
        Sent by the phone's outbox right after "Đã nhận", or later when it comes back online.
        Sales are append-only. The server **never reprices**: it stores the prices the seller
        saw. It recomputes `total` from lines and rejects a mismatch (400). A line whose
        `unit_price` differs from the catalog price at `sold_at` is stored with
        `price_mismatch=true` for Lead review. `member_id` comes from the token.
        Idempotent on `id`. All members (RecordDebt) may record credit sales.
        `payment_method=credit` requires `credit.amount = total` and no `cash_received`.
        For cash or transfer with `credit`, `0 < credit.amount < total`. Cash received must
        cover the paid part (`total − credit.amount`); `change_given` uses that paid part.
        Unknown customer returns 404. Archived customers still accept credit sales, and
        credit limits never block. The sale and its credit_sale entry commit together.
        `sold_at` is bounded by the server. It is trusted only from 72 hours in the past to 5
        minutes in the future of server time, so an offline queue still syncs. Outside that
        window the sale is booked at server time (a phone with a wrong clock keeps selling, and
        nobody can pick the day). A seller's sale for a past business day the Lead already
        closed is booked at server time too, so closed figures do not change. The stored
        `sold_at` and `business_date` in the response show what was booked. A sale on today's
        date after an early close is a normal sale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSaleRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Replay of an identical earlier create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '201':
          description: Sale recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sales/{saleId}:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    get:
      tags: [Sales]
      operationId: getSale
      summary: Sale detail
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Sale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sales/{saleId}/void:
    parameters:
      - $ref: '#/components/parameters/SaleId'
    post:
      tags: [Sales]
      operationId: voidSale
      summary: Void or refund a completed sale with a reason (S10)
      description: |
        Lead, or the seller who made the sale on the same business date. Idempotent.
        A credit sale adds one void entry of −credit_amount on the void business date,
        in the same transaction. Repeated voids add no entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
                voided_at:
                  {
                    type: string,
                    format: date-time,
                    description: Ignored. The server stamps the void with its own time.,
                  }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Voided sale.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Debts
  /v1/customers:
    get:
      tags: [Debts]
      operationId: listCustomers
      summary: Search the debt book
      description: |
        All members (RecordDebt).
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: query
          in: query
          description: Case-insensitive substring of name or phone.
          schema: { type: string }
        - name: overdue
          in: query
          description: Filter by overdue status (debt_age_days > 7).
          schema: { type: boolean }
        - name: archived
          in: query
          description: Archived customers are hidden by default.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          description: Sort customers by balance (largest first), recent activity or name.
          schema:
            { type: string, enum: [balance, recent, name], default: balance }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Debts]
      operationId: createCustomer
      summary: Create a customer
      description: |
        All members (RecordDebt). Idempotent on client UUIDv7 `id`: identical body replays
        with 200; a different body returns 409 `id_conflict`. Credit limits warn; they never block.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Replay of an identical earlier create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '201':
          description: Customer created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Debts]
      operationId: getCustomer
      summary: Customer balance and profile
      description: |
        All members (RecordDebt).
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Debts]
      operationId: updateCustomer
      summary: Edit a customer
      description: |
        All members (RecordDebt) may edit the profile. Changing `archived` requires Lead
        (AdjustDebt); sellers receive 403. Null clears phone, note or credit_limit.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateCustomerRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/customers/{customerId}/entries:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Debts]
      operationId: listDebtEntries
      summary: Customer ledger, newest first
      description: |
        All members (RecordDebt). Positive amounts increase debt; negative amounts reduce it.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Debt entries page, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/customers/{customerId}/repayments:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Debts]
      operationId: createRepayment
      summary: Record a repayment
      description: |
        All members (RecordDebt). Overpayment is allowed; a negative balance means the store
        holds the customer’s money. Repayments for archived customers still succeed.
        Requires `Idempotency-Key`; missing key or invalid body returns 422. Identical retries
        return the same entry with 200. Reusing a key with another body or customer returns
        409 `id_conflict`. The entry, customer balance and events commit together.
        Business date uses device time (default server time), in Asia/Ho_Chi_Minh.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepaymentRequest' }
      responses:
        '200':
          description: Replay of the same entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntry' }
        '201':
          description: Debt entry recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/customers/{customerId}/adjustments:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Debts]
      operationId: createDebtAdjustment
      summary: Adjust debt (Lead)
      description: |
        Lead only (AdjustDebt); sellers receive 403.
        Requires `Idempotency-Key`; missing key or invalid body returns 422. Identical retries
        return the same entry with 200. Reusing a key with another body or customer returns
        409 `id_conflict`. The entry, customer balance and events commit together.
        Business date uses device time (default server time), in Asia/Ho_Chi_Minh.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDebtAdjustmentRequest' }
      responses:
        '200':
          description: Replay of the same entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntry' }
        '201':
          description: Debt entry recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /v1/debts/summary:
    get:
      tags: [Debts]
      operationId: getDebtSummary
      summary: Outstanding debt overview
      description: |
        All members (RecordDebt). Overdue means debt_age_days > 7.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Debt summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Review
  /v1/review/manual-lines:
    get:
      tags: [Review]
      operationId: listManualLines
      summary: Items sold without a catalog match (S4, F3)
      description: Lead sees "3 items sold without catalog", each with the crop photo when one exists.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved], default: open }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lines to review.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ManualLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/review/manual-lines/{lineId}/resolve:
    parameters:
      - name: lineId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Review]
      operationId: resolveManualLine
      summary: Link to an existing product, mark enrolled, or dismiss (Lead)
      description: |
        `link` attaches the line to `product_id` and, if the line has a crop, adds it as a
        reference image. `enrolled` records the product created from this line in one tap
        (`POST /v1/products` with the line's image). The sale's amounts never change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [link, enrolled, dismiss] }
                product_id:
                  {
                    type: string,
                    format: uuid,
                    description: Required for link and enrolled.,
                  }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Resolved line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Expenses
  /v1/expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: Expenses and purchases
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ExpenseCategory' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Record an expense or a stock purchase (E1, E2)
      description: |
        `purchase_lines` (category `nhap_hang` only) update each product's `cost_price`
        when the caller is the Lead. A seller's purchase lines are recorded with the
        expense but never change cost price, price history or margin alerts.
        When the new cost leaves margin below the store threshold, the server creates a
        margin alert (E3) and publishes `alert.created`. When lines are present, `amount`
        must equal the line sum. Idempotent on `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExpenseRequest' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Replay of an identical earlier create.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '201':
          description: Recorded; `alerts` lists margin alerts raised by this purchase.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Expenses]
      operationId: getExpense
      summary: Expense detail
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Expense.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Expenses]
      operationId: updateExpense
      summary: Correct amount, category, note or photo (Lead or author)
      description: Purchase lines are not editable; delete and re-enter instead.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                category: { $ref: '#/components/schemas/ExpenseCategory' }
                note: { type: [string, 'null'], maxLength: 500 }
                image_id: { type: [string, 'null'], format: uuid }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Delete an expense (Lead)
      description: Soft delete. Product cost prices set by its purchase lines are not rolled back.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Stock
  /v1/stock:
    get:
      tags: [Stock]
      operationId: listStock
      summary: Tracked stock quantities and status
      description: |
        Sorted by status (out, low, ok), then name. `all` excludes untracked products.
        Threshold is the effective product override or store default. Quantities are in base units.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: status
          in: query
          schema: { type: string, enum: [all, low, out], default: all }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stock page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/products/{productId}/stock-adjustments:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Stock]
      operationId: createStockAdjustment
      summary: Set or adjust stock (Lead)
      description: |
        Exactly one of count or delta is required (422 otherwise). Count sets an absolute
        quantity; delta changes it. Writes the quantity, ledger movement and outbox events
        in one transaction. Replaying the same Idempotency-Key returns the same movement.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustment' }
      responses:
        '200':
          description: Adjustment movement, including on replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/products/{productId}/stock-movements:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Stock]
      operationId: listStockMovements
      summary: Stock movement history
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Movements page, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Receipts
  /v1/receipts:
    post:
      tags: [Receipts]
      operationId: createReceipt
      summary: Read a supplier receipt into a draft (Lead or can_enroll)
      description: |
        Synchronous OCR, parsing and product mapping of an uploaded image; returns a draft
        within the 6 s budget. Reuses the scan image row. Returns 404 for an unknown image,
        422 no_text when OCR finds no text, or 503 ocr_unavailable when models are absent.
        Decision failures fall back to rules. Replaying the same Idempotency-Key returns
        the same receipt without repeating OCR.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptCreate' }
      responses:
        '201':
          description: Parsed draft receipt, including on replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Receipts]
      operationId: listReceipts
      summary: Receipt history (Lead or can_enroll)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: status
          in: query
          schema: { type: string, enum: [draft, confirmed, discarded] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Receipt summaries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/receipts/{receiptId}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: Receipt detail and photo (Lead or can_enroll)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Receipt with parsed lines and mapping candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Receipts]
      operationId: discardReceipt
      summary: Discard a draft receipt (Lead or can_enroll)
      description: Marks the draft discarded; 409 already_confirmed when confirmed.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '204': { description: Draft discarded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/receipts/{receiptId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      tags: [Receipts]
      operationId: confirmReceipt
      summary: Confirm a receipt into stock and an expense (Lead or can_enroll)
      description: |
        All retained lines must map to known products; map or drop unmatched lines (422).
        Creates one nhap_hang expense with amount = sum(cost), the receipt image and purchase
        lines with unit_cost = ceil(cost / quantity). Adds stock, writes movements with
        reason receipt, and emits events in the same transaction. Only the Lead's
        confirmation updates product cost prices and runs margin alerts; a `can_enroll`
        seller's confirmation records stock and the expense but leaves cost unchanged.
        Returns the confirmed receipt with expense_id. The same Idempotency-Key replays
        the same result; another attempt to confirm returns 409 already_confirmed.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptConfirm' }
      responses:
        '200':
          description: Confirmed receipt, including on replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Alerts
  /v1/alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Margin alerts (E3)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: status
          in: query
          schema:
            { type: string, enum: [open, accepted, dismissed], default: open }
      responses:
        '200':
          description: Alerts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarginAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/alerts/{alertId}/accept:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [Alerts]
      operationId: acceptAlert
      summary: Accept the suggested (or an edited) new price (Lead, F4)
      description: Sets the product price exactly like `PATCH /v1/products/{id}` and closes the alert.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_price: { $ref: '#/components/schemas/Money' }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Accepted alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarginAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/alerts/{alertId}/dismiss:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [Alerts]
      operationId: dismissAlert
      summary: Keep the current price (Lead)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Dismissed alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarginAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Reports
  /v1/reports/today:
    get:
      tags: [Reports]
      operationId: getDailyReport
      summary: Today screen (R1)
      description: |
        `revenue` is the full sale total (credit sales are revenue). `cash_revenue` and
        `transfer_revenue` count only the paid part (`total − credit_amount`) of cash and
        transfer sales. `cash_repayments` sums cash repayments of that business date and
        `credit_sales` sums credit_amount of completed sales of that date, so the day close
        screen can show both before the day is closed. `expected_cash` includes
        `cash_repayments`. `expected_cash` and `day_close` are Lead-only: they are omitted
        for sellers.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: date
          in: query
          description: Business date; defaults to today in Asia/Ho_Chi_Minh.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Daily figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/summary:
    get:
      tags: [Reports]
      operationId: getSummaryReport
      summary: Day/week/month revenue and expenses for bar charts (R3)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: Buckets in date order.
          content:
            application/json:
              schema:
                type: object
                required: [granularity, buckets]
                properties:
                  granularity: { type: string, enum: [day, week, month] }
                  buckets:
                    type: array
                    items: { $ref: '#/components/schemas/SummaryBucket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/top-products:
    get:
      tags: [Reports]
      operationId: getTopProducts
      summary: Top products by revenue or quantity, with gross margin when cost is known (R4)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: sort
          in: query
          schema: { type: string, enum: [revenue, quantity], default: revenue }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Ranked products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TopProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/reports/recognition:
    get:
      tags: [Reports]
      operationId: getRecognitionReport
      summary: Confirmed-vs-corrected rate (PRD §6 accuracy metric, A1)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
      responses:
        '200':
          description: Recognition accuracy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecognitionReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/exports/transactions:
    get:
      tags: [Reports]
      operationId: exportTransactions
      summary: Sales and expenses for tax declaration (R5)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: xlsx }
      responses:
        '200':
          description: File download with `Content-Disposition`.
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Day close
  /v1/day-closes:
    get:
      tags: [Day close]
      operationId: listDayCloses
      summary: Past end-of-day closes (Lead only)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DayClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/day-closes/{businessDate}:
    parameters:
      - name: businessDate
        in: path
        required: true
        schema: { type: string, format: date }
    get:
      tags: [Day close]
      operationId: getDayClose
      summary: One day's close (Lead only)
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Day close.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Day close]
      operationId: putDayClose
      summary: Enter counted cash; returns expected cash and difference (R2, F5)
      description: |
        `expected_cash = opening_float + cash_sales − cash_refunds + cash_repayments − cash_expenses`
        for that business date, computed on the server from synced records. Re-closing the
        same date overwrites the count and recomputes; sales synced after a close are
        reported in `late_sales_count` (with repayments recorded after the close). A date after today (store time zone) or before 2024-01-01 is a 400 `validation_failed`. Cash sales/refunds and transfer revenue count only
        the paid part (`total − credit_amount`). Repayments are summed by method and business
        date; `credit_sales` sums credit_amount of completed sales of that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_cash]
              properties:
                counted_cash: { $ref: '#/components/schemas/Money' }
                opening_float: { $ref: '#/components/schemas/Money' }
                note: { type: string, maxLength: 500 }
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      responses:
        '200':
          description: Close stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Sync
  /v1/sync/changes:
    get:
      tags: [Sync]
      operationId: pullChanges
      summary: Pull catalog and settings changes since a cursor (offline-first, G4)
      description: |
        Returns server-owned entities that changed after `since`: store, members, categories,
        products (with units and reference images), customers and debt entries. Sales and expenses are pushed by the phone
        and are not part of the feed. Start with no `since` for a full snapshot. Repeat while
        `has_more`. Deletions arrive as `op=delete`.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: since
          in: query
          description: Opaque cursor from the previous response.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Ordered changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeFeed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Cursor too old (change log compacted). Discard local catalog and pull a full snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/events:
    get:
      tags: [Sync]
      operationId: streamEvents
      summary: Server-Sent Events stream of store events
      description: |
        Long-lived `text/event-stream` while the app is in the foreground. Events are hints:
        on `catalog.changed` the phone calls `/v1/sync/changes`. Fan-out across backend
        instances goes through Redis pub/sub channel `store:{store_id}:events`. Heartbeat
        comment every 25 s. Clients reconnect with `Last-Event-ID`; a gap is closed by the
        next pull. The stream closes when `member.changed` deactivates the connected member.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Event stream. Each `data:` line is one `StoreEvent` JSON.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StoreEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Assistant and devices
  /v1/assistant/threads:
    post:
      tags:
        - Assistant
      operationId: createAssistantThread
      summary: Create an assistant thread
      description: Create a private thread for the caller, optionally seeded with screen or receipt context.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantThread'
      responses:
        '201':
          description: Thread created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantThread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Assistant
      operationId: listAssistantThreads
      summary: List own assistant threads
      description: Cursor pagination of the caller threads, newest first.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantThreadPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/assistant/threads/{threadId}:
    get:
      tags:
        - Assistant
      operationId: getAssistantThread
      summary: Read a thread with messages and actions
      description: Only the owning member can read a thread in the current store.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantThreadDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Assistant
      operationId: deleteAssistantThread
      summary: Delete own assistant thread
      description: Delete own assistant thread.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Thread deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/assistant/threads/{threadId}/messages:
    post:
      tags:
        - Assistant
      operationId: sendAssistantMessage
      summary: Send a message and stream the assistant reply
      description:
        'Each SSE frame has event: <name> and one JSON data: line. Validation, ownership and
        not-found errors are JSON before the stream starts. Quota and model failures are error events inside
        the 200 stream. message.completed and error terminate the stream. No resumption or Last-Event-ID;
        clients never automatically resend this POST.'
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAssistantMessage'
      responses:
        '200':
          description: SSE frames with event name and one JSON data line.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AssistantStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/assistant/actions/{actionId}/confirm:
    post:
      tags:
        - Assistant
      operationId: confirmAssistantAction
      summary: Confirm and execute a proposed action
      description:
        Execute with the confirming member permissions. A replay returns the first result. Expired
        or changed targets return 409 action_stale; an already decided action returns 409 already_decided.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: actionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated action, or the first result on an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/assistant/actions/{actionId}/reject:
    post:
      tags:
        - Assistant
      operationId: rejectAssistantAction
      summary: Reject a proposed action
      description:
        Reject a proposal in an accessible thread. A stale or already decided action returns
        409 action_stale or already_decided.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: actionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated rejected action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/assistant/messages/{messageId}/feedback:
    post:
      tags:
        - Assistant
      operationId: submitAssistantFeedback
      summary: Rate an assistant message
      description: Save thumbs up or down and an optional comment for an assistant message in an own thread.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFeedback'
      responses:
        '204':
          description: Feedback saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/assistant/next-steps:
    get:
      tags:
        - Assistant
      operationId: listAssistantNextSteps
      summary: List ranked next-step chips
      description:
        At most eight permission-filtered chips ranked by priority. Computed by rules without
        a model call; the phone puts its on-device context chips first.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: screen
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Current app screen, for example camera.
        - name: document_detected
          in: query
          required: false
          schema:
            type: boolean
          description: Whether the phone detected a receipt in the current frame.
        - name: unknown_product
          in: query
          required: false
          schema:
            type: boolean
          description: Whether the current frame has an unknown product.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextStepList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/assistant/digest:
    get:
      tags:
        - Assistant
      operationId: getAssistantDigest
      summary: Read the daily digest
      description:
        Return the stored daily digest, using a template when model generation is unavailable.
        Profit and cost fields are null for members without cost permission.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: business_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Business date in Asia/Ho_Chi_Minh; defaults to the latest available digest.
        - name: mark_read
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description:
            Record that the caller opened the digest. Only the digest screen sets it; reading for the
            dashboard card leaves `read_at` untouched. The response carries the read time from
            before this call, so the first open returns null.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Digest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/voice/utterances:
    post:
      tags: [Voice]
      operationId: createVoiceUtterance
      summary: Turn one spoken utterance into a transcript and an optional sale draft
      description: |
        Multipart upload. `audio` is `audio/mp4` (m4a), `audio/wav` or `audio/ogg`, at most
        1 MB and 30 seconds. With `mode=sale` the response may carry a `sale_draft`; with
        `mode=transcribe` it carries the transcript only. Error codes: `audio_too_long` and
        `unsupported_format` (400), `no_speech` (422, nothing heard), `voice_quota` (429,
        per-store daily cap), `voice_unavailable` (503, every model failed; the app falls
        back to on-device recognition). Credit drafts need `RecordDebt` at sale time as for sales.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, mode]
              properties:
                audio: { type: string, format: binary }
                mode: { type: string, enum: [sale, transcribe] }
                language: { type: string, enum: [vi, en], default: vi }
                context:
                  type: string
                  description: 'JSON string of VoiceUtteranceContext: {"entry","screen","thread_id?"}.'
            encoding:
              audio:
                contentType: audio/mp4, audio/wav, audio/ogg
      responses:
        '201':
          description: Utterance understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceUtterance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/voice/utterances/{utteranceId}/outcome:
    post:
      tags: [Voice]
      operationId: postVoiceOutcome
      summary: Report what the seller did with a voice draft
      description: Idempotent per utterance; the last write wins.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: utteranceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceOutcomeRequest' }
      responses:
        '204': { description: Recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/devices:
    post:
      tags:
        - Devices
      operationId: registerDevice
      summary: Register or update an Expo push token
      description:
        Upsert by token for the authenticated member and current store; update platform, app
        version and language.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDevice'
      responses:
        '200':
          description: Device registration upserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices/{token}:
    delete:
      tags:
        - Devices
      operationId: unregisterDevice
      summary: Remove an Expo push token
      description: Idempotently remove the caller push registration for this token.
      parameters:
        - $ref: '#/components/parameters/X-Store-Id'
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: Expo push token, URL-encoded as a path segment.
      responses:
        '204':
          description: Registration removed, including when the token was already absent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Clerk session JWT (RS256), verified against the instance JWKS.
        Obtained from the Clerk SDK `getToken()`.

  parameters:
    X-Store-Id:
      name: X-Store-Id
      in: header
      required: false
      description: Selects the store; required when the Clerk user has more than one active membership, optional with exactly one.
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for retries of the same operation and body; changed bodies conflict.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    From:
      name: from
      in: query
      description: Inclusive business date.
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive business date.
      schema: { type: string, format: date }
    FromRequired:
      name: from
      in: query
      required: true
      description: Inclusive business date.
      schema: { type: string, format: date }
    ToRequired:
      name: to
      in: query
      required: true
      description: Inclusive business date. Max range 366 days.
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Invalid input (`validation_failed`, `total_mismatch`); on store routes, `store_required` when several active memberships exist without X-Store-Id, or `validation_failed` for a malformed X-Store-Id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, expired or revoked credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: On store routes, `membership_required` when there is no active membership, or `forbidden` when X-Store-Id names a store without an active membership. Also `forbidden` when the role does not allow the action (e.g. Seller changing a price).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown id in this store.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict (`id_conflict`, `last_lead`, `image_limit`, `alert_closed`, `already_confirmed`, `action_stale`, `already_decided`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeds the endpoint limit (2 MiB for JSON bodies; 512 KB for document probes; 10 MiB for image uploads). Always the standard error envelope with code payload_too_large.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Image type is not JPEG, PNG or WebP.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Semantic validation failed (e.g. invalid points, references count below 3, invalid stock adjustment or receipt lines); no_text when receipt OCR finds no text.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limited. See `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error, e.g. `inference failed`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Object storage failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: |
        Dependency not configured or busy: `no model loaded`, `segmenter busy`
        (with `Retry-After`), `storage not configured`, or `ocr_unavailable` when receipt OCR models are absent.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          {
            type: string,
            description: Human-readable message (English; the app localizes by `code`).,
          }
        code:
          type: string
          description: Machine code, including no_text (422), ocr_unavailable (503), already_confirmed (409), action_stale (409; proposal expired or target changed), already_decided (409; proposal already confirmed or rejected).
          example: duplicate_suspected
        details: { type: object, additionalProperties: true }
    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        dependencies:
          type: array
          items: { type: string, enum: [postgres, redis, storage] }
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Amount in VND (đồng). Integer, no fraction.
      example: 10000
    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: [string, 'null'] }
    Role:
      type: string
      enum: [lead, seller]
      description: Lead has all permissions and owns prices. Seller sells, views prices, adds manual-price lines.
    StoreMembership:
      type: object
      required: [store, member]
      properties:
        store: { $ref: '#/components/schemas/Store' }
        member: { $ref: '#/components/schemas/Member' }
    Profile:
      type: object
      required: [display_name, email]
      properties:
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
    Me:
      type: object
      required: [clerk_user_id, profile, memberships]
      properties:
        clerk_user_id: { type: string }
        profile:
          oneOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
        memberships:
          type: array
          description: Active memberships ordered by join time.
          items: { $ref: '#/components/schemas/StoreMembership' }
    CreateStoreRequest:
      type: object
      required: [store_name, display_name]
      properties:
        store_name:
          { type: string, minLength: 1, maxLength: 80, example: Tạp hóa Cô Ba }
        display_name: { type: string, minLength: 1, maxLength: 40, example: Mẹ }
        bank_account: { $ref: '#/components/schemas/BankAccount' }
    BankAccount:
      type: object
      description: VietQR payee (T1). The phone builds the EMVCo/NAPAS payload locally from this.
      required: [bank_bin, account_number, account_name]
      properties:
        bank_bin:
          {
            type: string,
            pattern: '^[0-9]{6}$',
            description: NAPAS bank BIN.,
            example: '970436',
          }
        bank_short_name: { type: string, example: Vietcombank }
        account_number:
          {
            type: string,
            pattern: '^[0-9A-Za-z]{4,19}$',
            example: '0123456789',
          }
        account_name:
          {
            type: string,
            maxLength: 50,
            description: 'Uppercase, no diacritics.',
            example: NGUYEN THI BA,
          }
    Store:
      type: object
      required:
        [
          id,
          name,
          timezone,
          margin_threshold_pct,
          low_stock_threshold,
          created_at,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bank_account:
          oneOf:
            - $ref: '#/components/schemas/BankAccount'
            - type: 'null'
        timezone: { type: string, const: Asia/Ho_Chi_Minh }
        margin_threshold_pct:
          type: number
          minimum: 0
          maximum: 100
          default: 0
          description: E3 alert fires when (price − cost) / price × 100 is below this.
        low_stock_threshold:
          type: integer
          minimum: 0
          maximum: 100000
          description: Default low-stock threshold in base units; Lead only.
          default: 5
        sales_memo_prefix:
          {
            type: string,
            maxLength: 8,
            default: TH,
            description: VietQR memo prefix before the short sale code.,
          }
        created_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    StorePatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        bank_account:
          oneOf:
            - $ref: '#/components/schemas/BankAccount'
            - type: 'null'
        margin_threshold_pct: { type: number, minimum: 0, maximum: 100 }
        low_stock_threshold:
          type: integer
          minimum: 0
          maximum: 100000
          description: Default low-stock threshold in base units; Lead only.
        sales_memo_prefix: { type: string, maxLength: 8 }
    Member:
      type: object
      required:
        [id, display_name, role, can_enroll, has_pin, active, created_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, example: Bà nội }
        role: { $ref: '#/components/schemas/Role' }
        can_enroll: { type: boolean, description: Always true for Lead. }
        has_pin: { type: boolean }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Invite:
      type: object
      required: [token, join_url, role, can_enroll, expires_at]
      properties:
        token:
          {
            type: string,
            description: '128-bit random, base32. Stored hashed.',
          }
        join_url:
          {
            type: string,
            format: uri,
            example: 'taphoa://join?token=K7Q4MZ2P9HXDT3VA',
          }
        role: { $ref: '#/components/schemas/Role' }
        can_enroll: { type: boolean }
        expires_at: { type: string, format: date-time }
    ImagePurpose:
      type: string
      enum: [enrollment, checkout, expense_receipt, other]
      default: other
    Image:
      type: object
      required: [id, object_key, content_type, byte_size, url, url_expires_at]
      properties:
        id: { type: string, format: uuid }
        object_key:
          {
            type: string,
            example: images/2026/10/0192b1f0-7c1e-7a8a-9a51-2a4f0e7d1c3b.jpg,
          }
        content_type:
          { type: string, enum: [image/jpeg, image/png, image/webp] }
        byte_size: { type: integer, format: int64 }
        purpose: { $ref: '#/components/schemas/ImagePurpose' }
        width: { type: integer }
        height: { type: integer }
        url: { type: string, format: uri, description: Presigned GET URL. }
        url_expires_at: { type: string, format: date-time }
    Segment:
      type: object
      required: [bbox, score, area]
      properties:
        bbox:
          type: array
          description: '[x, y, width, height] in original image pixels.'
          items: { type: number }
          minItems: 4
          maxItems: 4
        score: { type: number, description: Model mask quality score. }
        area: { type: integer, description: Foreground pixel count. }
      example: { bbox: [120, 80, 210, 330], score: 0.95, area: 51234 }
    SegmentPointsRequest:
      type: object
      required: [image_id, points]
      properties:
        image_id:
          type: string
          format: uuid
          description: Uploaded photo to segment.
        points:
          type: array
          minItems: 1
          maxItems: 2
          description: Pixel coordinates of original photo; 1 = foreground, 0 = background.
          items:
            type: object
            required: [x, y, label]
            properties:
              x:
                type: number
                description: X coordinate in pixels on original photo.
              y:
                type: number
                description: Y coordinate in pixels on original photo.
              label:
                type: integer
                enum: [0, 1]
                description: '1 = foreground, 0 = background.'
    SegmentPointsResponse:
      type: object
      required: [bbox, score, area, mask, cutout_image_id, timings]
      properties:
        bbox:
          type: array
          description: '[x, y, width, height] in original photo pixels.'
          items: { type: number }
          minItems: 4
          maxItems: 4
        score:
          type: number
          description: MobileSAM mask confidence score.
        area:
          type: integer
          description: Foreground pixel count in mask.
        mask:
          type: object
          required: [width, height, png_base64]
          properties:
            width:
              type: integer
              description: Mask width in pixels.
            height:
              type: integer
              description: Mask height in pixels.
            png_base64:
              type: string
              description: 'PNG with alpha channel: opaque = product, transparent = background'
        cutout_image_id:
          type: string
          format: uuid
          description: Stored cutout image on neutral grey background.
        timings:
          type: object
          required: [encode, decode, total]
          properties:
            encode:
              type: integer
              description: Encoder latency in ms.
            decode:
              type: integer
              description: Decoder latency in ms.
            total:
              type: integer
              description: Total latency in ms.
    Scan:
      type: object
      required:
        [id, image, mode, purpose, pipeline, detections, document, created_at]
      properties:
        id: { type: string, format: uuid }
        image: { $ref: '#/components/schemas/Image' }
        mode: { type: string, enum: [single, multi] }
        purpose: { type: string, enum: [checkout, enrollment] }
        pipeline:
          type: object
          required: [segmenter, embedder]
          properties:
            segmenter: { type: string, example: mobilesam-onnx@1 }
            embedder: { type: string, example: dinov2-vits14-onnx@1/112 }
            catalog_version: { type: integer, format: int64 }
        timings_ms:
          type: object
          properties:
            segment: { type: integer }
            embed: { type: integer }
            search: { type: integer }
            total: { type: integer }
        document: { $ref: '#/components/schemas/ScanDocument' }
        detections:
          type: array
          description: Ordered left-to-right, top-to-bottom.
          items: { $ref: '#/components/schemas/Detection' }
        created_at: { type: string, format: date-time }
    ScanDocument:
      $ref: '#/components/schemas/DocumentSignal'
    DocumentSignal:
      type: object
      description: Text detection signal, returned by preview probes and every scan.
      required: [detected, score, text_lines, line_boxes]
      properties:
        detected:
          type: boolean
          description: True when text_lines >= 6 and text_area_ratio >= 0.08.
        score:
          type: number
          minimum: 0
          maximum: 1
          description: text_area_ratio / 0.2, clamped to [0, 1].
        text_lines: { type: integer, minimum: 0 }
        line_boxes:
          type: array
          description: Grouped text lines sorted top-to-bottom. Each box is [x, y, width, height], normalized to image dimensions and clamped to [0, 1]. Empty when no text is found; the full text_lines count may exceed the box cap.
          maxItems: 40
          items:
            type: array
            minItems: 4
            maxItems: 4
            items: { type: number, minimum: 0, maximum: 1 }
    Detection:
      type: object
      required: [id, bbox, score, match, candidates]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Send back as `sale line.detection_id` to label training data.,
          }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        score: { type: number }
        crop_url:
          {
            type: [string, 'null'],
            format: uri,
            description: 'Presigned URL of the crop thumbnail, null when none was stored. Thumbnails upload in the background after the response, so the object can answer 404 for about a second; retry.',
          }
        match:
          type: string
          enum: [matched, ambiguous, unknown]
          description: |
            `matched`: top similarity ≥ match threshold and clear margin over the runner-up.
            `ambiguous`: above the floor but close to another product (look-alike variants).
            `unknown`: below the floor; phone shows "Không tìm thấy".
        candidates:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Candidate' }
    Candidate:
      type: object
      required: [product_id, similarity, name, price]
      properties:
        product_id: { type: string, format: uuid }
        similarity:
          {
            type: number,
            minimum: -1,
            maximum: 1,
            description: Cosine similarity of best reference embedding.,
          }
        name: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        default_unit_id: { type: [string, 'null'], format: uuid }
        thumbnail_url:
          {
            type: string,
            format: uri,
            description: Omitted when the product has no image yet.,
          }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Nước giải khát }
    ProductUnit:
      type: object
      description: Sellable unit (C5). The base unit has `quantity_in_base=1`.
      required: [id, name, quantity_in_base, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: lốc }
        quantity_in_base: { type: integer, minimum: 1, example: 6 }
        price: { $ref: '#/components/schemas/Money' }
        barcode: { type: [string, 'null'] }
    ProductImage:
      type: object
      required: [image_id, url, url_expires_at, position]
      properties:
        image_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        url_expires_at: { type: string, format: date-time }
        position: { type: integer, minimum: 0, maximum: 7 }
        cutout_image_id: { type: string, format: uuid }
        bbox:
          type: array
          description: '[x, y, width, height] in original image pixels.'
          items: { type: number }
          minItems: 4
          maxItems: 4
    ProductReference:
      type: object
      required: [image_id, cutout_image_id, bbox]
      properties:
        image_id:
          type: string
          format: uuid
          description: Original photo image ID.
        cutout_image_id:
          type: string
          format: uuid
          description: Masked cutout image ID on neutral grey background.
        bbox:
          type: array
          description: '[x, y, width, height] in original photo pixels.'
          items: { type: number }
          minItems: 4
          maxItems: 4
    Product:
      type: object
      required:
        [
          id,
          price,
          base_unit,
          units,
          images,
          index_status,
          stock_quantity,
          low_stock_threshold,
          stock_status,
          archived,
          version,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'], example: Sting đỏ 330ml }
        price: { $ref: '#/components/schemas/Money' }
        base_unit: { type: string, example: chai, default: cái }
        cost_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        barcode: { type: [string, 'null'] }
        category_id: { type: [string, 'null'], format: uuid }
        units:
          type: array
          description: Extra units beyond the base one (C5).
          items: { $ref: '#/components/schemas/ProductUnit' }
        images:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/ProductImage' }
        index_status:
          type: string
          enum: [pending, ready, failed]
          description: Status of the background reference embedding and prototype job.
        stock_quantity:
          type: [integer, 'null']
          description: Base-unit quantity; null means untracked. Tracked stock may be negative.
        low_stock_threshold:
          type: [integer, 'null']
          minimum: 0
          maximum: 100000
          description: Product override; null uses the store default.
        stock_status:
          type: string
          enum: [ok, low, out, untracked]
          description: Untracked for null; out for quantity <= 0; low for quantity <= effective threshold; otherwise ok.
        archived: { type: boolean }
        version: { type: integer, format: int64 }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ProductSummary:
      type: object
      description: Minimal Product subset a voice draft sheet needs.
      required: [id, name, price, base_unit]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        base_unit: { type: string, example: chai }
        units:
          type: array
          items: { $ref: '#/components/schemas/ProductUnit' }
        image_url: { type: [string, 'null'], format: uri }
    VoiceUtteranceContext:
      type: object
      required: [entry, screen]
      properties:
        entry:
          type: string
          enum:
            [
              bubble,
              tile,
              shortcut,
              control,
              action_button,
              siri,
              longpress,
              chip,
              chat,
            ]
        screen: { type: string, example: camera }
        thread_id: { type: [string, 'null'], format: uuid }
    CustomerMatch:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [matched, candidates, none] }
        customer: { $ref: '#/components/schemas/Customer' }
        candidates:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Customer' }
        spoken_name: { type: string }
    VoiceDraftLine:
      type: object
      required: [id, spoken, quantity, status]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Client reuses it as SaleLineInput.id.,
          }
        spoken:
          type: string
          description: >-
            The product name only, cleaned. Never the quantity, a number word (một, hai),
            a unit or container word (chai, lon, gói, thùng) or the price.
        status:
          type: string
          enum: [matched, ambiguous, unknown]
          description: >-
            matched is one product. ambiguous is several plausible products, ranked in
            candidates (the first is preselected). unknown is a name with no product in the
            catalog; the client must not sell the line until the seller picks a product, adds
            a new one or removes the line.
        product: { $ref: '#/components/schemas/ProductSummary' }
        candidates:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/ProductSummary' }
        unit_id: { type: [string, 'null'], format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Spoken price, else catalog price, else null.
        price_source: { type: string, enum: [spoken, catalog, none] }
        price_mismatch:
          { type: boolean, description: Spoken price differs from catalog. }
        needs_price: { type: boolean }
    VoiceSaleDraft:
      type: object
      required: [lines, payment_method, total]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/VoiceDraftLine' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        customer: { $ref: '#/components/schemas/CustomerMatch' }
        total: { $ref: '#/components/schemas/Money' }
    VoiceUtterance:
      type: object
      required:
        [id, mode, transcript, language, intent, model, latency_ms, created_at]
      properties:
        id: { type: string, format: uuid }
        mode: { type: string, enum: [sale, transcribe] }
        transcript: { type: string }
        language: { type: string, enum: [vi, en] }
        intent: { type: string, enum: [sale, chat, none] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sale_draft: { $ref: '#/components/schemas/VoiceSaleDraft' }
        model: { type: string, description: Slug that answered. }
        stt_fallback:
          { type: boolean, description: True when the STT path was used. }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }
    VoiceCorrection:
      type: object
      required: [line_id]
      properties:
        line_id: { type: string, format: uuid }
        chosen_product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        unit_price: { $ref: '#/components/schemas/Money' }
        removed: { type: boolean }
    VoiceOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [confirmed, edited, abandoned] }
        sale_id: { type: string, format: uuid }
        corrections:
          type: array
          items: { $ref: '#/components/schemas/VoiceCorrection' }
        stage:
          {
            type: string,
            enum: [listening, draft, pay],
            description: For abandoned.,
          }
    CreateProductRequest:
      type: object
      description: Exactly one of references or image_ids is required; both or neither return 422 validation_failed.
      oneOf:
        - required: [references]
          not: { required: [image_ids] }
        - required: [image_ids]
          not: { required: [references] }
      required: [id, price]
      properties:
        id: { type: string, format: uuid, description: Client UUIDv7. }
        price: { $ref: '#/components/schemas/Money' }
        image_ids:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
          description: Legacy enrollment path (1..5 photos from checkout unknown pill).
        references:
          type: array
          minItems: 3
          maxItems: 8
          items: { $ref: '#/components/schemas/ProductReference' }
          description: |
            Quick enroll multi-angle references (3..8 photos).
            Minimum 3 applies only to `references` (422 below 3, 409 when total images exceed 8).
        name: { type: string, maxLength: 120 }
        base_unit: { type: string, maxLength: 20 }
        cost_price: { $ref: '#/components/schemas/Money' }
        barcode: { type: string, maxLength: 64 }
        category_id: { type: string, format: uuid }
        units:
          type: array
          items:
            type: object
            required: [id, name, quantity_in_base, price]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              quantity_in_base: { type: integer, minimum: 2 }
              price: { $ref: '#/components/schemas/Money' }
              barcode: { type: string }
        from_manual_line_id:
          type: string
          format: uuid
          description: Enroll from a flagged manual line (F3); resolves that line.
        force_new: { type: boolean, default: false }
    ProductPatch:
      type: object
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        price: { $ref: '#/components/schemas/Money' }
        cost_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        base_unit: { type: string, maxLength: 20 }
        barcode: { type: [string, 'null'], maxLength: 64 }
        category_id: { type: [string, 'null'], format: uuid }
        units:
          type: array
          description: Full replacement of extra units.
          items: { $ref: '#/components/schemas/ProductUnit' }
        low_stock_threshold:
          type: [integer, 'null']
          minimum: 0
          maximum: 100000
          description: Lead only. Null restores the store default.
        archived: { type: boolean }
    StockItem:
      type: object
      required:
        [
          product_id,
          name,
          image_url,
          stock_quantity,
          low_stock_threshold,
          status,
          updated_at,
        ]
      properties:
        product_id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        image_url:
          {
            type: [string, 'null'],
            format: uri,
            description: 'Short-lived presigned GET URL of the product photo, or null.',
          }
        stock_quantity:
          {
            type: [integer, 'null'],
            description: Base units; null means untracked. May be negative.,
          }
        low_stock_threshold:
          {
            type: integer,
            minimum: 0,
            maximum: 100000,
            description: Effective product override or store default.,
          }
        status: { type: string, enum: [ok, low, out, untracked] }
        updated_at: { type: string, format: date-time }
    StockList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockItem' }
    StockAdjustment:
      type: object
      description: Exactly one of count or delta; quantities are in the product base unit.
      oneOf:
        - required: [count]
        - required: [delta]
      properties:
        count: { type: integer, minimum: 0, description: Absolute stock count. }
        delta:
          type: integer
          not: { const: 0 }
          description: Signed nonzero change to stock.
        note: { type: string, maxLength: 200 }
    StockMovement:
      type: object
      required:
        [id, delta, quantity_after, reason, ref_id, member_id, note, created_at]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        quantity_after: { type: integer }
        reason: { type: string, enum: [receipt, sale, sale_void, adjustment] }
        ref_id:
          {
            type: [string, 'null'],
            format: uuid,
            description: Receipt or sale ID when applicable.,
          }
        member_id: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 200 }
        created_at: { type: string, format: date-time }
    StockMovementList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockMovement' }
    ReceiptCandidate:
      type: object
      required: [product_id, name, probability]
      properties:
        product_id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        probability: { type: number, minimum: 0, maximum: 1 }
    ReceiptLine:
      type: object
      required:
        [
          id,
          position,
          raw_text,
          product_name,
          quantity,
          cost,
          product_id,
          match_confidence,
          candidates,
        ]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        raw_text: { type: string }
        product_name: { type: string }
        quantity:
          {
            type: integer,
            minimum: 1,
            description: Quantity in the product base unit.,
          }
        cost:
          {
            $ref: '#/components/schemas/Money',
            description: Line amount in đồng,
            not unit price.,
          }
        product_id:
          {
            type: [string, 'null'],
            format: uuid,
            description: Null when unmatched; map or drop before confirm.,
          }
        match_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        candidates:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ReceiptCandidate' }
    Receipt:
      type: object
      required:
        [
          id,
          status,
          image_id,
          image_url,
          total,
          parser,
          model,
          lines,
          timings,
          expense_id,
          created_at,
          confirmed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, confirmed, discarded] }
        image_id: { type: string, format: uuid }
        image_url:
          {
            type: string,
            format: uri,
            description: 'Short-lived presigned GET URL; generated on read, never persisted.',
          }
        total:
          {
            $ref: '#/components/schemas/Money',
            description: Sum of line costs in đồng.,
          }
        parser: { type: string, enum: [decisions, fallback] }
        model:
          {
            type: [string, 'null'],
            description: 'Decision model ID, or null when unused.',
            example: 'inception/mercury-decide:free',
          }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ReceiptLine' }
        timings:
          type: object
          description: Processing durations in milliseconds.
          required: [ocr, parse, decisions, total]
          properties:
            ocr: { type: integer, minimum: 0 }
            parse: { type: integer, minimum: 0 }
            decisions: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        expense_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
    ReceiptSummary:
      type: object
      required:
        [
          id,
          status,
          total,
          line_count,
          matched_count,
          image_url,
          created_at,
          confirmed_at,
          expense_id,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, confirmed, discarded] }
        total: { $ref: '#/components/schemas/Money' }
        line_count: { type: integer, minimum: 0 }
        matched_count: { type: integer, minimum: 0 }
        image_url:
          {
            type: string,
            format: uri,
            description: Short-lived presigned GET URL.,
          }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        expense_id: { type: [string, 'null'], format: uuid }
    ReceiptList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ReceiptSummary' }
    ReceiptCreate:
      type: object
      required: [image_id]
      properties:
        image_id:
          {
            type: string,
            format: uuid,
            description: Uploaded receipt photo; reuse the scan image row.,
          }
    ReceiptConfirm:
      type: object
      required: [lines, paid_with]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          description: Full retained line set; all products must belong to this store.
          items:
            type: object
            required: [product_id, quantity, cost]
            properties:
              line_id:
                {
                  type: string,
                  format: uuid,
                  description: 'Existing draft line, omitted for a newly added line.',
                }
              product_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              cost:
                {
                  $ref: '#/components/schemas/Money',
                  description: Line amount in đồng.,
                }
        paid_with: { type: string, enum: [cash_box, other] }
        spent_at: { type: string, format: date-time }
    PriceChange:
      type: object
      required: [id, field, new_value, changed_by, changed_at, source]
      properties:
        id: { type: string, format: uuid }
        field: { type: string, enum: [price, cost_price, unit_price] }
        unit_id: { type: [string, 'null'], format: uuid }
        old_value:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        new_value: { $ref: '#/components/schemas/Money' }
        changed_by: { type: string, format: uuid }
        changed_at: { type: string, format: date-time }
        source: { type: string, enum: [manual, margin_alert, purchase] }
    Customer:
      type: object
      required:
        [
          id,
          name,
          phone,
          note,
          credit_limit,
          balance,
          oldest_debt_date,
          debt_age_days,
          overdue,
          archived,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: [string, 'null'], maxLength: 20 }
        note: { type: [string, 'null'], maxLength: 200 }
        credit_limit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        balance:
          type: integer
          format: int64
          description: Positive means debt; negative means the store holds the customer's money.
        oldest_debt_date:
          type: [string, 'null']
          format: date
          description: Oldest unsettled credit business date (FIFO); null when balance is at most zero. Voids cancel their own sale credits before aging.
        debt_age_days:
          type: [integer, 'null']
          minimum: 0
          description: Today minus oldest_debt_date in Asia/Ho_Chi_Minh business dates; null when no unsettled debt.
        overdue:
          {
            type: boolean,
            description: debt_age_days > 7; false when debt_age_days is null.,
          }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, description: Client UUIDv7. }
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, maxLength: 20 }
        note: { type: string, maxLength: 200 }
        credit_limit: { $ref: '#/components/schemas/Money' }
    UpdateCustomerRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: [string, 'null'], maxLength: 20 }
        note: { type: [string, 'null'], maxLength: 200 }
        credit_limit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        archived: { type: boolean, description: Lead only (AdjustDebt). }
    CustomerList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Customer' }
    DebtEntry:
      type: object
      required:
        [
          id,
          customer_id,
          kind,
          amount,
          balance_after,
          sale_id,
          method,
          reason,
          member_id,
          business_date,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        kind: { type: string, enum: [credit_sale, repayment, adjustment, void] }
        amount:
          type: integer
          format: int64
          description: Signed VND; credit_sale positive, repayment and void negative, adjustment nonzero either way.
        balance_after: { type: integer, format: int64 }
        sale_id: { type: [string, 'null'], format: uuid }
        method: { type: [string, 'null'], enum: [cash, transfer, null] }
        reason: { type: [string, 'null'] }
        member_id: { type: string, format: uuid }
        business_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
    DebtEntryList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DebtEntry' }
    CreateRepaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
          minimum: 1
          description: Positive input; stored as a negative ledger amount. Overpayment is allowed.
        method: { type: string, enum: [cash, transfer] }
        paid_at:
          type: string
          format: date-time
          description: Device time; defaults to server time.
    CreateDebtAdjustmentRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: integer
          format: int64
          not: { const: 0 }
          description: Signed nonzero VND; positive increases debt.
        reason: { type: string, minLength: 1, maxLength: 200 }
        adjusted_at:
          type: string
          format: date-time
          description: Device time; defaults to server time.
    DebtSummary:
      type: object
      required:
        [
          total_outstanding,
          customers_with_debt,
          overdue_count,
          overdue_amount,
          top_debtors,
        ]
      properties:
        total_outstanding:
          $ref: '#/components/schemas/Money'
          description: Sum of positive customer balances.
        customers_with_debt: { type: integer, minimum: 0 }
        overdue_count: { type: integer, minimum: 0 }
        overdue_amount: { $ref: '#/components/schemas/Money' }
        top_debtors:
          type: array
          maxItems: 5
          description: Customers with positive balances, largest balance first.
          items: { $ref: '#/components/schemas/Customer' }
    SaleCredit:
      type: object
      required: [customer_id, amount]
      properties:
        customer_id: { type: string, format: uuid }
        amount:
          $ref: '#/components/schemas/Money'
          minimum: 1
    PaymentMethod:
      type: string
      enum: [cash, transfer, credit]
    LineSource:
      type: string
      enum: [camera, multi_photo, barcode, grid, manual, voice]
      description: How the line entered the cart (S1, S8, S2, S3, S4, voice).
    SaleLineInput:
      type: object
      required: [id, source, quantity, unit_price]
      properties:
        id: { type: string, format: uuid }
        product_id:
          {
            type: [string, 'null'],
            format: uuid,
            description: Null only for `source=manual`.,
          }
        unit_id: { type: [string, 'null'], format: uuid }
        source: { $ref: '#/components/schemas/LineSource' }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        unit_price: { $ref: '#/components/schemas/Money' }
        manual_label:
          {
            type: string,
            maxLength: 80,
            description: Optional note for manual lines.,
          }
        detection_id:
          type: [string, 'null']
          format: uuid
          description: Detection this line confirmed. Links the confirmed product to the crop (training label).
        suggested_product_id:
          type: [string, 'null']
          format: uuid
          description: Top-1 candidate shown. Differs from `product_id` when the seller corrected it.
    SaleLine:
      allOf:
        - $ref: '#/components/schemas/SaleLineInput'
        - type: object
          required: [line_total, price_mismatch]
          properties:
            line_total: { $ref: '#/components/schemas/Money' }
            price_mismatch: { type: boolean }
            product_name: { type: [string, 'null'] }
    CreateSaleRequest:
      type: object
      required: [id, sold_at, payment_method, lines, total]
      properties:
        id: { type: string, format: uuid, description: Client UUIDv7. }
        sold_at:
          {
            type: string,
            format: date-time,
            description: Device time at "Đã nhận".,
          }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        credit: { $ref: '#/components/schemas/SaleCredit' }
        cash_received:
          $ref: '#/components/schemas/Money'
        total: { $ref: '#/components/schemas/Money' }
        vietqr_memo: { type: string, maxLength: 25, example: TH 7KQ4MZ }
        scan_ids:
          type: array
          items: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/SaleLineInput' }
    Sale:
      type: object
      required:
        [
          id,
          code,
          sold_at,
          received_at,
          business_date,
          member_id,
          payment_method,
          total,
          credit_amount,
          status,
          lines,
        ]
      properties:
        id: { type: string, format: uuid }
        code:
          {
            type: string,
            description: Short code shown in the VietQR memo.,
            example: 7KQ4MZ,
          }
        sold_at: { type: string, format: date-time }
        received_at:
          {
            type: string,
            format: date-time,
            description: Server time of first receipt.,
          }
        business_date: { type: string, format: date }
        member_id: { type: string, format: uuid }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        cash_received:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        change_given:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total: { $ref: '#/components/schemas/Money' }
        credit_amount: { $ref: '#/components/schemas/Money' }
        customer_id: { type: [string, 'null'], format: uuid }
        vietqr_memo: { type: [string, 'null'] }
        status: { type: string, enum: [completed, voided] }
        void:
          type: [object, 'null']
          properties:
            reason: { type: string }
            voided_by: { type: string, format: uuid }
            voided_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SaleLine' }
    ManualLine:
      type: object
      required:
        [line_id, sale_id, sold_at, sold_by, unit_price, quantity, status]
      properties:
        line_id: { type: string, format: uuid }
        sale_id: { type: string, format: uuid }
        sold_at: { type: string, format: date-time }
        sold_by: { type: string, format: uuid }
        unit_price: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer }
        manual_label: { type: [string, 'null'] }
        crop_image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        reason: { type: string, enum: [manual_price, price_mismatch] }
        status: { type: string, enum: [open, resolved] }
        resolution:
          type: [object, 'null']
          properties:
            action: { type: string, enum: [link, enrolled, dismiss] }
            product_id: { type: [string, 'null'], format: uuid }
            resolved_by: { type: string, format: uuid }
            resolved_at: { type: string, format: date-time }
    ExpenseCategory:
      type: string
      enum: [nhap_hang, dien, nuoc, khac]
      description: nhập hàng (stock purchase), điện (electricity), nước (water), khác (other).
    PurchaseLine:
      type: object
      required: [product_id, quantity, unit_cost]
      properties:
        product_id: { type: string, format: uuid }
        unit_id:
          {
            type: [string, 'null'],
            format: uuid,
            description: 'Unit bought, e.g. thùng. Cost is converted to the base unit.',
          }
        quantity: { type: integer, minimum: 1 }
        unit_cost: { $ref: '#/components/schemas/Money' }
    CreateExpenseRequest:
      type: object
      required: [id, spent_at, amount, category, paid_with]
      properties:
        id: { type: string, format: uuid }
        spent_at: { type: string, format: date-time }
        amount: { $ref: '#/components/schemas/Money' }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        paid_with:
          {
            type: string,
            enum: [cash_box, other],
            description: Only `cash_box` reduces expected cash at close.,
          }
        image_id: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }
        purchase_lines:
          type: array
          description: Buying costs are Lead-only, so responses to sellers carry an empty list.
          items: { $ref: '#/components/schemas/PurchaseLine' }
    Expense:
      allOf:
        - $ref: '#/components/schemas/CreateExpenseRequest'
        - type: object
          required: [business_date, member_id, created_at]
          properties:
            business_date: { type: string, format: date }
            member_id: { type: string, format: uuid }
            image:
              oneOf:
                - $ref: '#/components/schemas/Image'
                - type: 'null'
            alerts:
              type: array
              items: { $ref: '#/components/schemas/MarginAlert' }
            created_at: { type: string, format: date-time }
    MarginAlert:
      type: object
      required:
        [
          id,
          product_id,
          product_name,
          cost_price,
          selling_price,
          margin_pct,
          suggested_price,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: [string, 'null'], example: Coca 330ml }
        cost_price: { $ref: '#/components/schemas/Money' }
        selling_price: { $ref: '#/components/schemas/Money' }
        margin_pct: { type: number, example: 5.6 }
        suggested_price:
          $ref: '#/components/schemas/Money'
        status: { type: string, enum: [open, accepted, dismissed] }
        expense_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    DailyReport:
      type: object
      required:
        [
          business_date,
          revenue,
          sales_count,
          cash_revenue,
          transfer_revenue,
          expenses,
          net,
          cash_repayments,
          credit_sales,
        ]
      properties:
        business_date: { type: string, format: date }
        revenue: { $ref: '#/components/schemas/Money' }
        sales_count: { type: integer }
        voided_count: { type: integer }
        cash_revenue: { $ref: '#/components/schemas/Money' }
        transfer_revenue: { $ref: '#/components/schemas/Money' }
        cash_repayments: { $ref: '#/components/schemas/Money' }
        credit_sales: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        net:
          {
            type: integer,
            format: int64,
            description: Revenue minus expenses; may be negative.,
          }
        expected_cash:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Lead only; omitted for sellers.
        manual_lines_open: { type: integer }
        day_close:
          description: Lead only; omitted for sellers.
          oneOf:
            - $ref: '#/components/schemas/DayClose'
            - type: 'null'
    SummaryBucket:
      type: object
      required: [start, end, revenue, expenses, net, sales_count]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
        revenue: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        net: { type: integer, format: int64 }
        sales_count: { type: integer }
    TopProduct:
      type: object
      required: [product_id, quantity, revenue]
      properties:
        product_id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        quantity: { type: integer, description: In base units. }
        revenue: { $ref: '#/components/schemas/Money' }
        gross_margin:
          type: [integer, 'null']
          format: int64
          description: >-
            Revenue minus quantity × current cost; null when cost unknown. Omitted for
            sellers, because it would reveal the cost.
    RecognitionReport:
      type: object
      required: [detections, confirmed_top1, confirmed_top3, corrected, unknown]
      properties:
        detections:
          { type: integer, description: Detections linked to a sale line. }
        confirmed_top1: { type: integer }
        confirmed_top3: { type: integer }
        corrected: { type: integer }
        unknown: { type: integer }
        top1_rate: { type: number }
        median_scan_ms: { type: integer }
    DayClose:
      type: object
      required:
        [
          business_date,
          expected_cash,
          counted_cash,
          difference,
          closed_by,
          closed_at,
        ]
      properties:
        business_date: { type: string, format: date }
        opening_float: { $ref: '#/components/schemas/Money' }
        cash_sales: { $ref: '#/components/schemas/Money' }
        cash_refunds: { $ref: '#/components/schemas/Money' }
        cash_repayments: { $ref: '#/components/schemas/Money' }
        transfer_repayments: { $ref: '#/components/schemas/Money' }
        credit_sales: { $ref: '#/components/schemas/Money' }
        cash_expenses: { $ref: '#/components/schemas/Money' }
        expected_cash: { $ref: '#/components/schemas/Money' }
        counted_cash: { $ref: '#/components/schemas/Money' }
        difference:
          {
            type: integer,
            format: int64,
            description: counted − expected; negative means missing cash.,
            example: -10000,
          }
        transfer_revenue: { $ref: '#/components/schemas/Money' }
        late_sales_count:
          {
            type: integer,
            description: Sales and repayments recorded after the close for this date.,
          }
        note: { type: [string, 'null'] }
        closed_by: { type: string, format: uuid }
        closed_at: { type: string, format: date-time }
    Change:
      type: object
      required: [seq, entity, op, id]
      properties:
        seq: { type: integer, format: int64 }
        entity:
          {
            type: string,
            enum: [store, member, category, product, customer, debt_entry],
          }
        op: { type: string, enum: [upsert, delete] }
        id: { type: string, format: uuid }
        data:
          description: Full entity for `upsert`, shaped by `entity`; absent for `delete`.
          anyOf:
            - $ref: '#/components/schemas/Store'
            - $ref: '#/components/schemas/Member'
            - $ref: '#/components/schemas/Category'
            - $ref: '#/components/schemas/Product'
            - $ref: '#/components/schemas/Customer'
            - $ref: '#/components/schemas/DebtEntry'
    ChangeFeed:
      type: object
      required: [changes, cursor, has_more]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        cursor: { type: string, description: Pass as `since` next time. }
        has_more: { type: boolean }
        server_time: { type: string, format: date-time }
    StoreEvent:
      type: object
      description: Event envelope. Per-type `data` payloads are defined in [asyncapi.yaml](asyncapi.yaml).
      required: [id, type, version, store_id, occurred_at]
      properties:
        id: { type: string, example: evt_000000000000128 }
        type:
          type: string
          enum:
            - store.created
            - product.enrolled
            - receipt.scanned
            - scan.completed
            - catalog.changed
            - price.changed
            - store.changed
            - member.changed
            - customer.created
            - customer.updated
            - debt.recorded
            - debt.repaid
            - debt.adjusted
            - sale.created
            - sale.voided
            - review.line_flagged
            - review.line_resolved
            - expense.created
            - alert.created
            - alert.resolved
            - day.closed
            - sale.payment_confirmed
            - product.indexed
            - stock.changed
            - stock.low
            - receipt.confirmed
            - assistant.action.confirmed
            - assistant.action.rejected
        version: { type: integer, minimum: 1 }
        store_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor:
          type: [object, 'null']
          properties:
            member_id: { type: string, format: uuid }
            session_id:
              { type: string, description: 'Clerk session id (`sid`).' }
        cursor:
          {
            type: string,
            description: 'Change-feed cursor after this event, when relevant.',
          }
        data: { type: object }

    # Assistant and devices
    AssistantLanguage:
      type: string
      enum:
        - vi
        - en
    AssistantThreadContext:
      type: object
      additionalProperties: false
      required:
        - screen
      properties:
        screen:
          type: string
          minLength: 1
        next_step_id:
          type: string
        receipt_id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
    CreateAssistantThread:
      type: object
      additionalProperties: false
      required: []
      properties:
        title:
          type: string
          minLength: 1
        context:
          $ref: '#/components/schemas/AssistantThreadContext'
    AssistantThread:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - context
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
        context:
          anyOf:
            - $ref: '#/components/schemas/AssistantThreadContext'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssistantThreadPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          additionalProperties: false
          required:
            - items
            - next_cursor
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssistantThread'
            next_cursor:
              type:
                - string
                - 'null'
    AssistantThreadDetail:
      type: object
      additionalProperties: false
      required:
        - thread
        - messages
        - actions
      properties:
        thread:
          $ref: '#/components/schemas/AssistantThread'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AssistantAction'
    AssistantAttachment:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - image_id
          properties:
            image_id:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - receipt_id
          properties:
            receipt_id:
              type: string
              format: uuid
    SendAssistantMessage:
      type: object
      additionalProperties: false
      required:
        - content
        - language
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        attachments:
          type: array
          maxItems: 4
          description: At most 4; duplicates are ignored. More is a 400 validation_failed.
          items:
            $ref: '#/components/schemas/AssistantAttachment'
        language:
          $ref: '#/components/schemas/AssistantLanguage'
    AssistantMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - role
        - content
        - attachments
        - tool_calls
        - cards
        - model
        - feedback
        - created_at
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
        attachments:
          type: array
          description: Attachments sent by the user; empty for assistant messages.
          items:
            $ref: '#/components/schemas/AssistantAttachment'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCallSummary'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/AssistantCard'
        model:
          type:
            - string
            - 'null'
        feedback:
          anyOf:
            - $ref: '#/components/schemas/AssistantFeedback'
            - type: 'null'
        created_at:
          type: string
          format: date-time
    AssistantToolCallSummary:
      type: object
      additionalProperties: false
      required:
        - call_id
        - tool
        - ok
        - summary_vi
      properties:
        call_id:
          type: string
        tool:
          type: string
        ok:
          type: boolean
        summary_vi:
          type: string
    AssistantAction:
      type: object
      additionalProperties: false
      required:
        - id
        - thread_id
        - message_id
        - kind
        - status
        - payload
        - summary_vi
        - proposed_by
        - decided_by
        - decided_at
        - result
        - error
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - stock_adjustment
            - expense
            - price_change
            - threshold_update
            - reorder_list
            - receipt_line_update
            - receipt_confirm
            - repayment
            - debt_adjustment
            - invite
        status:
          type: string
          enum:
            - proposed
            - executing
            - done
            - failed
            - rejected
            - expired
        payload:
          type: object
          additionalProperties: true
          description: Validated tool arguments. Shape depends on kind; proposing never executes a write.
        summary_vi:
          type: string
        proposed_by:
          type: string
          format: uuid
        decided_by:
          type:
            - string
            - 'null'
          format: uuid
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
        result:
          anyOf:
            - type: object
              additionalProperties: true
              description: Execution result, including created or updated entity ids.
            - type: 'null'
        error:
          anyOf:
            - type: object
              additionalProperties: false
              required:
                - code
                - message
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: 'null'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      description:
        A proposal expires after 24 hours or when its target changes. Decisions use the deciding
        member permissions.
    AssistantRestockItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - name
        - quantity
        - unit_cost
        - total_cost
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_cost:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total_cost:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
      description: Suggested base-unit quantity. Cost fields are null when the caller cannot view costs.
    AssistantCard:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
            - receipt_id
            - lines
          properties:
            type:
              type: string
              const: receipt_lines
            receipt_id:
              type: string
              format: uuid
            lines:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - line_id
                  - name
                  - quantity
                  - cost
                  - product_id
                  - product_name
                  - confidence
                properties:
                  line_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  quantity:
                    type:
                      - number
                      - 'null'
                    exclusiveMinimum: 0
                  cost:
                    anyOf:
                      - $ref: '#/components/schemas/Money'
                      - type: 'null'
                  product_id:
                    type:
                      - string
                      - 'null'
                    format: uuid
                  product_name:
                    type: [string, 'null']
                    description: Matched catalog product name; null when unmatched.
                  confidence:
                    type:
                      - number
                      - 'null'
                    minimum: 0
                    maximum: 1
        - type: object
          additionalProperties: false
          required:
            - type
            - items
            - total_cost
          properties:
            type:
              type: string
              const: restock_list
            items:
              type: array
              items:
                $ref: '#/components/schemas/AssistantRestockItem'
            total_cost:
              anyOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
        - type: object
          additionalProperties: false
          required:
            - type
            - items
          properties:
            type:
              type: string
              const: debt_list
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - customer_id
                  - name
                  - total
                  - overdue_days
                properties:
                  customer_id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  total:
                    $ref: '#/components/schemas/Money'
                  overdue_days:
                    type: integer
                    minimum: 0
        - type: object
          additionalProperties: false
          required:
            - type
            - title_vi
            - unit
            - bars
          properties:
            type:
              type: string
              const: chart_bars
            title_vi:
              type: string
            unit:
              type: string
              enum: [dong, units]
            bars:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - label
                  - value
                properties:
                  label:
                    type: string
                  value:
                    type: integer
                    format: int64
          description: Bars contain signed integers in the declared unit (VND or item units); profit bars may be negative.
    AssistantMessageCreated:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
      properties:
        message_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
    AssistantMessageDelta:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
    AssistantToolStarted:
      type: object
      additionalProperties: false
      required:
        - call_id
        - tool
        - label_vi
      properties:
        call_id:
          type: string
        tool:
          type: string
        label_vi:
          type: string
    AssistantToolFinished:
      type: object
      additionalProperties: false
      required:
        - call_id
        - tool
        - ok
        - summary_vi
      properties:
        call_id:
          type: string
        tool:
          type: string
        ok:
          type: boolean
        summary_vi:
          type: string
    AssistantMessageCompleted:
      type: object
      additionalProperties: false
      required:
        - message_id
        - model
        - usage
      properties:
        message_id:
          type: string
          format: uuid
        model:
          type: string
        usage:
          type: object
          additionalProperties: false
          required:
            - input_tokens
            - output_tokens
          properties:
            input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
            cost:
              description: Actual OpenRouter usage costs in USD; absent when accounting is unavailable.
              type: object
              additionalProperties: false
              required: [input_usd, output_usd, total_usd]
              properties:
                input_usd:
                  type: [number, 'null']
                  minimum: 0
                output_usd:
                  type: [number, 'null']
                  minimum: 0
                total_usd:
                  type: number
                  minimum: 0

    AssistantStreamError:
      type: object
      additionalProperties: false
      required:
        - code
        - message_vi
      properties:
        code:
          type: string
          enum:
            - quota
            - model_unavailable
            - timeout
            - internal
        message_vi:
          type: string
    AssistantStreamEvent:
      description:
        'Parsed SSE frame: event name and one JSON data payload. message.completed and error are
        terminal. No Last-Event-ID or automatic POST retries.'
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: message.created
            data:
              $ref: '#/components/schemas/AssistantMessageCreated'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: message.delta
            data:
              $ref: '#/components/schemas/AssistantMessageDelta'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: tool.started
            data:
              $ref: '#/components/schemas/AssistantToolStarted'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: tool.finished
            data:
              $ref: '#/components/schemas/AssistantToolFinished'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: action.proposed
            data:
              $ref: '#/components/schemas/AssistantAction'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: card
            data:
              $ref: '#/components/schemas/AssistantCard'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: message.completed
            data:
              $ref: '#/components/schemas/AssistantMessageCompleted'
        - type: object
          additionalProperties: false
          required:
            - event
            - data
          properties:
            event:
              type: string
              const: error
            data:
              $ref: '#/components/schemas/AssistantStreamError'
    AssistantFeedback:
      type: object
      additionalProperties: false
      required:
        - rating
      properties:
        rating:
          type: string
          enum:
            - up
            - down
        comment:
          type: string
    NextStep:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - title_vi
        - subtitle_vi
        - priority
        - action
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - receipt_detected
            - unknown_product
            - restock
            - draft_receipts
            - overdue_debts
            - day_close
            - review_queue
            - digest
            - setup
            - margin_alert
        title_vi:
          type: string
        subtitle_vi:
          type:
            - string
            - 'null'
        priority:
          type: integer
          description: Lower values appear first.
        action:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - route
              properties:
                type:
                  type: string
                  const: navigate
                route:
                  type: string
                  minLength: 1
            - type: object
              additionalProperties: false
              required:
                - type
                - prompt_vi
                - context
              properties:
                type:
                  type: string
                  const: chat
                prompt_vi:
                  type: string
                context:
                  $ref: '#/components/schemas/AssistantThreadContext'
    NextStepList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NextStep'
          maxItems: 8
    Digest:
      type: object
      additionalProperties: false
      required:
        - business_date
        - generated_at
        - source
        - summary_vi
        - sales
        - restock
        - overdue_debts
        - open_drafts
        - read_at
      properties:
        business_date:
          type: string
          format: date
        generated_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - model
            - template
        summary_vi:
          type: string
        sales:
          type: object
          additionalProperties: false
          required:
            - revenue
            - sale_count
            - gross_profit
            - change_pct
          properties:
            revenue:
              $ref: '#/components/schemas/Money'
            sale_count:
              type: integer
              minimum: 0
            gross_profit:
              type:
                - integer
                - 'null'
              format: int64
              description: Signed VND profit; null when the caller cannot view profit.
            change_pct:
              type:
                - number
                - 'null'
              description: Revenue change versus the preceding business date; null without a comparison.
        restock:
          type: array
          items:
            $ref: '#/components/schemas/AssistantRestockItem'
        overdue_debts:
          type: object
          additionalProperties: false
          required:
            - count
            - total
          properties:
            count:
              type: integer
              minimum: 0
            total:
              $ref: '#/components/schemas/Money'
        open_drafts:
          type: object
          additionalProperties: false
          required:
            - count
          properties:
            count:
              type: integer
              minimum: 0
        read_at:
          type:
            - string
            - 'null'
          format: date-time
    RegisterDevice:
      type: object
      additionalProperties: false
      required:
        - token
        - platform
        - app_version
        - language
      properties:
        token:
          type: string
          minLength: 1
          description: Expo push token, unique across registrations.
          example: ExponentPushToken[example]
        platform:
          type: string
          enum:
            - android
            - ios
        app_version:
          type: string
          minLength: 1
        language:
          $ref: '#/components/schemas/AssistantLanguage'
    Device:
      type: object
      additionalProperties: false
      required:
        - token
        - platform
        - app_version
        - language
        - created_at
        - updated_at
      properties:
        token:
          type: string
          minLength: 1
          description: Expo push token, unique across registrations.
          example: ExponentPushToken[example]
        platform:
          type: string
          enum:
            - android
            - ios
        app_version:
          type: string
          minLength: 1
        language:
          $ref: '#/components/schemas/AssistantLanguage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
