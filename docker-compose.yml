name: taphoa-mini

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taphoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taphoa}
      POSTGRES_DB: ${POSTGRES_DB:-taphoa}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-taphoa-local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-taphoa-local-secret}
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9000}:9000'
    volumes:
      - storage_data:/data
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    image: ${BACKEND_IMAGE:-taphoa-mini-backend:dev}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        SKIP_MODELS: ${SKIP_MODELS:-1}
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://${POSTGRES_USER:-taphoa}:${POSTGRES_PASSWORD:-taphoa}@postgres:5432/${POSTGRES_DB:-taphoa}
      REDIS_URL: redis://redis:6379
      # Clerk session JWTs are verified against the JWKS of this key's Frontend API. The default is
      # the development instance's publishable key, public by design (it ships in the app bundle).
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_ZnVsbC1tb2NjYXNpbi01NDA3LmNsZXJrLmFjY291bnRzLmRldiQ}
      # Optional (profile reads). No value: passed through only when set in the shell or `.env`.
      CLERK_SECRET_KEY:
      # Local/e2e only: raise per-IP auth limits so test suites can create many stores.
      RATE_LIMIT_STORE_CREATE_PER_HOUR: ${RATE_LIMIT_STORE_CREATE_PER_HOUR:-100000}
      RATE_LIMIT_JOIN_PER_HOUR: ${RATE_LIMIT_JOIN_PER_HOUR:-100000}
      RATE_LIMIT_RECOVER_PER_10MIN: ${RATE_LIMIT_RECOVER_PER_10MIN:-100000}
      AWS_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-taphoa-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-taphoa-local-secret}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-images}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:${STORAGE_PORT:-9000}}
      IMAGE_URL_TTL_SECONDS: ${IMAGE_URL_TTL_SECONDS:-900}
      RUST_LOG: ${RUST_LOG:-info}
      # `mock` stands in for the DINO model so enrollment works without model files (local only).
      EMBEDDER: ${EMBEDDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
  mobile:
    profiles: [mobile]
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.dev
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
      # Same Clerk instance as the backend service (public key, see above).
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-pk_test_ZnVsbC1tb2NjYXNpbi01NDA3LmNsZXJrLmFjY291bnRzLmRldiQ}}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    ports:
      - '8081:8081'
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  storage_data:
