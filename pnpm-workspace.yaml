packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  lefthook: true
  unrs-resolver: true
  '@scarf/scarf': false
  browser-tabs-lock: false
  core-js: false

# Security advisories (issue #162). Each pins only the vulnerable range to its patched release.
# Left open on purpose, no usable fix:
#   @faker-js/faker 5.5.3 (dev-only prism mock; postman-collection pins it exactly, and the
#   patched 10.x drops the `faker.address` API that postman-collection calls)
#   deepmerge (latest published 4.3.1, the patched 4.3.2 does not exist)
overrides:
  'node-forge@<=1.4.0': '>=1.4.1'
  'zod@<4.6.6': '>=4.6.6 <5'
  'body-parser@>=2.0.0 <2.4.0': '>=2.4.0 <3'
  'lodash@<=4.17.23': '>=4.17.24 <5'
  'uuid@<11.1.1': '>=11.1.1 <12'
