activity = "Phân phối, cung cấp hàng hóa (bán lẻ)"
annual_threshold_dong = 1000000000
presumptive_tax_ended_on = "2026-01-01"
regulation_note_vi = "Từ 01/01/2026 chấm dứt thuế khoán; hộ kinh doanh tự kê khai, nộp thuế. Nghị định 141/2026/NĐ-CP sửa Nghị định 68/2026/NĐ-CP ngày 05/03/2026, nâng ngưỡng từ 500 triệu đồng của Điều 7 Luật Thuế thu nhập cá nhân 2025 lên 1 tỷ đồng, áp dụng từ 01/01/2026."
vat_base_note_vi = "Cần xác nhận với cơ quan thuế: VAT tính trên toàn bộ doanh thu hay phần vượt ngưỡng. Ước tính này dùng toàn bộ doanh thu cho VAT và phần vượt 1 tỷ đồng cho PIT theo phương pháp doanh thu."
exempt_declaration_vi = "Không nộp VAT và PIT khi doanh thu năm không quá 1 tỷ đồng. Vẫn giữ sổ doanh thu và thông báo doanh thu Mẫu 01/TKN-CNKD theo Thông tư 18/2026/TT-BTC, chậm nhất 31/01 năm sau; hộ bắt đầu giữa năm thông báo vào 31/07 và 31/01."
quarterly_declaration_vi = "Kê khai theo quý từ quý có doanh thu vượt ngưỡng. Hãy xác nhận hạn nộp tờ khai và tiền thuế cụ thể với cơ quan thuế."
monthly_declaration_vi = "Doanh thu trên 50 tỷ đồng: kê khai theo tháng. Hãy xác nhận hạn nộp tờ khai và tiền thuế cụ thể với cơ quan thuế."
einvoice_vi = "Trên 1 tỷ đồng phải dùng hóa đơn điện tử có mã hoặc từ máy tính tiền; đăng ký trong 30 ngày sau kỳ có doanh thu lũy kế vượt 1 tỷ đồng."
income_method_note_vi = "Phương pháp thu nhập cần thu nhập chịu thuế đã xác nhận; doanh thu trừ chi phí trong ứng dụng chưa đủ để xác định thu nhập chịu thuế. Không ước tính PIT theo phương pháp này khi chưa có dữ liệu thu nhập."
disclaimer_vi = "Số liệu tham khảo; hãy xác nhận với cơ quan thuế."

