[package]
name = "taphoa-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "taphoa-api"
path = "src/main.rs"

[[bin]]
name = "taphoa-seed"
path = "src/bin/taphoa_seed.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
futures-util = "0.3"
aws-config = { version = "1.13.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
axum.workspace = true
image.workspace = true
http-body-util.workspace = true
redis = { workspace = true, features = ["script"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["chrono", "json"] }
taphoa-recognition = { path = "../recognition" }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4", "v7", "serde"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
pgvector = { version = "0.4", features = ["sqlx"] }
sha2 = "0.11.1"
rand = "0.10.3"
hex = "0.4.3"
chrono-tz = "0.10.4"
thiserror.workspace = true
base32 = "0.5.1"
subtle = "2.6.1"
serde_urlencoded = "0.7.1"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.22"
rust_xlsxwriter = "=0.101.0"
ab_glyph = "0.2.32"
printpdf = { version = "0.12.8", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
tower.workspace = true
jsonschema = { version = "0.60", default-features = false }
serde_norway = "0.9"
image.workspace = true
