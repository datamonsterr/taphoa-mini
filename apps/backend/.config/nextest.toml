# cargo-nextest profiles. CI writes JUnit to target/nextest/ci/junit.xml for job summaries.
[profile.default]
fail-fast = true

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# Railway integration tests go through public TCP proxies: a hanging test should fail fast
# (60 s) instead of eating 120 s of the job budget.
[profile.railway]
inherits = "ci"
slow-timeout = { period = "20s", terminate-after = 3 }

[profile.railway.junit]
path = "junit.xml"

# The seed CLI test runs the taphoa-seed binary twice (about 70 s on a busy host).
[[profile.ci.overrides]]
filter = 'test(seed_cli_warns_without_key_and_prints_sign_in_emails_with_it)'
slow-timeout = { period = "60s", terminate-after = 5 }
