appId: com.datamonsterr.taphoamini
---
# Add a profile from Sổ nợ without a sale, sell on credit to that customer,
# then collect the balance. Reuses the shared setup/enrollment subflows.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Sổ nợ'
      OWNER_NAME: 'Cô Ba'
# Create the customer away from checkout.
- tapOn: 'Vuốt lên: cửa hàng'
- extendedWaitUntil:
    visible: 'Báo cáo'
    timeout: 15000
- tapOn: 'Báo cáo'
- scrollUntilVisible:
    element:
      text: 'Sổ nợ, 0đ.*'
    timeout: 30000
- scroll
- tapOn: 'Sổ nợ, 0đ.*'
- extendedWaitUntil:
    visible: 'Thêm khách hàng'
    timeout: 20000
- tapOn: 'Thêm khách hàng'
- extendedWaitUntil:
    visible: 'Tên khách hàng'
    timeout: 10000
- tapOn: 'Tên khách hàng'
- inputText: 'Chị Lan'
- pressKey: Enter
- tapOn: 'Số điện thoại (không bắt buộc)'
- inputText: '0912345678'
# Enter blurs this single-line field without sending Android Back to the sheet.
- pressKey: Enter
- assertVisible: 'Tạo khách hàng'
- takeScreenshot: debts-01-create-from-book
- tapOn: 'Tạo khách hàng'
- extendedWaitUntil:
    visible: 'Hết nợ 0đ'
    timeout: 20000
- assertVisible: 'Chị Lan'
- tapOn: 'Quay lại'
- tapOn: 'Quay lại'
- tapOn: 'Mở camera'
- extendedWaitUntil:
    visible: 'Chụp'
    timeout: 15000
- runFlow:
    file: subflows/enroll-product.yaml
    env:
      PRODUCT_NAME: 'Kẹo dừa'
# cart: the product enrolled and added itself (15.000đ)
- tapOn: 'Giỏ hàng:.*'
- extendedWaitUntil:
    visible: 'Hiện mã QR thanh toán'
    timeout: 20000
- tapOn: 'Hiện mã QR thanh toán'
# Select the profile created from Sổ nợ.
- extendedWaitUntil:
    visible: 'Ghi nợ'
    timeout: 20000
- tapOn: 'Ghi nợ'
- extendedWaitUntil:
    visible: 'Chị Lan, 0đ'
    timeout: 20000
- assertVisible: 'Chọn khách ghi nợ'
- assertVisible: '0912345678'
- tapOn: 'Chị Lan, 0đ'
# the picker closes and the pay screen shows who owes
- extendedWaitUntil:
    visible: '.*Đổi khách hàng'
    timeout: 20000
- assertVisible: 'Nợ mới của khách 15.000đ'
- takeScreenshot: debts-02-pay-credit
- tapOn: 'Ghi nợ 15.000đ'
# back at the camera with an empty cart
- extendedWaitUntil:
    visible: 'Giỏ hàng trống'
    timeout: 30000
# the dashboard card shows the debt as the server computed it
- tapOn: 'Vuốt lên: cửa hàng'
- extendedWaitUntil:
    visible: 'Báo cáo'
    timeout: 15000
- tapOn: 'Báo cáo'
# the card sits below the fold (the morning digest card now precedes it): scroll it into view
- scrollUntilVisible:
    element:
      text: 'Sổ nợ, 15.000đ.*'
    timeout: 30000
# clear the floating bar before tapping
- scroll
- takeScreenshot: debts-03-dashboard-card
- tapOn: 'Sổ nợ, 15.000đ.*'
# the debt book: the total and the customer
- extendedWaitUntil:
    visible: 'Tổng nợ 15.000đ'
    timeout: 20000
- assertVisible: 'Chị Lan, 15.000đ'
- takeScreenshot: debts-04-book
- tapOn: 'Chị Lan, 15.000đ'
# the customer screen: collect the whole balance (the amount starts at the balance)
- extendedWaitUntil:
    visible: 'Còn nợ 15.000đ'
    timeout: 20000
- tapOn: 'Thu nợ'
- extendedWaitUntil:
    visible: 'Xác nhận thu nợ'
    timeout: 20000
- takeScreenshot: debts-05-collect
- tapOn: 'Xác nhận thu nợ'
# settled: the balance shows 0đ
- extendedWaitUntil:
    visible: 'Hết nợ 0đ'
    timeout: 30000
- takeScreenshot: debts-06-settled
