appId: com.datamonsterr.taphoamini
---
# Sell on credit, repay, see zero balance. The product is added by hand (so the flow does not
# depend on what recognition makes of the emulator's virtual camera): cart -> "Ghi nợ" with a
# customer created in the picker -> the dashboard's debt card -> the debt book -> "Thu nợ" in
# full -> the customer owes 0đ.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Sổ nợ'
      OWNER_NAME: 'Cô Ba'
- runFlow:
    file: subflows/enroll-product.yaml
    env:
      PRODUCT_NAME: 'Kẹo dừa'
# cart: the product enrolled and added itself (15.000đ)
- tapOn: 'Giỏ hàng:.*'
- extendedWaitUntil:
    visible: 'Hiện mã QR thanh toán'
    timeout: 20000
- tapOn: 'Hiện mã QR thanh toán'
# "Ghi nợ" opens the customer picker; nobody is in the book yet, so create the customer inline
- extendedWaitUntil:
    visible: 'Ghi nợ'
    timeout: 20000
- tapOn: 'Ghi nợ'
- extendedWaitUntil:
    visible: 'Tạo khách hàng'
    timeout: 20000
- tapOn: 'Tên khách hàng'
- inputText: 'Chị Lan'
- hideKeyboard
- takeScreenshot: debts-01-picker
- tapOn: 'Tạo khách hàng'
# the picker closes and the pay screen shows who owes
- extendedWaitUntil:
    visible: 'Đổi khách hàng'
    timeout: 20000
- assertVisible: '15.000đ'
- takeScreenshot: debts-02-pay-credit
- tapOn: 'Đã nhận tiền'
# back at the camera with an empty cart
- extendedWaitUntil:
    visible: 'Giỏ hàng trống'
    timeout: 30000
# the dashboard card shows the debt as the server computed it
- tapOn: 'Vuốt lên: cửa hàng'
- extendedWaitUntil:
    visible: 'Báo cáo'
    timeout: 15000
- tapOn: 'Báo cáo'
- extendedWaitUntil:
    visible: 'Sổ nợ, 15.000đ.*'
    timeout: 30000
# the card is the last block above the floating bar: scroll it clear of the bar before tapping
- scroll
- takeScreenshot: debts-03-dashboard-card
- tapOn: 'Sổ nợ, 15.000đ.*'
# the debt book: the total and the customer
- extendedWaitUntil:
    visible: 'Tổng nợ 15.000đ'
    timeout: 20000
- assertVisible: 'Chị Lan, 15.000đ'
- takeScreenshot: debts-04-book
- tapOn: 'Chị Lan, 15.000đ'
# the customer screen: collect the whole balance (the amount starts at the balance)
- extendedWaitUntil:
    visible: 'Còn nợ 15.000đ'
    timeout: 20000
- tapOn: 'Thu nợ'
- extendedWaitUntil:
    visible: 'Xác nhận thu nợ'
    timeout: 20000
- takeScreenshot: debts-05-collect
- tapOn: 'Xác nhận thu nợ'
# settled: the balance shows 0đ
- extendedWaitUntil:
    visible: 'Hết nợ 0đ'
    timeout: 30000
- takeScreenshot: debts-06-settled
