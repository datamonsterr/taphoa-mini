appId: com.datamonsterr.taphoamini
---
# Sale journey: capture -> add -> cart -> quantity -> VietQR -> received -> empty cart on camera.
- runFlow: subflows/launch.yaml
- tapOn: 'Chụp'
- extendedWaitUntil:
    visible: 'Thêm vào giỏ'
    timeout: 15000
- takeScreenshot: journey-01-scan-result
- tapOn: 'Thêm vào giỏ'
- extendedWaitUntil:
    visible: 'Giỏ hàng: 1 món.*'
    timeout: 20000
- tapOn: 'Giỏ hàng: 1 món.*'
- extendedWaitUntil:
    visible: 'Thêm một'
    timeout: 10000
- tapOn: 'Thêm một'
- takeScreenshot: journey-02-cart
- tapOn: 'Hiện mã QR thanh toán'
- extendedWaitUntil:
    visible: 'Mã VietQR.*'
    timeout: 20000
- takeScreenshot: journey-03-pay-transfer
- tapOn: 'Đã nhận tiền'
- extendedWaitUntil:
    visible: 'Giỏ hàng trống'
    timeout: 20000
- assertVisible: 'Chụp'
- takeScreenshot: journey-04-camera-empty
