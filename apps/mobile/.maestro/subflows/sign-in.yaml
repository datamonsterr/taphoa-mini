appId: com.datamonsterr.taphoamini
---
# Signs in through the app's own screens (email, then the 6-digit code) against the real Clerk
# development instance. Starts on the sign-in form: after launch.yaml, or the add-person form
# of the account tab ("Thêm người trên máy này"). Same screens, same steps.
#
# Input (optional): EMAIL. Without it a unique address is made, so every run gets a user of its
# own: `e2e-maestro-<timestamp><random>+clerk_test@example.com`. The `+clerk_test` subaddress
# sends no mail and always verifies with 424242; the `e2e-` prefix lets the e2e sweep
# (packages/e2e) delete these users later. With RUN_TAG set (CI passes `-e RUN_TAG=...`) the
# address is `e2e-maestro-<RUN_TAG>-<timestamp><random>+clerk_test@example.com`, so the CI job
# can delete exactly its own users when it ends.
# Output: output.email, the address that was used.
#
# Ends on the first screen of the signed-in app: the welcome screen for an address Clerk has not
# seen (no store yet), the camera for a person who already has a store.
# Clerk's Frontend API allows 5 sign-in creations and 3 attempts per 10 s: one pass through
# this flow stays far below that, so never retry it in a loop.
- evalScript: "${output.email = (typeof EMAIL !== 'undefined' && EMAIL) ? EMAIL : 'e2e-maestro-' + ((typeof RUN_TAG !== 'undefined' && RUN_TAG) ? RUN_TAG + '-' : '') + Date.now() + Math.floor(Math.random() * 1000000) + '+clerk_test@example.com'}"
- tapOn:
    id: 'auth-email'
- inputText: ${output.email}
# Enter submits the form (the field's onSubmitEditing).
- pressKey: Enter
# Clerk creates the sign-in (or the sign-up for a new address) and sends the code.
- extendedWaitUntil:
    visible:
      id: 'auth-code'
    timeout: 60000
- tapOn:
    id: 'auth-code'
- inputText: '424242'
- pressKey: Enter
# Verify, finalize the session, then the app reads /v1/me from the backend.
- extendedWaitUntil:
    visible: '(Tạo cửa hàng|Giỏ hàng trống)'
    timeout: 90000
