appId: com.datamonsterr.taphoamini
---
# Manual sale/enrollment flows explicitly choose the persisted Account setting.
# The auto-identify flow uses create-store-auto.yaml to prove the production default.
# Input: STORE_NAME, OWNER_NAME.
- runFlow:
    file: create-store-auto.yaml
    env:
      STORE_NAME: ${STORE_NAME}
      OWNER_NAME: ${OWNER_NAME}
- runFlow: manual-camera.yaml
