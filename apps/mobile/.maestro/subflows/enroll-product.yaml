appId: com.datamonsterr.taphoamini
---
# From an empty store: scan the virtual camera and use the unknown "?" pill for legacy
# single-photo enrollment. The tag now toggles quick enrollment. Saving also fills the cart.
# Input: PRODUCT_NAME. The price is 15.000đ (keys 1, 5, 000).
- tapOn: 'Chụp'
- extendedWaitUntil:
    visible: 'Chưa có trong kho, nhập giá'
    timeout: 30000
- tapOn: 'Chưa có trong kho, nhập giá'
- extendedWaitUntil:
    visible: 'Lưu vào kho và thêm vào giỏ'
    timeout: 20000
- extendedWaitUntil:
    visible: '1/5'
    timeout: 20000
- tapOn: 'Tên (không bắt buộc)'
- inputText: ${PRODUCT_NAME}
# Enter blurs the single-line name field and closes the keyboard. hideKeyboard is not used here:
# when Maestro cannot tell the keyboard is up it presses Back, which closes the enroll sheet.
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Lưu vào kho và thêm vào giỏ'
    timeout: 10000
- tapOn: '1'
- tapOn: '5'
- tapOn: '000'
- assertVisible: '15.000đ'
- tapOn: 'Lưu vào kho và thêm vào giỏ'
- extendedWaitUntil:
    visible: 'Giỏ hàng: 1 món, 15.000đ'
    timeout: 30000
