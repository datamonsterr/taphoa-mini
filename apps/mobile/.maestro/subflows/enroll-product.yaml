appId: com.datamonsterr.taphoamini
---
# From the live camera: add a product by hand ("Thêm vào kho với giá"): one photo from the
# emulator's virtual camera, a name and a price on the keypad. It does not depend on what the
# recognition pipeline makes of the picture. Saving also puts the product in the cart.
# Input: PRODUCT_NAME. The price is 15.000đ (keys 1, 5, 000).
- tapOn: 'Thêm vào kho với giá'
- extendedWaitUntil:
    visible: 'Lưu vào kho và thêm vào giỏ'
    timeout: 20000
- tapOn: 'Thêm ảnh góc khác'
- extendedWaitUntil:
    visible: 'Hủy chụp'
    timeout: 20000
- tapOn: 'Chụp'
- extendedWaitUntil:
    visible: '1/5'
    timeout: 20000
- tapOn: 'Tên (không bắt buộc)'
- inputText: ${PRODUCT_NAME}
- hideKeyboard
- tapOn: '1'
- tapOn: '5'
- tapOn: '000'
- assertVisible: '15.000đ'
- tapOn: 'Lưu vào kho và thêm vào giỏ'
- extendedWaitUntil:
    visible: 'Giỏ hàng: 1 món, 15.000đ'
    timeout: 30000
