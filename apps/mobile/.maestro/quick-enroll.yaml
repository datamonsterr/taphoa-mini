appId: com.datamonsterr.taphoamini
---
# CI's static emulator camera cannot supply eight changed views. This smoke checks the
# native tag's arm/cancel surface. device/one-trip-enroll.yaml covers capture on a phone.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Thêm nhanh'
      OWNER_NAME: 'Cô Ba'
- tapOn: 'Thêm vào kho với giá'
- assertVisible: 'Chạm vào khung sản phẩm'
- assertVisible:
    id: 'one-trip-lock'
- assertNotVisible:
    id: 'point-overlay-canvas'
- takeScreenshot: quick-enroll-01-armed
- tapOn: 'Thêm vào kho với giá'
- assertNotVisible:
    id: 'one-trip-lock'
- assertVisible: 'Chụp'
- takeScreenshot: quick-enroll-02-cancelled
