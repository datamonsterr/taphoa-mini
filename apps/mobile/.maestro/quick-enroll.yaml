appId: com.datamonsterr.taphoamini
---
# Real segmentation and enrollment, followed by counter scan and checkout match.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Thêm nhanh'
      OWNER_NAME: 'Cô Ba'
- tapOn: 'Thêm vào kho với giá'
- assertVisible: 'Xoay sản phẩm'
- assertNotVisible: 'Thêm sản phẩm'
- repeat:
    times: 3
    commands:
      - tapOn: 'Chụp'
      - extendedWaitUntil:
          visible:
            id: 'point-overlay-canvas'
          timeout: 30000
      - extendedWaitUntil:
          notVisible: 'Đang tải ảnh...'
          timeout: 30000
      - tapOn:
          id: 'point-overlay-canvas'
          point: '50%,50%'
      - extendedWaitUntil:
          visible:
            id: 'point-overlay-mask'
          timeout: 30000
      - assertVisible: 'Tiếp'
      - tapOn: 'Tiếp'
- assertVisible: 'Thêm sản phẩm'
- tapOn:
    id: 'quick-enroll-add'
- extendedWaitUntil:
    visible: 'Lưu sản phẩm'
    timeout: 20000
- assertVisible: 'Thêm hàng nhanh · 3/3'
- assertVisible: '3/8'
- tapOn: 'Tên (không bắt buộc)'
- inputText: 'Banh nhanh E2E'
# Enter blurs this single-line field without sending Android Back to the sheet.
- pressKey: Enter
- assertVisible: 'Lưu sản phẩm'
- tapOn: '1'
- tapOn: '7'
- tapOn: '000'
- assertVisible: '17.000đ'
- tapOn: 'Lưu sản phẩm'
- extendedWaitUntil:
    visible: 'Đã thêm Banh nhanh E2E'
    timeout: 30000
- takeScreenshot: quick-enroll-01-saved
- extendedWaitUntil:
    notVisible: 'đang học'
    timeout: 30000
# Reshoot the same product on the counter to match and add to cart
- tapOn: 'Chụp'
- extendedWaitUntil:
    visible: 'Thêm vào giỏ'
    timeout: 30000
- assertVisible: '.*17.000đ.*'
- tapOn: 'Thêm vào giỏ'
- extendedWaitUntil:
    visible: 'Giỏ hàng: 1 món, 17.000đ'
    timeout: 20000
- tapOn: 'Giỏ hàng:.*'
- extendedWaitUntil:
    visible: 'Hiện mã QR thanh toán'
    timeout: 20000
- assertVisible: 'Banh nhanh E2E'
- assertVisible: '17.000đ'
- takeScreenshot: quick-enroll-02-matched
