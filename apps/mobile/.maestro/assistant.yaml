appId: com.datamonsterr.taphoamini
---
# The assistant on a new store (real backend; CI runs X3's scripted model, so replies are exact).
# While the backend has no /v1/assistant/* routes (probe below) the flow passes after creating the
# store: the assistant steps are skipped, not failed.
#
# Not covered here: the receipt chat (receipt_lines card, confirm). It needs a camera frame with a
# document, which the CI emulator's virtual camera cannot produce. Playwright covers it
# (e2e-web/assistant.spec.ts) by creating the receipt through the API.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Trợ lý'
      OWNER_NAME: 'Cô Ba'
- runScript:
    file: subflows/assistant-probe.js
    env:
      # runScript runs in the Maestro CLI on the host, not on the emulator: localhost, not 10.0.2.2
      API_URL: 'http://localhost:8080'
- runFlow:
    when:
      true: ${output.assistant}
    commands:
      # the chat button of the camera bottom row opens the chat
      - tapOn: 'Mở trợ lý'
      - extendedWaitUntil:
          visible:
            id: 'assistant-screen'
          timeout: 20000
      # hold-to-talk mic: always present on Android (disabled when the device has no recognizer)
      - assertVisible: 'Giữ để nói'
      # board 17: the header says Trợ lý (no thread title) and has the collapse chevron
      - assertVisible: 'Trợ lý'
      - assertVisible:
          id: 'assistant-close'
      - takeScreenshot: assistant-01-open
      # a scripted exchange: anything else gets the fixed greeting
      # Keyboard regression: the composer must sit above the soft keyboard. Check the input and
      # Send while the keyboard is open, then tap Send: a covered button would take the tap on the
      # keyboard instead. Enter alone sends blind and closes the keyboard, so it hid this bug.
      - tapOn:
          id: 'assistant-input'
      - inputText: 'Xin chào'
      - assertVisible:
          id: 'assistant-input'
          text: 'Xin chào'
      - assertVisible:
          id: 'assistant-send'
          enabled: true
      - takeScreenshot: assistant-02-keyboard
      - tapOn:
          id: 'assistant-send'
      - assertVisible:
          id: 'assistant-screen'
      - extendedWaitUntil:
          visible:
            id: 'user-message'
          timeout: 20000
      - extendedWaitUntil:
          visible: 'Xin chào! Mình là trợ lý của cửa hàng.'
          timeout: 60000
      - takeScreenshot: assistant-03-reply
      # a proposal, when the scripted model makes one (it needs a tracked product): confirm it.
      # A new chat, so the thumbs below belong to this turn's reply only.
      - tapOn:
          id: 'assistant-new-chat'
      - tapOn:
          id: 'assistant-input'
      - inputText: 'Điều chỉnh tồn kho'
      - pressKey: Enter
      - assertVisible:
          id: 'assistant-screen'
      - extendedWaitUntil:
          visible:
            id: 'feedback-up'
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: 'action-confirm'
          commands:
            - tapOn:
                id: 'action-confirm'
            - extendedWaitUntil:
                visible: 'Đã thực hiện'
                timeout: 30000
            - takeScreenshot: assistant-04-confirmed
      - tapOn:
          id: 'assistant-close'
      - extendedWaitUntil:
          visible: 'Giỏ hàng trống'
          timeout: 20000
      # the setup chip (a new store gets it from the server) opens the chat and sends its prompt.
      # Target it by id: after 20:00 the day_close chip comes first and opens a screen instead.
      - runFlow:
          when:
            visible:
              id: 'next-step-chip-setup.*'
          commands:
            - tapOn:
                id: 'next-step-chip-setup.*'
            - extendedWaitUntil:
                visible:
                  id: 'assistant-screen'
                timeout: 20000
            # the chip's prompt is a turn like any other: it streams to its end (thumbs show)
            - extendedWaitUntil:
                visible:
                  id: 'feedback-up'
                timeout: 60000
            - takeScreenshot: assistant-05-chip
