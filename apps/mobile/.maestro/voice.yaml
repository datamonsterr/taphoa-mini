appId: com.datamonsterr.taphoamini
---
# Voice sale on a new store (real backend with the V1 voice routes). A phone cannot speak into the
# emulator reliably, so the flow opens the sheet through the debug deep link
# `taphoa://voice?fixture=<clip>`: the app uploads that fixture clip name instead of recording
# (honoured only because the E2E build sets EXPO_PUBLIC_VOICE_FIXTURES=1). While the backend has
# no /v1/voice/* routes (probe below) the flow passes after creating the store: the voice steps
# are skipped, not failed.
#
# Not covered here: the real microphone and the Android bubble (V3). Playwright (voice.spec.ts)
# and Jest cover the long-press and the chip entry points.
- runFlow: subflows/launch.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Giọng nói'
      OWNER_NAME: 'Cô Ba'
- runScript:
    file: subflows/voice-probe.js
    env:
      # runScript runs in the Maestro CLI on the host, not on the emulator: localhost, not 10.0.2.2
      API_URL: 'http://localhost:8080'
- runFlow:
    when:
      true: ${output.voice}
    commands:
      - openLink: 'taphoa://voice?entry=chip&fixture=two-line-sale.m4a'
      # the sheet opens recording; the fixture stands in for the microphone
      - extendedWaitUntil:
          visible:
            id: 'voice-listening'
          timeout: 20000
      - assertVisible: 'Nói tên hàng và giá'
      - takeScreenshot: voice-01-listening
      - tapOn: 'Xong, hiểu lời vừa nói'
      # the draft sheet: transcript, lines, total and the payment toggle
      - extendedWaitUntil:
          visible:
            id: 'voice-draft'
          timeout: 30000
      - assertVisible:
          id: 'voice-total'
      - assertVisible: 'Tiền mặt'
      - takeScreenshot: voice-02-draft
      # the green check records the sale and shows the toast, then the sheet closes
      - tapOn: 'Xác nhận bán'
      - extendedWaitUntil:
          visible: 'Đã bán .* món .*'
          timeout: 30000
      - takeScreenshot: voice-03-sold
      - extendedWaitUntil:
          visible: 'Giỏ hàng trống'
          timeout: 20000
