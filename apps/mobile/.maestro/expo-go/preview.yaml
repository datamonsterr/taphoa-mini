appId: host.exp.exponent
---
# Expo Go preview check: Expo Go opens exp://10.0.2.2:8081 (Metro on the runner) and the app
# reaches its first screen. A fresh install has no Clerk session, so that is the sign-in screen;
# this job signs nobody in and starts no backend, so it stops there (the Android E2E job drives
# the real backend and Clerk). Run by scripts/e2e-expo-go.sh only; the main suite does not
# recurse into this folder.
# Expo Go may show its onboarding / dev-menu prompts on first launch: dismiss them if present.
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Got it'
    commands:
      - tapOn: 'Got it'
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: 'Wait'
# Cold bundle download + Hermes load in Expo Go on a software-GPU emulator is slow.
# On first launch Expo Go opens its developer-menu sheet (app name, Reload / Go home, TOOLS)
# over the app. The sheet is a modal, so the app's own views are hidden from Maestro until
# it closes: wait for the sheet first, then close it with its X (top right of the sheet).
- extendedWaitUntil:
    visible: '(Go home|Gửi mã|Continue)'
    timeout: 180000
# The first-run dev-menu intro ("This is the developer menu… Continue") can appear only once the
# bundle has loaded, after the checks above ran; it is a modal that hides the app.
- repeat:
    while:
      visible: 'Continue'
    times: 3
    commands:
      - tapOn: 'Continue'
      - waitForAnimationToEnd:
          timeout: 3000
- repeat:
    while:
      visible: 'Go home'
    times: 3
    commands:
      - tapOn:
          point: '90%,45%'
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: 'Go home'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
# The root gate waits for Clerk to load over the network before it shows the sign-in screen.
- extendedWaitUntil:
    visible: 'Gửi mã'
    timeout: 90000
- assertVisible:
    id: 'auth-email'
- assertVisible: 'Tiếp tục với Google'
- takeScreenshot: expo-go-01-sign-in
