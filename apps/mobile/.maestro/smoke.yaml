appId: com.datamonsterr.taphoamini
---
# The app boots to the sign-in screen, a new person signs in through Clerk (email and code) and
# lands on the welcome screen, and a new store (real backend) opens the camera.
- runFlow: subflows/launch.yaml
- assertVisible: 'Gửi mã'
- assertVisible: 'Tiếp tục với Google'
- takeScreenshot: smoke-01-sign-in
- runFlow: subflows/sign-in.yaml
- assertVisible: 'Tạo cửa hàng'
- assertVisible: 'Tham gia bằng mã'
- takeScreenshot: smoke-02-welcome
- runFlow:
    file: subflows/create-store.yaml
    env:
      STORE_NAME: 'Tạp hóa Smoke'
      OWNER_NAME: 'Cô Ba'
- assertVisible: 'Giỏ hàng trống'
- takeScreenshot: smoke-03-camera
