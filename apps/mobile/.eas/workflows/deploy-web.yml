# Deploys the web build to EAS Hosting. It calls the backend at EXPO_PUBLIC_API_URL (EAS environment variable).
# Docs: https://docs.expo.dev/eas/hosting/workflows/
name: Deploy web

on:
  push:
    branches: ['main']
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '!**/*.md'
      - '!apps/mobile/.maestro/**'
      - '!apps/mobile/e2e-web/**'
      - '!apps/mobile/__tests__/**'
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  deploy:
    type: deploy
    name: Deploy web to EAS Hosting
    environment: production
    params:
      prod: true
