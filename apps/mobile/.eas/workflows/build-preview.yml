# Builds an internal Android APK only when native code changed: the fingerprint job hashes the
# native inputs, and get-build reuses an earlier preview build with the same hash.
# Docs: https://docs.expo.dev/eas/workflows/pre-packaged-jobs/#fingerprint
name: Build Android preview

on:
  push:
    branches: ['main']
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '!**/*.md'
      - '!apps/mobile/.maestro/**'
      - '!apps/mobile/e2e-web/**'
      - '!apps/mobile/__tests__/**'
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview
  get_build:
    name: Find preview build with same fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
  build_android:
    name: Build preview APK
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview
