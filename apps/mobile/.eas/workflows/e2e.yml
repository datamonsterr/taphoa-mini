name: Android e2e
on:
  pull_request:
    branches: ['*']
jobs:
  build_android:
    name: Build Android E2E APK
    type: build
    params:
      platform: android
      profile: e2e
  test_android:
    name: Run all Maestro flows
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - '.maestro/smoke.yaml'
        - '.maestro/journey.yaml'
        - '.maestro/camera.yaml'
        - '.maestro/checkout.yaml'
        - '.maestro/shop.yaml'
        - '.maestro/reports.yaml'
        - '.maestro/account.yaml'
