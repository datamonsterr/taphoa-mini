name: Deploy backend

# main: CI green -> deploy to Railway `test` -> seed -> e2e + latency -> deploy `production` -> smoke.
# workflow_dispatch: validate any ref, optionally promoting it after tests pass.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy to the test environment
        required: true
        default: main
        type: string
      keep_test_backend:
        description: Keep the test backend, Postgres and Redis running after this run
        required: false
        default: false
        type: boolean
      deploy_production:
        description: Promote the tested ref to production (emergency release or rollback)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RAILWAY_CLI_VERSION: 5.71.0

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No concurrency group: GitHub keeps one pending run per group and cancels older pending ones,
    # which kept cancelling branch validations. `wait_turn.py` queues runs FIFO by run id instead.
    permissions:
      contents: read
      actions: read
    outputs:
      deployed: ${{ steps.railway.outputs.configured }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      - name: Record checked out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for older runs using the test environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/wait_turn.py deploy.yml test railway-integration.yml:test
      - name: Skip superseded main revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$CI_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded revision $CI_SHA."
          fi
      - name: Check for Railway test credentials and URL
        id: railway
        if: steps.revision.outputs.current == 'true'
        env:
          RAILWAY_TOKEN_TEST: ${{ secrets.RAILWAY_TOKEN_TEST }}
          BACKEND_URL_TEST: ${{ vars.BACKEND_URL_TEST }}
        run: |
          if [ -z "$RAILWAY_TOKEN_TEST" ] || [ -z "$BACKEND_URL_TEST" ]; then
            echo "::notice::Secret RAILWAY_TOKEN_TEST or variable BACKEND_URL_TEST is not set; skipping the test deploy (see docs/deploy.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.railway.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Railway CLI
        if: steps.railway.outputs.configured == 'true'
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Check Railway test variable drift
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        # Read-only `railway config plan`; fails with variable names (never values) when the
        # backend variables differ from .railway/railway.ts. A human applies them (docs/deploy.md).
        run: |
          bash scripts/ci/install-railway-sdk.sh
          python3 -I scripts/ci/railway_drift.py test
      - name: Start Railway test Postgres and Redis
        id: services
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        run: |
          # Mark ownership before starting either service, so partial starts are cleaned up.
          echo "started=true" >> "$GITHUB_OUTPUT"
          python3 -I scripts/ci/railway_service.py up Postgres test
          python3 -I scripts/ci/railway_service.py up Redis test
          # SUCCESS is the deployment signal; give sockets a short readiness margin.
          # The healthz/readyz loop below checks actual backend dependency readiness.
          sleep 5
      - name: Deploy to Railway test
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        # `railway up --ci` hangs after a SKIPPED upload; the script detaches and polls instead.
        run: |
          # Runtime version for telemetry resource attributes (service.version).
          railway variable set --service backend --environment test --skip-deploys "SERVICE_VERSION=$(git rev-parse HEAD)"
          python3 -I scripts/ci/railway_deploy.py backend test
      - name: Wait for healthz and readyz
        if: steps.railway.outputs.configured == 'true'
        env:
          BACKEND_URL_TEST: ${{ vars.BACKEND_URL_TEST }}
        run: |
          scripts/ci/wait-healthy.sh "$BACKEND_URL_TEST"
          actual=$(curl --fail --silent --show-error "$BACKEND_URL_TEST/healthz" | jq -r '.service_version')
          expected=$(git rev-parse HEAD)
          test "$actual" = "$expected" || { echo "::error::Test serves $actual, expected $expected"; exit 1; }
      - uses: ./.github/actions/setup-rust
        if: steps.railway.outputs.configured == 'true'
        with:
          cache-key: test
      - name: Seed the test database
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
          # taphoa-seed creates or reuses Clerk test users through the Backend API.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: scripts/ci/seed-test.sh
      - uses: ./.github/actions/setup-js
        if: steps.railway.outputs.configured == 'true' && hashFiles('packages/e2e/package.json') != ''
      # Leaked users (the Android Maestro flows never delete theirs) eat into the development
      # instance's 100-user cap and make the suite fail with user_quota_exceeded.
      - name: Sweep stale Clerk e2e users
        if: steps.railway.outputs.configured == 'true' && hashFiles('packages/e2e/package.json') != ''
        continue-on-error: true
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm --filter @taphoa/e2e clerk:sweep --max-age-hours 2
      - name: End-to-end tests and latency probes
        if: steps.railway.outputs.configured == 'true'
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL_TEST }}
          LATENCY_P95_MS: ${{ vars.LATENCY_P95_MS || '200' }}
          # The e2e helpers create Clerk users and session tokens; run-e2e.sh fails fast without it.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: scripts/ci/run-e2e.sh
      - name: Remove Railway test backend
        if: always() && steps.services.outputs.started == 'true' && inputs.keep_test_backend != true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        run: python3 -I scripts/ci/railway_down.py backend test
      - name: Remove Railway test Redis
        if: always() && steps.services.outputs.started == 'true' && inputs.keep_test_backend != true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        run: python3 -I scripts/ci/railway_service.py down Redis test
      - name: Remove Railway test Postgres
        if: always() && steps.services.outputs.started == 'true' && inputs.keep_test_backend != true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TEST }}
        run: python3 -I scripts/ci/railway_service.py down Postgres test
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CONFIGURED: ${{ steps.railway.outputs.configured }}
          REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}
        run: |
          scripts/ci/job-summary.sh "deploy test + e2e" "ref = $REF" "railway configured = ${CONFIGURED:-false}"
          if [ "$JOB_STATUS" != success ] || [ "$CONFIGURED" != true ]; then
            echo 'Production was not deployed: test did not complete successfully.' >> "$GITHUB_STEP_SUMMARY"
          fi

  production:
    needs: test
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.test.outputs.deployed == 'true' &&
      (github.event_name == 'workflow_run' || inputs.deploy_production == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-railway-production
      cancel-in-progress: false
    steps:
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false
      - name: Skip superseded main revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$CI_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for Railway credentials
        id: railway
        if: steps.revision.outputs.current == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::RAILWAY_TOKEN is not set in the production environment."
            exit 1
          fi
      - uses: actions/setup-node@v7
        if: steps.railway.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install Railway CLI
        if: steps.railway.outputs.configured == 'true'
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - name: Check Railway production variable drift
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bash scripts/ci/install-railway-sdk.sh
          python3 -I scripts/ci/railway_drift.py production
      - name: Deploy the tested backend revision
        if: steps.railway.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Runtime version for telemetry resource attributes (service.version).
          railway variable set --service backend --skip-deploys "SERVICE_VERSION=$(git rev-parse HEAD)"
          python3 -I scripts/ci/railway_deploy.py backend
      - name: Post-deploy smoke test
        if: steps.railway.outputs.configured == 'true'
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo '::error::BACKEND_URL is required'; exit 1; }
          scripts/ci/wait-healthy.sh "$BACKEND_URL"
          actual=$(curl --fail --silent --show-error "$BACKEND_URL/healthz" | jq -r '.service_version')
          expected=$(git rev-parse HEAD)
          test "$actual" = "$expected" || { echo "::error::Served version $actual does not match $expected"; exit 1; }
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CONFIGURED: ${{ steps.railway.outputs.configured }}
        run: scripts/ci/job-summary.sh "deploy production" "railway configured = ${CONFIGURED:-false}"
