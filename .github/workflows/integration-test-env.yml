name: Integration test-env validation

# Integration branch only: seeds the Railway test database and runs the full e2e suite plus
# latency probes from a GitHub runner (close to Railway sfo). Not merged to main.
on:
  workflow_dispatch:
  push:
    branches: ['integration/**']
    paths:
      - '.github/workflows/integration-test-env.yml'
      - 'packages/e2e/**'

permissions:
  contents: read

concurrency:
  group: deploy-railway-test
  cancel-in-progress: false

jobs:
  seed-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL_TEST }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - name: Seed the test database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          echo "::add-mask::$DATABASE_URL"
          start=$(date +%s)
          # Credentials appear on stdout; keep them out of the logs.
          cargo run --locked --manifest-path apps/backend/Cargo.toml --bin taphoa-seed > /dev/null
          echo "seed duration $(( $(date +%s) - start ))s"
      - name: Row counts
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          {
            echo "### Seed row counts"
            echo '```'
            psql "$DATABASE_URL" -Atc "select table_name || ' ' || (xpath('/row/c/text()', query_to_xml('select count(*) c from public.'||quote_ident(table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-js
      - name: Full e2e suite and latency probes
        env:
          LATENCY_P95_MS: ${{ vars.LATENCY_P95_MS || '200' }}
        run: scripts/ci/run-e2e.sh
