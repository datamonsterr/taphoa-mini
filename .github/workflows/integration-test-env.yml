name: Integration test-env validation

# Integration branch only: runs the full e2e suite and latency probes from a GitHub runner
# (close to Railway sfo) against the test environment. Not merged to main.
on:
  workflow_dispatch:
  push:
    branches: ['integration/**']
    paths:
      - '.github/workflows/integration-test-env.yml'
      - 'packages/e2e/**'

permissions:
  contents: read

concurrency:
  group: deploy-railway-test
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL_TEST }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Full e2e suite and latency probes
        env:
          LATENCY_P95_MS: ${{ vars.LATENCY_P95_MS || '200' }}
        run: scripts/ci/run-e2e.sh
