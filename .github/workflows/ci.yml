name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Rust is covered by the rust jobs; Turborepo runs only the JS packages here.
      - run: pnpm lint --filter=@taphoa/mobile --filter=@taphoa/api-client
      - run: pnpm typecheck --filter=@taphoa/mobile --filter=@taphoa/api-client
      - run: pnpm lint:api
      - run: pnpm --filter @taphoa/api-client check:generated
      - run: pnpm test --filter=@taphoa/mobile --filter=@taphoa/api-client
      - run: pnpm --filter @taphoa/mobile build

  smoke-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      # Node 24 (.nvmrc) strips TypeScript types natively; the smoke script imports .ts directly.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prism mock of the OpenAPI contract through the typed client
        run: pnpm test:smoke:mock

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - name: Read repository Rust toolchain
        id: rust
        working-directory: .
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as f:
              toolchain = tomllib.load(f)['toolchain']
          print('channel=' + toolchain['channel'])
          print('components=' + ','.join(toolchain.get('components', [])))
          PY
      # Upstream has no major-version tags; pin the verified master revision.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: taphoa
          POSTGRES_PASSWORD: taphoa
          POSTGRES_DB: taphoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taphoa -d taphoa"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: taphoa-local
          RUSTFS_SECRET_KEY: taphoa-local-secret
          RUSTFS_CONSOLE_ENABLE: 'false'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9000/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://taphoa:taphoa@localhost:5432/taphoa
      REDIS_URL: redis://localhost:6379
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: taphoa-local
      AWS_SECRET_ACCESS_KEY: taphoa-local-secret
      AWS_S3_BUCKET_NAME: images
      AWS_DEFAULT_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      # Many suites create stores from one IP; raise the per-IP auth limits for the run.
      RATE_LIMIT_STORE_CREATE_PER_HOUR: '100000'
      RATE_LIMIT_JOIN_PER_HOUR: '100000'
      RATE_LIMIT_RECOVER_PER_10MIN: '100000'
    steps:
      - uses: actions/checkout@v7
      - name: Read repository Rust toolchain
        id: rust
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as f:
              toolchain = tomllib.load(f)['toolchain']
          print('channel=' + toolchain['channel'])
          print('components=' + ','.join(toolchain.get('components', [])))
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      # The per-IP limit test needs the default limits and fresh Redis counters, so it runs first.
      - name: Integration tests - default rate limits
        working-directory: apps/backend
        run: >-
          env -u RATE_LIMIT_STORE_CREATE_PER_HOUR -u RATE_LIMIT_JOIN_PER_HOUR -u RATE_LIMIT_RECOVER_PER_10MIN
          cargo test --locked -p taphoa-api -- --ignored --test-threads=1 validation_invite_expiry_and_ip_limits
      - name: Test real Postgres (migrations, auth, seed), Redis and RustFS
        working-directory: apps/backend
        run: cargo test --locked -p taphoa-api -- --ignored --test-threads=1 --skip validation_invite_expiry_and_ip_limits

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_MODELS: '1'
      EXPECT_SEGMENT_STATUS: '503'
      EXPECT_IMAGES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: SKIP_MODELS=1
          load: true
          tags: taphoa-mini-backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - run: docker compose up -d --wait --wait-timeout 120 postgres redis storage backend
      - run: apps/backend/scripts/e2e.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v --rmi local

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate all GitHub workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12
