name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @taphoa/mobile lint
      - run: pnpm --filter @taphoa/mobile typecheck
      - run: pnpm --filter @taphoa/mobile test
      - run: pnpm --filter @taphoa/mobile build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - name: Read repository Rust toolchain
        id: rust
        working-directory: .
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as f:
              toolchain = tomllib.load(f)['toolchain']
          print('channel=' + toolchain['channel'])
          print('components=' + ','.join(toolchain.get('components', [])))
          PY
      # Upstream has no major-version tags; pin the verified master revision.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  rust-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: taphoa
          POSTGRES_PASSWORD: taphoa
          POSTGRES_DB: taphoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taphoa -d taphoa"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://taphoa:taphoa@localhost:5432/taphoa
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - name: Read repository Rust toolchain
        id: rust
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('rust-toolchain.toml', 'rb') as f:
              toolchain = tomllib.load(f)['toolchain']
          print('channel=' + toolchain['channel'])
          print('components=' + ','.join(toolchain.get('components', [])))
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
      - name: Test real Postgres, pgvector migrations and Redis
        working-directory: apps/backend
        run: cargo test --locked -p taphoa-api --test readiness -- --ignored --nocapture

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_MODELS: '1'
      EXPECT_SEGMENT_STATUS: '503'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: SKIP_MODELS=1
          load: true
          tags: taphoa-mini-backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - run: docker compose up -d --wait --wait-timeout 120 postgres redis backend
      - run: apps/backend/scripts/e2e.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v --rmi local

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate all GitHub workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12
