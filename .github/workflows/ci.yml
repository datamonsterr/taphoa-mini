name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Decide which areas changed (a change to this file selects every area); unaffected jobs
  # are skipped and count as success in ci-ok.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
      eval: ${{ steps.filter.outputs.eval }}
      otel-collector: ${{ steps.filter.outputs.otel-collector }}
      posthog-infra: ${{ steps.filter.outputs.posthog-infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'apps/backend/**'
              - 'rust-toolchain.toml'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
              - 'scripts/ci/**'
            js:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'docs/api/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.prettier*'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-js/**'
            api:
              - 'docs/api/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            docker:
              - 'apps/backend/**'
              - 'rust-toolchain.toml'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            otel-collector:
              - 'infra/otel-collector/**'
              - '.github/workflows/ci.yml'
            posthog-infra:
              - 'infra/posthog/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'
              - 'scripts/ci/**'
            eval:
              - 'packages/eval/**'
              - 'apps/backend/crates/api/src/assistant/**'
              - 'apps/backend/crates/api/src/seed/**'
              - 'apps/backend/crates/api/src/bin/taphoa_seed.rs'
              - 'scripts/ci/build-backend-binary.sh'
              - 'scripts/ci/eval-ci.sh'
              - 'scripts/ci/eval-stack-lib.sh'
              - 'apps/backend/migrations/**'
              - '.github/workflows/ci.yml'

  # ---------- Rust ----------

  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: fmt
          cache: 'false'
      - run: cargo fmt --check
        working-directory: apps/backend
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "rust-fmt" "cargo fmt --check"

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/backend
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "rust-clippy" "cargo clippy --all-targets -D warnings"

  # Builds every test binary once; unit and integration jobs reuse the archive.
  # rust-build, rust-integration, backend-binary, mobile-test and web-e2e run on the Namespace
  # profile (faster CPU and disk; 4 vCPU, 8 GB). GitHub runners are free on this public repo,
  # so the light jobs stay on ubuntu-latest.
  rust-build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          nextest: 'true'
      - name: Build nextest archive
        working-directory: apps/backend
        run: cargo nextest archive --locked --workspace --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: apps/backend/nextest.tar.zst
          compression-level: 0
          retention-days: 3
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          size="n/a"
          if [ -f apps/backend/nextest.tar.zst ]; then size="$(du -h apps/backend/nextest.tar.zst | cut -f1)"; fi
          scripts/ci/job-summary.sh "rust-build (nextest archive)" "archive size: $size"

  rust-test:
    name: rust-test (${{ matrix.partition }}/2)
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      # Running from an archive needs no compiler; skip rustup installing the pinned toolchain.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: apps/backend
      - name: Unit tests
        working-directory: apps/backend
        run: >-
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap .
          --profile ci --partition count:${{ matrix.partition }}/2 --no-tests=pass
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 -I scripts/ci/junit_summary.py "rust-test ${{ matrix.partition }}/2" apps/backend/target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY"
          scripts/ci/job-summary.sh "rust-test ${{ matrix.partition }}/2 timing"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: junit-rust-test-${{ matrix.partition }}
          path: apps/backend/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  rust-integration:
    name: rust-integration (${{ matrix.partition }}/2)
    needs: rust-build
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: taphoa
          POSTGRES_PASSWORD: taphoa
          POSTGRES_DB: taphoa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taphoa -d taphoa"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: taphoa-local
          RUSTFS_SECRET_KEY: taphoa-local-secret
          RUSTFS_CONSOLE_ENABLE: 'false'
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9000/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      RUSTUP_TOOLCHAIN: stable
      # Many suites create stores from one IP; raise the per-IP auth limits for the run.
      RATE_LIMIT_STORE_CREATE_PER_HOUR: '100000'
      RATE_LIMIT_JOIN_PER_HOUR: '100000'
      DATABASE_URL: postgres://taphoa:taphoa@localhost:5432/taphoa
      REDIS_URL: redis://localhost:6379
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: taphoa-local
      AWS_SECRET_ACCESS_KEY: taphoa-local-secret
      AWS_S3_BUCKET_NAME: images
      AWS_DEFAULT_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: apps/backend
      # The per-IP limit test needs the default limits and fresh Redis counters, so it runs
      # first; everything else runs with the raised limits from the job env.
      # Bound test steps so the always() summary runs before the job timeout.
      - name: Integration tests - default rate limits
        if: matrix.partition == 1
        timeout-minutes: 2
        working-directory: apps/backend
        run: >-
          env -u RATE_LIMIT_STORE_CREATE_PER_HOUR -u RATE_LIMIT_JOIN_PER_HOUR
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap .
          --profile ci --run-ignored only --test-threads 1 --no-tests=pass
          -E 'test(validation_invite_expiry_and_ip_limits)'
      - name: Keep first JUnit report
        if: matrix.partition == 1
        run: cp apps/backend/target/nextest/ci/junit.xml apps/backend/target/nextest/ci/junit-limits.xml
      - name: Integration tests - everything else (real Postgres+pgvector, Redis, RustFS)
        timeout-minutes: 7
        working-directory: apps/backend
        run: >-
          cargo nextest run --archive-file nextest.tar.zst --workspace-remap .
          --profile ci --run-ignored only --test-threads 1 --no-tests=pass
          --partition count:${{ matrix.partition }}/2
          -E 'not test(validation_invite_expiry_and_ip_limits)'
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          summary_status=0
          python3 -I scripts/ci/junit_summary.py --budget-seconds 360 "rust-integration ${{ matrix.partition }}/2" apps/backend/target/nextest/ci/junit-limits.xml apps/backend/target/nextest/ci/junit.xml >> "$GITHUB_STEP_SUMMARY" || summary_status=$?
          scripts/ci/job-summary.sh "rust-integration timing"
          exit "$summary_status"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: junit-rust-integration-${{ matrix.partition }}
          path: apps/backend/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # SAM/DINO model tests (release build) with cached ONNX Runtime and weights.
  model-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: model
      - uses: actions/cache@v6
        id: models
        with:
          path: |
            apps/backend/models
            apps/backend/onnxruntime
          key: models-${{ hashFiles('apps/backend/scripts/fetch-models.sh', 'apps/backend/scripts/fetch-onnxruntime.sh') }}
      - name: Fetch ONNX Runtime and model weights
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          apps/backend/scripts/fetch-onnxruntime.sh
          apps/backend/scripts/fetch-models.sh
      - name: Model tests
        working-directory: apps/backend
        env:
          SAM_MAX_MS: '3000'
        run: |
          export ORT_DYLIB_PATH="$PWD/onnxruntime/lib/libonnxruntime.so.1.23.2"
          cargo test --locked -p taphoa-recognition --test model --release -- --test-threads=1 --nocapture
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "model-test" "SAM + DINO ONNX tests, SAM_MAX_MS=3000"

  # ---------- JavaScript ----------

  js-format:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: pnpm format:check
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "js-format" "prettier --check"

  js-lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      # Rust is covered by the rust jobs; Turborepo runs only the JS packages here.
      - run: pnpm lint --filter='!@taphoa/backend'
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "js-lint" "turbo run lint (JS packages)"

  js-typecheck:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: pnpm typecheck --filter='!@taphoa/backend'
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "js-typecheck" "turbo run typecheck (JS packages)"

  js-test:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      # packages/e2e needs a deployed backend: it must expose test:e2e (not test); the deploy workflow runs it.
      # The mobile app has its own parallel jobs (mobile-test with coverage).
      - run: pnpm test --filter='!@taphoa/backend' --filter='!@taphoa/mobile'
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "js-test" "turbo run test (JS packages, mobile excluded)"

  # ---------- Mobile app (all run in parallel; each needs only the pnpm install) ----------

  mobile-test:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Jest with coverage thresholds, timezone and script tests
        run: pnpm --filter @taphoa/mobile test:coverage
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "mobile-test" "jest --coverage (90/90/90/85), test:tz, test:scripts"

  # One export per platform, in parallel. android and web feed the bundle budget; ios only has
  # to export successfully.
  mobile-build:
    name: mobile-build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            script: build
            dist: dist/_expo/static/js
          - target: web
            script: build:web
            dist: dist-web
          - target: ios
            script: build:ios
            dist: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - if: matrix.target != 'web'
        run: pnpm --filter @taphoa/mobile ${{ matrix.script }}
      # The web export is shared with web-e2e, so it carries the e2e env values (embedded at
      # build time); the bundle budget is measured on this same export.
      - name: Export web with the e2e env
        if: matrix.target == 'web'
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          # voice.spec.ts opens /voice?fixture=<clip>: the e2e export honours the fixture param.
          EXPO_PUBLIC_VOICE_FIXTURES: '1'
        run: pnpm --filter @taphoa/mobile ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        if: matrix.dist != ''
        with:
          name: mobile-${{ matrix.target }}-export
          path: apps/mobile/${{ matrix.dist }}
          compression-level: 0
          retention-days: 1
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "mobile-build ${{ matrix.target }}" "expo export (${{ matrix.target }})"

  # Reuses the exports above; scripts/bundle-budget.mjs reads dist and dist-web.
  mobile-bundle:
    needs: mobile-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: actions/download-artifact@v8
        with:
          name: mobile-android-export
          path: apps/mobile/dist/_expo/static/js
      - uses: actions/download-artifact@v8
        with:
          name: mobile-web-export
          path: apps/mobile/dist-web
      - run: pnpm --filter @taphoa/mobile check:bundle
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "mobile-bundle" "bundle-budget.mjs (android hbc raw, web gzip)"

  mobile-doctor:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      # The SDK patch-version check compares against the latest Expo release, which pnpm's
      # minimumReleaseAge keeps out on purpose; Dependabot owns those bumps.
      - run: npx expo-doctor
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: '1'
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "mobile-doctor" "expo-doctor"

  api-contract:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: pnpm lint:api
      - run: pnpm --filter @taphoa/api-client check:generated
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "api-contract" "redocly lint openapi.yaml" "generated client up to date"

  smoke-mock:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      # Node 24 (.nvmrc) strips TypeScript types natively; the smoke script imports .ts directly.
      - name: Prism mock of the OpenAPI contract through the typed client
        run: pnpm test:smoke:mock
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "smoke-mock" "Prism mock + typed client"

  # ---------- Docker ----------

  # Release binary built in rust:1-bookworm (runtime glibc) with a persistent
  # cargo/target cache; docker-build then only wraps it, so the image build takes seconds.
  # The full cargo-chef Dockerfile used by Railway is verified in docker-full.yml.
  backend-binary:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .ci-cache
          key: backend-bin-${{ hashFiles('apps/backend/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            backend-bin-${{ hashFiles('apps/backend/Cargo.lock', 'rust-toolchain.toml') }}-
      - run: scripts/ci/build-backend-binary.sh
      - uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: |
            ci-bin/taphoa-api
            ci-bin/taphoa-seed
          retention-days: 3
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "backend-binary" "release build in rust-bookworm container"

  docker-build:
    needs: [changes, backend-binary]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: backend-binary
          path: ci-bin
      - run: chmod +x ci-bin/taphoa-api
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile.ci
          build-args: SKIP_MODELS=1
          tags: taphoa-mini-backend:dev
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci
      - name: Compress image for reuse
        run: zstd -T0 -3 --rm "$RUNNER_TEMP/image.tar" -o "$RUNNER_TEMP/image.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: ${{ runner.temp }}/image.tar.zst
          compression-level: 0
          retention-days: 3
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          size="n/a"
          if [ -f "$RUNNER_TEMP/image.tar.zst" ]; then size="$(du -h "$RUNNER_TEMP/image.tar.zst" | cut -f1)"; fi
          scripts/ci/job-summary.sh "docker-build" "image (zstd) size: $size" "layer cache: gha scope=backend-ci"

  docker-e2e:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECT_SEGMENT_STATUS: '503'
      EXPECT_IMAGES: '1'
      BACKEND_IMAGE: taphoa-mini-backend:dev
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: backend-image
          path: ${{ runner.temp }}
      - name: Load the image built by docker-build
        run: zstd -dc "$RUNNER_TEMP/image.tar.zst" | docker load
      # The backend verifies Clerk session JWTs against the JWKS of CLERK_PUBLISHABLE_KEY; compose
      # falls back to the (public) development key when the secret is empty on fork runs.
      - name: Start the compose stack
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: docker compose up -d --wait --wait-timeout 120 --no-build postgres redis storage backend
      # Store creation and the image round trip need a Clerk session token minted with the secret
      # key; without it (forks, dependabot) the script skips those checks with a notice.
      - name: Smoke checks
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: apps/backend/scripts/e2e.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/compose.log"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-e2e-logs
          path: ${{ runner.temp }}/compose.log
      - name: Clean up
        if: always()
        run: docker compose down -v
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "docker-e2e" "compose smoke = healthz, readyz, segment 503, image roundtrip"

  # ---------- Web E2E against the real backend ----------

  # Fork pull requests and dependabot runs get no repository secrets, and the web E2E signs in
  # through Clerk: only those two skip it (with a notice). Same-repo pull requests, pushes and
  # main must have both secrets, so blank ones fail this job (and ci-ok) with a clear message
  # instead of silently dropping the Clerk coverage.
  clerk-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for Clerk secrets
        id: check
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          SKIP_ALLOWED: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP_ALLOWED" = "true" ]; then
            echo "::notice::Secrets CLERK_SECRET_KEY and CLERK_PUBLISHABLE_KEY are not available (fork or dependabot run); skipping web-e2e."
          else
            echo "::error title=Clerk secrets missing::CLERK_SECRET_KEY and CLERK_PUBLISHABLE_KEY must both be set for web-e2e. Only fork pull requests and dependabot runs may skip it. Set them with gh secret set (see docs/deploy.md, Clerk identity)."
            exit 1
          fi

  # Playwright drives the exported web app against the prebuilt backend binary with SAM + DINO
  # models loaded. The binary is built in rust:bookworm (glibc 2.36); ubuntu-latest has a newer
  # glibc, and ONNX Runtime is loaded at run time (ort load-dynamic + ORT_DYLIB_PATH).
  web-e2e:
    needs: [changes, backend-binary, clerk-secrets, mobile-build]
    # !cancelled() keeps a skipped mobile-build (rust-only change) from skipping this job; the
    # web export is then missing and Playwright exports it itself.
    if: >-
      !cancelled() &&
      (needs.changes.outputs.js == 'true' || needs.changes.outputs.rust == 'true') &&
      needs.clerk-secrets.outputs.configured == 'true' &&
      needs.backend-binary.result == 'success'
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 30
    env:
      E2E_STATE_DIR: ${{ github.workspace }}/.e2e-stack
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: actions/download-artifact@v8
        with:
          name: backend-binary
          path: ci-bin
      - run: chmod +x ci-bin/taphoa-api
      - uses: actions/cache@v6
        id: models
        with:
          path: |
            apps/backend/models
            apps/backend/onnxruntime
          key: models-${{ hashFiles('apps/backend/scripts/fetch-models.sh', 'apps/backend/scripts/fetch-onnxruntime.sh') }}
      - name: Fetch ONNX Runtime and model weights
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          apps/backend/scripts/fetch-onnxruntime.sh
          apps/backend/scripts/fetch-models.sh
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/mobile
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: pnpm exec playwright install --with-deps chromium
      # Browser binaries come from the cache; the apt packages they need do not.
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/mobile
        run: pnpm exec playwright install-deps chromium
      # The export built by mobile-build (same EXPO_PUBLIC_* values as below). Absent on a
      # rust-only change, where mobile-build is skipped: Playwright then exports it itself.
      - uses: actions/download-artifact@v8
        id: web-export
        continue-on-error: true
        with:
          name: mobile-web-export
          path: apps/mobile/dist-web
      # The clip only depends on make-video.sh and the photo, so cache it (and skip installing
      # ffmpeg, which once took 728 s in apt).
      - uses: actions/cache@v6
        id: fake-camera
        with:
          path: |
            apps/mobile/e2e-web/fixtures/product.mjpeg
            apps/mobile/e2e-web/fixtures/product.jpg
          key: fake-camera-${{ hashFiles('apps/mobile/e2e-web/fixtures/make-video.sh', 'apps/backend/tests/fixtures/shelf-1600.jpg') }}
      - name: Fake camera clip from the product photo
        run: |
          if [ "${{ steps.fake-camera.outputs.cache-hit }}" != "true" ]; then
            command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            apps/mobile/e2e-web/fixtures/make-video.sh
          fi
          echo "PLAYWRIGHT_FAKE_VIDEO=$PWD/apps/mobile/e2e-web/fixtures/product.mjpeg" >> "$GITHUB_ENV"
      # The backend derives the Clerk issuer from CLERK_PUBLISHABLE_KEY and, with the secret key,
      # reads profiles from the Clerk Backend API.
      - name: Start backend stack (postgres, redis, storage, backend with models)
        env:
          BACKEND_BIN: ${{ github.workspace }}/ci-bin/taphoa-api
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: scripts/e2e/stack.sh up
      # Leaked users (the Android Maestro flows never delete theirs) eat into the development
      # instance's 100-user cap.
      - name: Sweep stale Clerk e2e users
        continue-on-error: true
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm --filter @taphoa/e2e clerk:sweep --max-age-hours 2
      # The export embeds EXPO_PUBLIC_API_URL and EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: the app and
      # the specs talk to the backend that stack.sh started on :8080, and the app signs in through
      # the same Clerk instance. The specs create users with the secret key (Backend API) and
      # CLERK_PUBLISHABLE_KEY (@clerk/testing). PLAYWRIGHT_FAKE_VIDEO (set above) is the fake
      # camera's clip.
      - name: Playwright web E2E
        env:
          E2E_WEB_EXPORT_READY: ${{ steps.web-export.outcome == 'success' && '1' || '0' }}
          EXPO_PUBLIC_API_URL: http://localhost:8080
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter @taphoa/mobile test:e2e:web
      - name: Backend log
        if: failure()
        run: tail -n 200 "$E2E_STATE_DIR/backend.log" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-e2e-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/e2e-web/test-results
            .e2e-stack/backend.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop backend stack
        if: always()
        run: scripts/e2e/stack.sh down
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "web-e2e" "Playwright chromium + real backend with SAM/DINO models"

  # ---------- Assistant evaluation (epic X7) ----------

  # Smoke set (25 golden cases, packages/eval). Two modes, picked by scripts/ci/eval-ci.sh:
  #   live: the assistant (X3) and Clerk identity (X1, members.clerk_user_id) are in the checkout
  #         and the secrets are available (not a fork PR). A
  #         local stack (compose postgres + redis, taphoa-seed --profile eval, the prebuilt
  #         backend with ASSISTANT_ALLOW_EVAL_HEADERS=1) answers the cases. The shared free
  #         OpenRouter quota pays for it, so a newer push cancels the run. PostHog gets nothing
  #         from pull requests; the nightly workflow eval.yml sends the events.
  #   stub: otherwise, a dry run against the in-process stub assistant: no network, no secrets.
  assistant-eval-smoke:
    needs: [changes, backend-binary]
    if: needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: assistant-eval-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Pick live or stub mode
        id: mode
        env:
          EVAL_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
          EVAL_HAVE_SECRETS: ${{ secrets.OPENROUTER_API_KEY != '' && secrets.CLERK_SECRET_KEY != '' && secrets.CLERK_PUBLISHABLE_KEY != '' }}
        run: scripts/ci/eval-ci.sh mode
      - name: Dry run against the stub assistant
        if: steps.mode.outputs.mode == 'stub'
        run: pnpm --filter @taphoa/eval run smoke -- --stub --out "$RUNNER_TEMP/eval"
      - uses: actions/download-artifact@v8
        if: steps.mode.outputs.mode == 'live'
        with:
          name: backend-binary
          path: ci-bin
      - name: Make the binaries executable
        if: steps.mode.outputs.mode == 'live'
        run: chmod +x ci-bin/taphoa-api ci-bin/taphoa-seed
      # Starts compose postgres + redis, runs `taphoa-seed --profile eval`, starts the backend
      # and waits for /readyz. Appends BACKEND_URL and EVAL_DATABASE_URL to $GITHUB_ENV.
      - name: Start the eval stack
        if: steps.mode.outputs.mode == 'live'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: scripts/ci/eval-ci.sh up
      # Pre-flight: the seed linked Clerk test users to the eval store's members (epic X1); mint
      # one token per role and fail here, with the missing email, when a user is absent. Clerk
      # session tokens live about 60 s, so no token is exported: the run step gets
      # CLERK_SECRET_KEY and ClerkAuth (packages/eval/src/runner/auth.ts) mints and refreshes
      # them during the run, within the Backend API budget of 100 requests per 10 s.
      - name: Check eval identities
        if: steps.mode.outputs.mode == 'live'
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: pnpm --filter @taphoa/eval run identities
      # BACKEND_URL and EVAL_DATABASE_URL come from the stack step. Without EVAL_LEAD_TOKEN the
      # harness mints the Clerk tokens itself from CLERK_SECRET_KEY (store: the eval default).
      - name: Smoke run against the local stack
        if: steps.mode.outputs.mode == 'live'
        env:
          OPENROUTER_EVAL_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        # A run that finishes but misses a pass bar is the free models' and the assistant's score,
        # not a broken stack: it is reported (annotation, summary, artifact) and the nightly
        # workflow eval.yml enforces the bars. A refused or aborted run still fails the job.
        run: |
          pnpm --filter @taphoa/eval run smoke -- --concurrency 1 --no-posthog --out "$RUNNER_TEMP/eval" 2>&1 | tee "$RUNNER_TEMP/eval-smoke.log"
          rc=${PIPESTATUS[0]}
          # The shared free quota (1,000 requests a day) can be spent by other runs: not a failure.
          if [ "$rc" -eq 1 ] && grep -q 'free quota too low' "$RUNNER_TEMP/eval-smoke.log"; then
            echo "::warning title=Assistant eval::skipped, the shared OpenRouter free quota is used up for today"
            exit 0
          fi
          if [ "$rc" -eq 1 ] && grep -qs '^- Result: FAIL' "$RUNNER_TEMP"/eval/*.md; then
            echo "::warning title=Assistant eval::smoke run finished below the pass bars; see the job summary"
            exit 0
          fi
          exit "$rc"
      - name: Results to the job summary
        if: always()
        run: scripts/ci/eval-ci.sh summary "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-smoke-results
          path: ${{ runner.temp }}/eval
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure() && steps.mode.outputs.mode == 'live'
        with:
          name: eval-smoke-stack-logs
          path: ${{ runner.temp }}/taphoa-eval-stack/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the eval stack
        if: always() && steps.mode.outputs.mode == 'live'
        run: scripts/ci/eval-ci.sh down
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVAL_MODE: ${{ steps.mode.outputs.mode }}
        run: scripts/ci/job-summary.sh "assistant-eval-smoke" "mode = ${EVAL_MODE:-not decided}" "golden smoke set (packages/eval)"

  # ---------- OpenTelemetry Collector ----------

  otel-collector:
    needs: changes
    if: needs.changes.outputs.otel-collector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate collector config
        run: infra/otel-collector/validate.sh
      - name: Collector routing and redaction tests
        run: python3 -m unittest discover -s infra/otel-collector/tests -v
      - name: Build collector image
        run: docker build -f infra/otel-collector/Dockerfile .
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "otel-collector" "collector 0.163.2 validate, Docker routing tests and image build"

  # ---------- PostHog dashboards as code ----------

  posthog-infra:
    needs: changes
    if: needs.changes.outputs.posthog-infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: PostHog controller, product and LLM definitions tests
        run: node --test infra/posthog/tests
      - name: LLM pricing and judge tests
        run: node --test infra/posthog/llm/*.test.mjs
      - name: Offline product and LLM dashboard plan
        run: node infra/posthog/apply.mjs --dry-run --offline
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "posthog-infra" "Node tests and offline PostHog plan (no credentials or network)"

  # ---------- Workflows and CI scripts ----------

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate all GitHub workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "actionlint" "rhysd/actionlint 1.7.12"

  ci-scripts:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Unit tests for scripts/ci
        run: python3 -I -m unittest discover -s scripts/ci -v
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "ci-scripts" "python3 -m unittest scripts/ci"

  # Single required check for branch protection.
  ci-ok:
    if: always()
    needs:
      - changes
      - rust-fmt
      - rust-clippy
      - rust-build
      - rust-test
      - rust-integration
      - model-test
      - js-format
      - js-lint
      - js-typecheck
      - js-test
      - mobile-test
      - mobile-build
      - mobile-bundle
      - mobile-doctor
      - api-contract
      - smoke-mock
      - backend-binary
      - docker-build
      - docker-e2e
      - clerk-secrets
      - web-e2e
      - assistant-eval-smoke
      - actionlint
      - ci-scripts
      - otel-collector
      - posthog-infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
      - name: Job timing table
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI job timings"
            echo
            echo "| Job | Result | Duration |"
            echo "| --- | --- | --- |"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.name != "ci-ok" and .completed_at != null) | "| \(.name) | \(.conclusion) | \((.completed_at | fromdate) - (.started_at | fromdate))s |"'
          } >> "$GITHUB_STEP_SUMMARY"
