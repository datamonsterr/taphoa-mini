name: Android APK

# Manual fallback for an installable Android APK when EAS Build is unavailable (the Free plan's
# monthly Android builds are used up). Builds a release APK on the runner, the same way the apk job
# in android-e2e.yml does, but for real phones: ARM ABIs and a real backend over HTTPS.
# The APK is signed with the Expo template's debug keystore, so it does not upgrade an EAS-built
# install: uninstall that app first.
# Each build gets versionCode = run number (newer builds install over older ones) and a version
# name like 1.0.0-test.42+e502744. Test builds are also published as a GitHub prerelease
# (tag apk-test-<run>) with the APK attached, so a phone downloads it without a GitHub login.
# Production builds stay workflow artifacts and are never published.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend the app talks to
        type: choice
        options:
          - test
          - production
        default: test

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: namespace-profile-linux-xl
    timeout-minutes: 30
    permissions:
      # gh release create for test builds.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile

      # Same URLs as the preview and production profiles in apps/mobile/eas.json.
      - name: Pick backend
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          if [ "$BACKEND" = production ]; then
            echo "EXPO_PUBLIC_API_URL=https://backend-production-5f5c.up.railway.app" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_ENVIRONMENT=production" >> "$GITHUB_ENV"
          else
            echo "EXPO_PUBLIC_API_URL=https://backend-test-70c2.up.railway.app" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_ENVIRONMENT=test" >> "$GITHUB_ENV"
          fi

      # Read by app.config.ts, so prebuild writes them into android/app/build.gradle.
      - name: Stamp version
        env:
          BACKEND: ${{ inputs.backend }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(jq -r .expo.version apps/mobile/app.json)"
          name="${base}-${BACKEND}.${RUN_NUMBER}+${GITHUB_SHA::7}"
          {
            echo "APP_VERSION_CODE=${RUN_NUMBER}"
            echo "APP_VERSION_NAME=${name}"
            echo "APK_NAME=taphoa-mini-${name%%+*}.apk"
          } >> "$GITHUB_ENV"
          echo "::notice title=APK version::${name} (versionCode ${RUN_NUMBER})"

      # The runner has no committed android/ project (CNG): generate it from app.config.ts.
      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # assembleRelease bundles the JS (Hermes) into the APK, so it boots without Metro.
      # The EXPO_PUBLIC_* values are inlined into that bundle here.
      - name: Build release APK
        env:
          # Public by design; the bundle embeds it so ClerkProvider talks to the same instance.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Name APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"

      # APKs are already compressed, so skip zip compression.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: taphoa-mini-${{ inputs.backend }}-apk
          path: dist/*.apk
          retention-days: 14
          compression-level: 0

      # The QR encodes the APK's direct download URL: scan it with the phone camera to install.
      - name: Publish test prerelease
        if: inputs.backend == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          tag="apk-test-${RUN_NUMBER}"
          apk_url="${RELEASES}/${tag}/${APK_NAME}"
          # Outside the pnpm workspace, so npm resolves the pinned package on its own.
          (cd "$RUNNER_TEMP" && npm exec --yes --package=qrcode@1.5.4 -- qrcode --width 480 --output "$GITHUB_WORKSPACE/dist/install-qr.png" "$apk_url")
          cat > dist/notes.md <<NOTES
          Release APK built from ${GITHUB_SHA::7} against the Railway test backend (versionCode ${RUN_NUMBER}).

          **Install:** scan with the phone camera, or open [${APK_NAME}](${apk_url}) on the phone.

          ![Install QR](${RELEASES}/${tag}/install-qr.png)

          Signed with the debug keystore: uninstall an EAS-built app before installing. Builds from this workflow install over each other.

          Build log: ${RUN_URL}
          NOTES
          sed -i 's/^          //' dist/notes.md
          gh release create "$tag" "dist/${APK_NAME}" dist/install-qr.png \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android test APK ${APP_VERSION_NAME}" \
            --notes-file dist/notes.md
          release_url="$(gh release view "$tag" --json url -q .url)"
          echo "::notice title=Prerelease::${release_url}"
          {
            echo "## Android test APK ${APP_VERSION_NAME}"
            echo "[Release page](${release_url}) · [Direct APK](${apk_url})"
            echo
            echo "![Install QR](${RELEASES}/${tag}/install-qr.png)"
          } >> "$GITHUB_STEP_SUMMARY"
