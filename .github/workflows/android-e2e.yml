name: Android E2E

# Free alternative to EAS Workflows Maestro jobs (those need a paid Expo plan).
# Builds a release-like APK on the runner and drives it with Maestro on an emulator.
# The app talks to the real backend (with SAM/DINO models) that scripts/e2e/stack.sh starts on
# the runner; the emulator reaches the runner as 10.0.2.2. Cost: the APK is built once (apk job),
# then two emulator shards each download it, start their own backend stack (~250 MB of models, the
# binary comes from the backend-binary job) and run half of the flows, so inference shares 4 cores
# with the emulator on each shard. If that proves too slow or flaky, drop the pull_request trigger
# and keep workflow_dispatch only.

on:
  # Only changes that can affect the app or the backend it talks to; docs-only PRs skip it.
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/**'
      - 'packages/**'
      - 'scripts/e2e/**'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-e2e.yml'
      - '.github/actions/**'
      - '!**/*.md'
      - '!apps/mobile/e2e-web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork pull requests and dependabot runs get no repository secrets, and the app signs in
  # through Clerk: only those two skip both jobs (with a notice). Same-repo pull requests and
  # manual runs must have both secrets, so blank ones fail this job with a clear message
  # instead of silently dropping the Clerk coverage.
  clerk-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for Clerk secrets
        id: check
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          SKIP_ALLOWED: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "$CLERK_SECRET_KEY" ] && [ -n "$CLERK_PUBLISHABLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP_ALLOWED" = "true" ]; then
            echo "::notice::Secrets CLERK_SECRET_KEY and CLERK_PUBLISHABLE_KEY are not available (fork or dependabot run); skipping the Android E2E jobs."
          else
            echo "::error title=Clerk secrets missing::CLERK_SECRET_KEY and CLERK_PUBLISHABLE_KEY must both be set for the Android E2E jobs. Only fork pull requests and dependabot runs may skip them. Set them with gh secret set (see docs/deploy.md, Clerk identity)."
            exit 1
          fi

  # Same prebuilt binary as ci.yml: built in rust:1-bookworm with a persistent cargo/target
  # cache, so maestro never runs a cold cargo build on the emulator runner.
  # The heavy jobs run on Namespace profiles (faster CPU and disk, KVM without setup):
  # backend-binary on 4 vCPU / 8 GB, the emulator jobs on 8 vCPU / 16 GB. GitHub runners are free
  # on this public repo, so the light jobs stay on ubuntu-latest.
  backend-binary:
    needs: clerk-secrets
    if: needs.clerk-secrets.outputs.configured == 'true'
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start job timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .ci-cache
          key: backend-bin-${{ hashFiles('apps/backend/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            backend-bin-${{ hashFiles('apps/backend/Cargo.lock', 'rust-toolchain.toml') }}-
      - run: scripts/ci/build-backend-binary.sh
      - uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: ci-bin/taphoa-api
          retention-days: 3
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: scripts/ci/job-summary.sh "backend-binary" "release build in rust-bookworm container"

  # The APK is built here, once, and every maestro shard downloads it. Gradle (plus the Kotlin
  # daemon) never shares a machine with the emulator: together with a 4 GB emulator and the backend
  # with its models they starved the whole VM and the emulator crashed.
  apk:
    needs: clerk-secrets
    if: needs.clerk-secrets.outputs.configured == 'true'
    runs-on: namespace-profile-linux-xl
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile

      # The runner has no committed android/ project (CNG): generate it from app.json.
      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # assembleRelease, not assembleDebug: the release variant bundles the JS (Hermes) into the
      # APK, so the app boots without a Metro server; a debug APK would show the dev launcher.
      # The Expo template signs release with the debug keystore, so it installs as-is.
      # x86_64 only (emulator ABI) and no R8 keep the build short.
      # Release builds block cleartext HTTP; the backend on 10.0.2.2 is plain HTTP.
      - name: Allow cleartext traffic to the CI backend
        run: sed -i 's|<application |<application android:usesCleartextTraffic="true" |' apps/mobile/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
          # Public by design; the bundle embeds it so ClerkProvider talks to the same instance.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=x86_64
          -Pandroid.enableMinifyInReleaseBuilds=false

      # APKs are already compressed, so skip zip compression.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0

  # Two emulator shards. Baseline durations from the last green run (flows run in this order):
  #   a: multi-session 312 s + onboarding 127 s + assistant 99 s + smoke 68 s = 606 s
  #   b: quick-enroll 225 s + inventory 201 s + debts 173 s + checkout 149 s = 748 s
  # Rebalance by moving a flow between the `flows` lists. Paths are relative to apps/mobile and must
  # not contain spaces: the list is word-split by the shell in the emulator step.
  maestro:
    name: maestro (${{ matrix.shard }})
    needs: [clerk-secrets, backend-binary, apk]
    if: needs.clerk-secrets.outputs.configured == 'true'
    runs-on: namespace-profile-linux-xl
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            flows: .maestro/multi-session.yaml .maestro/onboarding.yaml .maestro/assistant.yaml .maestro/smoke.yaml
          - shard: b
            flows: .maestro/quick-enroll.yaml .maestro/inventory.yaml .maestro/debts.yaml .maestro/checkout.yaml
    env:
      MAESTRO_VERSION: 2.11.0
      # Opt out of Maestro telemetry and the update/analyze banners in CI logs.
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      # Only the jank budget script needs Node (no npm dependencies), so no pnpm install or cache.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Maestro runs on a JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v8
        with:
          name: backend-binary
          path: ci-bin
      - run: chmod +x ci-bin/taphoa-api
      # Lands where the old in-job Gradle build wrote it, so the emulator step path is unchanged.
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release
      - uses: actions/cache@v6
        id: models
        with:
          path: |
            apps/backend/models
            apps/backend/onnxruntime
          key: models-${{ hashFiles('apps/backend/scripts/fetch-models.sh', 'apps/backend/scripts/fetch-onnxruntime.sh') }}
      # Postgres, Redis, RustFS in compose plus the release backend on :8080 (all interfaces).
      # S3 URLs are presigned for 10.0.2.2 so the emulator can download images.
      - name: Start backend stack
        env:
          BACKEND_BIN: ${{ github.workspace }}/ci-bin/taphoa-api
          E2E_PUBLIC_HOST: 10.0.2.2
          # Request lines (method, path, status) so a failed save in a flow shows in the log.
          RUST_LOG: info,tower_http=debug
          # The backend verifies the app's Clerk session JWTs (issuer from the publishable key).
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: scripts/e2e/stack.sh up

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Namespace runners expose a writable /dev/kvm and have no udev; the rule is only for
      # GitHub-hosted runners, where /dev/kvm is root-only until udev reloads.
      - name: Enable KVM
        run: |
          if [ -w /dev/kvm ]; then echo "/dev/kvm is writable; no udev rule needed"; exit 0; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Read a future emulator crash against these numbers.
      - name: Runner resources
        run: |
          nproc
          free -m
          df -h /

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          # Modern phone (~411x914 dp) so the main run matches the design target; small-screen layout is covered by jest.
          profile: pixel_7
          arch: x86_64
          disable-animations: true
          # The default 2 cores / 2 GB make the launcher itself hit ANRs under load.
          cores: 4
          ram-size: 4096M
          # virtualscene: the emulated back camera renders a 3D scene, so capture returns a real image.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back virtualscene
          script: apps/mobile/scripts/e2e-android.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ matrix.flows }}

      - name: Backend log
        if: always()
        run: tail -n 200 .e2e-stack/backend.log || true

      - name: Stop backend stack
        if: always()
        run: scripts/e2e/stack.sh down

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report-${{ matrix.shard }}
          path: apps/mobile/maestro-report.xml
          if-no-files-found: warn

      # Screenshots (one per screen), commands.json and logs.
      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-${{ matrix.shard }}
          path: |
            apps/mobile/maestro-debug
            ~/.maestro/tests
          if-no-files-found: warn

      # The backend's own view of each request (status, multipart rejections, panics).
      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-backend-log-${{ matrix.shard }}
          path: .e2e-stack/backend.log
          include-hidden-files: true
          if-no-files-found: warn

      # Raw `dumpsys gfxinfo` used by the jank budget (scripts/gfxinfo-budget.mjs).
      - name: Upload gfxinfo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gfxinfo-${{ matrix.shard }}
          path: apps/mobile/gfxinfo.txt
          if-no-files-found: warn

  # Proves the app previews in Expo Go (dev client from Metro, no native build): Metro runs on
  # the runner, Expo Go on the emulator loads it over 10.0.2.2.
  expo-go:
    needs: clerk-secrets
    if: needs.clerk-secrets.outputs.configured == 'true'
    runs-on: namespace-profile-linux-xl
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CI=1 turns off the interactive prompts and file watching. REACT_NATIVE_PACKAGER_HOSTNAME
      # makes the manifest point at 10.0.2.2, the emulator's alias for the runner.
      - name: Start Metro for Expo Go
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          REACT_NATIVE_PACKAGER_HOSTNAME: 10.0.2.2
          # Public by design; Metro inlines EXPO_PUBLIC_* so the app can start ClerkProvider.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: nohup npx expo start --go --port 8081 --host lan > "$RUNNER_TEMP/metro.log" 2>&1 &

      - name: Wait for Metro
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8081/status | grep -q 'packager-status:running'; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      # Build the Android bundle once now so Expo Go does not wait on the first Metro transform.
      - name: Pre-warm Android bundle
        run: |
          launch_url="$(curl -fsS -H 'expo-platform: android' -H 'accept: application/expo+json' http://localhost:8081 \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).launchAsset.url")"
          # The manifest names 10.0.2.2; fetch the same path from the runner's loopback.
          curl -fsS --max-time 900 -o /dev/null -w 'bundle: HTTP %{http_code}, %{size_download} bytes\n' \
            "${launch_url//10.0.2.2/localhost}"

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Namespace runners expose a writable /dev/kvm and have no udev; the rule is only for
      # GitHub-hosted runners, where /dev/kvm is root-only until udev reloads.
      - name: Enable KVM
        run: |
          if [ -w /dev/kvm ]; then echo "/dev/kvm is writable; no udev rule needed"; exit 0; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Expo Go preview on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          profile: pixel_7
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 4096M
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -camera-back virtualscene
          script: apps/mobile/scripts/e2e-expo-go.sh

      - name: Upload Expo Go screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo-go-debug
          path: |
            apps/mobile/maestro-expo-go-debug
            apps/mobile/maestro-expo-go-report.xml
          if-no-files-found: warn

      - name: Upload Metro log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo-go-metro-log
          path: ${{ runner.temp }}/metro.log
          if-no-files-found: warn
