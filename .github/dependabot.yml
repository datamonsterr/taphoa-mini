version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Versions pinned by the Expo SDK; upgrade them with `npx expo install --fix`
    # (checked by `expo-doctor` in CI), not one by one.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: jest-expo
  - package-ecosystem: cargo
    directory: /apps/backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/mobile
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
