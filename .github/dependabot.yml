version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Versions pinned by the Expo SDK; upgrade them with `npx expo install --fix`
    # (checked by `expo-doctor` in CI), not one by one.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: '@expo/*'
      - dependency-name: jest-expo
      # Expo-pinned too; its 3.x bump removed the Jest mock path that
      # apps/mobile/src/test/setup.tsx relies on.
      - dependency-name: '@react-native-async-storage/*'
  - package-ecosystem: cargo
    directory: /apps/backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/mobile
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
